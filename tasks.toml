notes = "2026-08-07: Vendored from rcpch/growth-references (github.com/rcpch/growth-references, uk-who/UK_WHO_0_20_preterm.csv, commit c13ee6983f94cb4c74f257bf70a62958cd5e3bc4). Rows filtered to age_days 0-730: British1990-tagged rows for day 0/7, WHO2006-tagged rows for day 14-730 (day-14 handover per SPEC 5.1 'WHO standard from 2 weeks'); the source's preterm/gestational-tracking extension (23-39 weeks gestation) was dropped since this table only serves postnatal corrected-age lookups (D5 clamps corrected age to >=0, never looks up gestational age directly), and the source's duplicate age=730 'standing height' row (its 2-5y series) was dropped in favour of the 0-2y 'recumbent length' row. Units converted to match reference/lms.py (weight kg->g, length/head-circ cm->mm); L/S left unscaled. Full derivation and unit/row-selection rationale recorded in reference/VERSION. scripts/test.sh, lint.sh, check_layers.sh all green; new test asserts the real vendored table parses with full 6-series birth->2y coverage. NOT independently verified against published chart values - that's R4's job (oracle vectors), still blocked pending its own vectors. Licence: per explicit instruction this is vendored for personal, non-distributed use; the MRC licence covering the British1990-derived series was not obtained or checked - see VERSION for the caveat before any wider distribution. Downstream: R4 (now unblockable) then G1/U5/C3, and CENTILE_CROSS stops being silent."

