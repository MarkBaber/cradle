description = "Vendor weight/length/head-circ LMS rows, both sexes, birth->2y (UK-WHO composition). VERSION records source files, retrieval date, licence."
exit_criteria = ["CSV parses; monotone age coverage per (measure,sex) (test)", "VERSION provenance complete"]
notes = "BLOCKED - architect action required. UK-WHO LMS coefficients could not be vendored: no network egress in the authoring sandbox, and the values are not reproducible from memory. They were deliberately NOT synthesised: fabricated coefficients would render plausible-looking centiles on a chart used to judge newborn weight loss. Obtain the tables from RCPCH (UK-WHO 0-4y chart data) or the WHO Child Growth Standards LMS files, record source filenames + retrieval date + licence in reference/VERSION, then unblock R4/U5. 2026-08-04: architect confirmed the source files are obtainable, so this is scheduled work rather than an open question. Drop the files in reference/data/ukwho_lms.csv with columns measure,sex,age_days,L,M,S and fill in VERSION; the loader in reference/lms.py already validates shape, rejects duplicate ages and refuses to approximate, so a bad table fails loudly at startup rather than rendering a wrong centile. Downstream: R4 then G1/U5/C3, and CENTILE_CROSS stops being silent."

