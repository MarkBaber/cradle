# ================= Remediation & hardening (2026-08-04 codebase review) =================
# Ordering rationale: the priority set by the architect is "safe to use on a real
# baby". That puts false alerts and unenterable clinical fields ahead of SPEC
# completeness. O2/Q2 come first regardless, because the Definition of Done names
# CI as the sole arbiter and no pipeline has ever run.

[[task]]
id = "O2"
phase = 0
title = "Initialise the git repository and .gitignore"
status = "review"
routing = "architect"
depends = []
touches = [".gitignore", "docs/SPEC.md"]
description = "There is no .git directory. The constitution mandates one task per branch, squash-merge and a green main, and the Definition of Done makes CI the sole arbiter - none of which can hold without a repository, and the GitLab pipeline in .gitlab-ci.yml has therefore never run once. Initialise the repo, add a .gitignore, and push so the pipeline executes. Ignore at minimum: .venv/, __pycache__/, .pytest_cache/, .ruff_cache/, .idea/, data/*.db*, backups/, junit.xml. data/cradle.db and its -wal/-shm sidecars are live working files and a private health record; they must never enter history."
exit_criteria = ["git repository initialised with a first commit that excludes every generated and private artefact above", "git status clean on a fresh checkout after scripts/test.sh runs", "pipeline runs on the remote and its result is recorded in the tasks it arbitrates"]
notes = "Do this before Q2: the point of Q2 is a green pipeline, which cannot be observed until there is a repository to run it on. Check that data/cradle.db is absent from the first commit before pushing anywhere - a newborn's feeding and weight record is not something to un-publish later. 2026-08-04: repository initialised on main, .gitignore written before `git init` so no generated artefact was ever staged; 115 files in the initial commit, verified to exclude data/, backups/, .venv/, __pycache__/, junit.xml, .idea/ and the tool caches. Two decisions worth knowing: (1) the data/ and backups/ patterns are anchored to the repo root, because an unanchored `data/` also matches src/cradle/reference/data/ and would have silently excluded the UK-WHO LMS table R2 is about to populate; (2) vendored JS (static/vendor/*.js) is ignored rather than committed, consistent with README install step scripts/vendor_assets.sh and with U8/R5 pinning the fetch by checksum - vendor/README.md stays tracked so the directory survives a clone. Held at review: the third exit criterion needs a remote, which does not exist yet. Add one, push, and record the pipeline result before this moves to done."

[[task]]
id = "Q2"
phase = 0
title = "Make the CI pipeline green"
status = "review"
routing = "impl"
depends = ["O2"]
touches = ["src/", "tests/", "scripts/lint.sh", "pyproject.toml"]
description = "Every CI stage currently fails, so the 14 tasks sitting at status review have no arbiter. Three separate failures: (1) validate runs `ruff format --check src tests` and 50 of 69 files would be reformatted - the repo has never been formatted; (2) `ruff check` reports 9 errors, mostly unsorted imports in app.py, deps.py, models/__init__.py; (3) `mypy` reports 6 errors - a missing return annotation and an untyped apscheduler import in ports/scheduler.py, `Returning Any` in reference/lms.py, two int|None assignments in services/series_service.py, and `object not callable` in ports/notifier.py where the injected poster seam is typed `object`. Fix all three. The notifier poster should become a Callable Protocol rather than `object`, since that seam is the ntfy test double."
exit_criteria = ["ruff format --check src tests clean", "scripts/lint.sh green (ruff check + mypy strict)", "scripts/test.sh still green afterwards", "apscheduler stub handling recorded in pyproject.toml rather than silenced per-line"]
notes = "Run `ruff format` as its own commit, separate from the lint and mypy fixes, so the type changes stay reviewable. Note this necessarily reformats files outside any one task's touches; that is the intended one-off exception and the reason it is its own task rather than being smuggled into feature diffs. 2026-08-04: all four exit criteria met locally - ruff format (51 files, own commit), 9 ruff lint errors, 6 mypy errors, 208 tests still green, check_layers green, and the offline runner green too. Three fixes worth recording rather than reading back out of the diff. (1) notifier.py gained a Poster Protocol replacing `poster: object`, so the injected test double must now accept the call the adapter actually makes; httpx.post satisfies it unchanged. (2) lms.py value_at_z wraps its result in float() because `float ** float` is typed Any in typeshed (it may return complex) - the guard above it already proves this one cannot. (3) series_service.ribbon bound `i` first as an int from _spans_across_days and then reused it for index.get, which returns int|None; the later loops use a separate name so the None case stays visible rather than being silenced. Held at review for the same reason as O2: no remote exists, so no pipeline has arbitrated this."

[[task]]
id = "A9"
phase = 3
title = "Weight rules must read weight measurements only"
status = "review"
routing = "impl"
depends = ["A5"]
touches = ["src/cradle/alerts/rules.py", "tests/unit/test_rules_weight.py", "tests/unit/test_rules_misc.py"]
description = "alerts_service.facts() passes every growth row into FactSet.growth, and WEIGHT_LOSS_10PC, WEIGHT_NOT_REGAINED, CENTILE_CROSS and WEIGH_IN_DUE all took weights[-1] from that mixed list. Length and head circumference are stored in millimetres, so logging a 550mm length after a healthy 3600g weight produced a RED priority-5 push reading `Latest weight 550g is 83.8% below birth weight (3400g) ... seek medical advice now - call 111`. Filter to GrowthMeasure.WEIGHT inside the rules."
exit_criteria = ["mixed-measure timeline: weight rules silent when the weight is healthy (test)", "genuine loss still fires when a length is logged alongside it (test)", "WEIGH_IN_DUE not reset by a non-weight measurement (test)"]
notes = "Implemented at the 2026-08-04 review via a _weights(facts) helper in rules.py; every weight rule now goes through it. 208 tests pass (3 new), check_layers green, ruff and mypy clean on the touched files. Held at review rather than done because scripts/lint.sh is red repo-wide for the pre-existing reasons tracked by Q2 and no CI has ever run (O2). Moves to done on the first green pipeline. Fixed in the rules rather than in the FactSet assembly on purpose: MEASUREMENT_GAP legitimately counts a length as evidence the log is being kept up, so the service must keep passing every measure."

[[task]]
id = "Q4"
phase = 3
title = "Cross-domain no-fire regression fixture"
status = "todo"
routing = "tester"
depends = ["A9"]
touches = ["tests/unit/_facts.py", "tests/unit/test_rules_misc.py"]
description = "A9 was a whole class of bug that the suite could not see: _facts.healthy_baseline() logs feeds, nappies, one weight and one temperature, and _facts.growth() defaults to WEIGHT, so no test ever put two measures in one timeline. Extend healthy_baseline to a genuinely well-logged day across all seven domains - weight plus length plus head circumference, sleeps with and without ts_end, a milestone, a note, a dirty nappy with a normal colour - and assert the full rule set stays silent on it. Then add a second fixture that is healthy except for one deliberate abnormality per rule, and assert exactly that one rule fires."
exit_criteria = ["healthy cross-domain timeline yields zero findings (test)", "one-abnormality-at-a-time fixture fires exactly the expected rule id and no other (test per rule)"]
notes = "This is the guard that would have caught A9 before it could page a parent. Worth more than any single rule test: it is the only place that checks rules do not interfere with each other."

[[task]]
id = "U10"
phase = 1
title = "Post-hoc field edits (bottle volume, feed duration, sleep end)"
status = "todo"
routing = "impl"
depends = ["U4"]
touches = ["src/cradle/routers/api.py", "src/cradle/services/logging_service.py", "src/cradle/routers/templates/_history_table.html"]
description = "EventsRepo.edit_event already enforces a per-table column allow-list, but the only HTTP surface for it is /api/adjust-time, which sets ts and nothing else. So several fully-built feature chains are dead from the first link: /api/feed accepts volume_ml, FeedEvent stores it, /today renders `Bottle intake in the last 24h` and series_service computes a bottle_ml series - and no form in any template supplies the field, so it is always zero. Same for breast duration_min. Sleep ts_end is not editable either, so a forgotten wake tap can only be corrected by deleting the row and losing the sleep. SPEC 5.4 calls these optional post-hoc edits and that is exactly what is missing. Add a generic edit endpoint over the existing allow-list plus inline per-domain fields in the history row."
exit_criteria = ["volume_ml set after the fact appears in /today and in the bottle_ml series (test)", "duration_min editable on a breast feed (test)", "sleep ts_end editable and reflected in sleep totals (test)", "a field outside the allow-list is rejected with 4xx (test)"]
notes = "Do not weaken the allow-list; it is the only thing standing between a form post and an arbitrary column write. Keep the quick-entry path untouched: volume is a post-hoc edit precisely so it never becomes an entry gate (SPEC 5.4, the 2-tap contract T1)."

[[task]]
id = "U11"
phase = 1
title = "Stool colour capture"
status = "todo"
routing = "impl"
depends = ["U10"]
touches = ["src/cradle/routers/api.py", "src/cradle/routers/templates/quick_entry.html", "src/cradle/routers/templates/_history_table.html"]
description = "The Dirty button posts kind=dirty with the default stool_colour=unset, and no template offers a colour anywhere. STOOL_COLOUR is a RED rule covering the pale/chalky, red and post-day-5 black amber-flag colours, and it is currently unreachable: the condition it screens for cannot be entered into the app at all. Offer the colour as an optional follow-up after the Dirty tap and as an inline edit in history."
exit_criteria = ["dirty nappy logged with a colour end to end (route test)", "STOOL_COLOUR fires from a colour entered through the UI, not just from a synthetic fixture (test)", "quick-entry stays 2 taps: colour is never required to log a nappy (route test)"]
notes = "Use the StoolColour enum already in models; do not author new colour names or any accompanying text - which colours are flags is a clinical claim owned by messages.py and A8. Plumbing only."

[[task]]
id = "U12"
phase = 1
title = "Device-name attribution"
status = "todo"
routing = "impl"
depends = ["U1"]
touches = ["src/cradle/routers/api.py", "src/cradle/routers/pages.py", "src/cradle/routers/templates/settings.html", "src/cradle/routers/templates/_history_table.html"]
description = "SPEC 1 lists device-name attribution as a v1 IS, and D7 chose it over auth precisely because attribution is the thing that actually matters in a household. It is not implemented: no device_name cookie is ever set anywhere in the templates or JS, routers.deps.device_name therefore always returns an empty string, every row is written with logged_by='', and _history_table.html does not render the field even though HistoryService.rows already carries it. Prompt for a device name on first visit, persist it in the cookie, and show it in history."
exit_criteria = ["first visit prompts for a device name and persists it (route test)", "logged_by populated on events created after the name is set (test)", "history renders who logged each row (route test)", "name editable in /settings"]
notes = "Keep it a plain cookie with no auth semantics (D7): this labels rows, it does not protect them. Existing rows keep their empty logged_by - do not backfill."

[[task]]
id = "A10"
phase = 3
title = "FEED_GAP and STOOL_ABSENT must fire when nothing has ever been logged"
status = "todo"
routing = "architect"
depends = ["A8"]
touches = ["src/cradle/alerts/rules.py", "src/cradle/alerts/messages.py", "tests/unit/test_rules_feeds.py", "tests/unit/test_rules_nappies.py"]
description = "Both rules currently return None on an empty history: _feed_gap bails on `not facts.feeds`, and _stool_absent bails on `not dirty`. So a baby with no stool logged at all by day 4 - the exact case STOOL_ABSENT exists to catch - is silent, and the rules only ever fire once a first event gives them something to measure from. Architect decision 2026-08-04: measure the gap from date of birth when there is no prior event, so absence from the start counts."
exit_criteria = ["day 4 with no dirty nappy ever logged fires STOOL_ABSENT (test)", "no feed ever logged past the gap threshold fires FEED_GAP (test)", "a baby younger than the threshold stays silent (test)", "new copy for the never-logged case reviewed under A8 and cited"]
notes = "Routed to architect and gated behind A8 because it needs new strings in messages.py, which is architect-only medical copy: the existing templates interpolate a `last` timestamp that does not exist in this case. Firing from birth is a stronger claim than the current behaviour - it says something about the baby rather than about the log - so the wording must go past the clinician alongside everything else in A8. MEASUREMENT_GAP partially covers the data-entry lapse today but is INFO severity and explicitly says it is about the log, not the baby, so it is not a substitute."

[[task]]
id = "N4"
phase = 3
title = "Scheduler lifecycle and reminder-cron reconciliation"
status = "todo"
routing = "impl"
depends = ["N2"]
touches = ["src/cradle/app.py", "src/cradle/ports/scheduler.py", "docs/SPEC.md"]
description = "Two loose ends from N2. First, create_app starts a BackgroundScheduler and nothing ever stops it: there is no lifespan or shutdown hook, so scripts/dev.sh reload leaks a thread per reload and a clean stop depends entirely on SIGTERM killing the process. Add a FastAPI lifespan that shuts the scheduler down. Second, SPEC 3 and N2 both call for cron entries for reminder rules alongside the 5-minute sweep, and build_scheduler registers only the interval job; in practice the sweep already evaluates WEIGH_IN_DUE every five minutes, so the crons are redundant. Either add them or record the simplification as a SPEC 7.1 amendment - do not leave the SPEC describing something the code does not do."
exit_criteria = ["scheduler shuts down cleanly on app shutdown (test)", "no scheduler thread survives repeated create_app/shutdown cycles (test)", "SPEC 7.1 and the code agree on reminder crons"]
notes = "Recommend the amendment over the crons: a reminder that fires on a cron and a reminder that fires from a sweep are the same notification once fingerprint de-dup is in play, and one scheduling path is easier to reason about at 3am than two."

[[task]]
id = "P3"
phase = 1
title = "Repo query correctness and restore precondition"
status = "todo"
routing = "impl"
depends = ["P2"]
touches = ["src/cradle/repos/events_repo.py", "src/cradle/repos/migrations/", "tests/unit/test_repos.py"]
description = "Three defects in EventsRepo. (1) list_growth applies the measure filter in Python after the SQL LIMIT, so list_growth(WEIGHT, limit=200) silently returns fewer than 200 weights once other measures are interleaved - and alerts_service relies on this call for the weight rules. Push the filter into the WHERE clause. (2) restore() documents `Target must be empty` but never checks, so re-importing into a populated database fails partway through on primary-key collisions with rows already written. Enforce the precondition or make the whole restore a single transaction. (3) temperature, milestone and note have no index on ts, while feed, nappy, sleep and growth do; add one in a new migration."
exit_criteria = ["list_growth(measure, limit=n) returns n rows of that measure when n exist (test)", "restore into a non-empty table raises rather than partially writing (test)", "migration 0002 applies cleanly on an existing database and is recorded in schema_version (test)"]
notes = "The list_growth truncation is the one that matters: it feeds the weight rules, which are red-severity, so a silent shortfall there changes what the household is told. The indexes are a nicety at newborn data volumes - do not let them hold up the other two."

[[task]]
id = "U13"
phase = 4
title = "Clamp unbounded range parameters"
status = "todo"
routing = "impl"
depends = ["C4"]
touches = ["src/cradle/routers/pages.py", "tests/routes/test_patterns.py"]
description = "_int_param parses the `days` query parameter with no upper bound, and both /patterns and /charts pass it straight into series_service.daily() and ribbon(), which build one row per day. /patterns?days=100000 constructs a hundred thousand day-rows and renders them, on a Pi with a 150MB RSS target. Clamp to a sane maximum, and reject non-positive values rather than silently producing an empty view."
exit_criteria = ["days above the maximum is clamped, not honoured (route test)", "zero and negative days handled without a 500 (route test)", "response time for the maximum range stays within the Pi budget"]
notes = "No auth (D7) means anyone on the LAN can send this, including a mistyped bookmark. Cheap to fix and it is the only unbounded allocation path in the app."

[[task]]
id = "Q3"
phase = 2
title = "Oracle parity test must fail, not pass, while unpopulated"
status = "todo"
routing = "tester"
depends = []
touches = ["tests/oracle/test_ukwho_parity.py"]
description = "tests/oracle/test_ukwho_parity.py returns early when the vector file holds no rows, so it reports PASS. The suite is therefore green while the single quality target with a number attached - centiles matching the UK-WHO reference to +/-0.01 z - is entirely unverified, and the risk-stage oracle-full job passes for the same empty reason. Make the unpopulated state visibly not-passing: skip explicitly with a message naming R2, so the pipeline reports a skip rather than a pass."
exit_criteria = ["unpopulated vector file produces a skip with a message naming R2, never a pass", "skip is visible in the CI junit report and in scripts/offline_runner.py output", "test still becomes a hard failure gate once vectors land (R4 unchanged)"]
notes = "Deliberately independent of R2 and R4 so it can land immediately: the point is that the current green is misleading today, whoever eventually vendors the tables. R4 keeps its own exit criterion that the test fails on an empty vector file once the harness is real."
