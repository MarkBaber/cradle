[[task]]
id = "C5"
phase = 4
title = "Recommended-value reference data for Charts: feed volume/kg, nappy ranges, sleep hours"
status = "done"
routing = "architect"
depends = ["C1"]
touches = ["rules_config.toml", "src/cradle/services/series_service.py", "src/cradle/app.py", "tests/unit/test_series.py", "docs/SPEC.md"]
description = "Raised by Mark Baber, 2026-08-22: the Charts page's 'Daily totals' section (feeds/wet/dirty/sleep, built in C1/C2) shows only what was actually logged, with nothing to compare it against. Add recommended/expected reference lines so a parent can see the actual daily totals against age- and weight-appropriate guidance, and have those lines move as new data comes in - most importantly, the feed-volume line must recompute from whichever weight was most recently logged as of each day, not a single current-weight snapshot, so the chart stays honest about a baby who was lighter three weeks ago. This task is the data half only (SeriesService + config); C6 renders it. Add new rules_config.toml tables, values proposed here for architect accept/edit/reject exactly as M2 did for activity_targets.foreign_language - none of the following are yet cited to an NHS/NICE source the way feed_gap/wet_nappy_low/fever_u3m are, so all carry an UNVERIFIED marker until confirmed: `[feed_volume_target]` ml_per_kg_per_day = 150 (this task's own starting figure, taken directly from Mark Baber's request that raised this task - 150 ml/kg/day is a commonly cited formula-feeding guideline but is not yet matched to a specific NHS/NICE page) and max_age_days = 180 (recommended volume-per-kg guidance is generally for the milk-only period, not once solids start); note in code and in the chart that this line is only meaningful against bottle-fed volume, since breastfed intake has no ml figure to compare (DailySeries.bottle_ml is already bottle-only). `[nappy_targets]` wet_max, dirty_min, dirty_max - UNVERIFIED (no upper bound for wet nappies or count-based dirty-nappy guidance exists anywhere else in this file; propose reasonable starting figures, e.g. wet_max=8, dirty_min=1, dirty_max=5, but do not treat them as sourced) - do NOT duplicate wet_nappy_low.by_day_of_life's existing NHS-cited minimum into this new table; SeriesService should read that table directly for the wet-nappy lower bound, the same way today_service.py's _wet_expected already does, so the two views can never disagree. `[sleep_hours_target]` min_hours, max_hours, max_age_days - UNVERIFIED total-24h-sleep band (e.g. 14.0/17.0/90), general infant-sleep guidance, not NHS/NICE-sourced. In series_service.py, give SeriesService a `config_path: Path` constructor parameter, loaded with the same `load_config` used by TodayService/AlertsService/ProjectionService (see today_service.py's `_wet_expected` for the exact pattern of reading a table with `.get`/`isinstance` guards, not attribute access, since TOML gives back Mapping[str, object]), and extend `daily()` to attach: `age_days: tuple[int, ...]` per bucket - chronological age from Baby.dob (NOT corrected age; corrected-age charting is out of scope here) so C6 can build a second x-axis without recomputing birth date client-side - and a new frozen `DailyTargets` dataclass carried on `DailySeries.targets`, with one tuple per bucket for: `feed_volume_ml` (int | None - None on any day before the first weight was ever logged, since there is nothing to scale from; otherwise weight_g-at-or-before that day, held constant until the next weighing, times ml_per_kg_per_day/1000, clamped to whole ml), `wet_min`/`wet_max` (int | None, wet_min from the existing wet_nappy_low table, both None past its max_age_days), `dirty_min`/`dirty_max` (int | None, None past nappy_targets' own max_age_days if one is added, else always populated), `sleep_min_hours`/`sleep_max_hours` (float | None, None past sleep_hours_target.max_age_days). Weight-as-of-day must bucket on the same to_local(ts).date() the rest of daily() uses, and carry forward from the most recent WEIGHT growth event with a date <= that bucket - fetch via repo.list_growth(GrowthMeasure.WEIGHT) the same way growth_service.py's assessment() does, sorted by ts."
exit_criteria = ["SeriesService(events, baby_repo, clock, config_path) loads rules_config.toml once and DailySeries.targets carries feed/wet/dirty/sleep target tuples the same length as .days (unit test)", "feed_volume_ml target changes on the bucket dated on/after a new weight is logged, and is None for every bucket before the first-ever weight (synthetic-timeline test with two weighings mid-window)", "wet_min matches the existing wet_nappy_low.by_day_of_life value for the same age_days a today_service test already exercises, so the two never disagree (test asserts equality against _wet_expected's output or an equivalent helper)", "every target field is None once the bucket's age_days exceeds that table's max_age_days", "age_days is chronological (Baby.dob), not corrected, and equals (bucket_date - dob).days (test)", "mypy strict green on touched files"]
