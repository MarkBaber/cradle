description = "Raised by Mark Baber, 2026-08-22, two fixes to the Log page (quick_entry.html) bundled together because both touch the same growth/temperature/milestone panel markup. (1) The growth panel's Value field (weight in g / length in mm / head circ in mm, per the Measure select) and the temperature panel's temp_c field are still plain <input type=number> - the only numeric quick-entry fields U31 doesn't already cover (U31 scopes volume_ml/duration_min only). Convert both to the same AnyPicker scroll-wheel treatment U31 gives volume_ml/duration_min, using AnyPicker's mode:\"select\" over an explicit numeric dataSource array rather than a range+step, per the exact usage Mark Baber confirmed: `$(\"#myPicker\").AnyPicker({mode: \"select\", dataSource: Array.from({length: 100}, (_, i) => i + 1), inputElement: \"#myInput\"})` - still verify this mode/option/inputElement wiring against the vendored src/cradle/routers/static/vendor/anypicker.min.js source directly before relying on it, the same caveat U29/U30/U31 all had to apply because AnyPicker's own docs proved unreliable. Because the growth panel's Value field means different things (and needs a different dataSource) depending on which Measure is selected, wire a change handler on the Measure <select> that swaps the Value wheel's dataSource to match the selected measure's unit/range; the temp_c wheel needs a decimal dataSource (0.1 steps), not integers. Exact bounds/step counts for weight/length/head_circ/temp_c are left to the implementer's judgement (mirroring U31's own \"implementer judges cleanest\" latitude) provided the range comfortably covers real readings and never gates entry (T1 contract) - these are data-entry granularity choices, not the clinical thresholds/rule values CLAUDE.md reserves for the architect (rules_config.toml, alerts/messages.py), so no architect sign-off is needed for the ranges themselves. (2) The growth, temperature and milestone panels have no Time field at all today - every Save on those three always logs at the server's now, unlike feed/nappy/sleep which already have <input type=time name=ts>. Add the same Time field (matching feed/nappy's existing markup exactly) to all three panels. All the machinery this needs already exists and just needs wiring: logging_service.log_growth/log_temperature/log_milestone already accept an optional ts: datetime|None=None kwarg (services/logging_service.py, pre-existing, not touched by this task - no public-signature change needed), so api.py's post_growth/post_temperature/post_milestone only need the same ts: Annotated[str|None, Form()]=None parameter and _panel_ts(ts) wiring post_feed/post_nappy already use; EventsRepo.EDITABLE already lists \"ts\" as editable for growth/temperature/milestone, so the existing generic backdate-correction the panel's picker already performs (entry.js's pendingCorrection -> POST /api/adjust-time, keyed off the toast's data-table/data-event-id, which _respond already sets to \"growth\"/\"temperature\"/\"milestone\" per table) needs no change to reach these three panels once the field exists; entry.js's bindPanelPickers already binds AnyPicker's combined date+time picker generically to every input[type=time][name=ts] inside #panel (task U29), so the new Time fields pick up the same iOS-style combined date+time wheel for free without touching that function."
exit_criteria = ["growth panel's Value field is an AnyPicker select-mode scroll-wheel whose dataSource swaps to match the selected Measure (weight/length/head_circ), and Save posts the picked value through the existing value parsing unchanged (route test)", "temperature panel's temp_c field is an AnyPicker select-mode scroll-wheel over a decimal dataSource, and Save posts the picked value through the existing temp_c parsing unchanged (route test)", "growth, temperature and milestone panels each gain a Time field; Save with the field untouched still logs at now (regression), and Save with a picked time posts through the same _panel_ts(ts) pattern feed/nappy already use, persisting that exact time (route test)", "picking a date other than today on any of the three new Time fields round-trips through the existing generic /api/adjust-time follow-up already wired in entry.js, producing a correctly backdated event, for all three panels (route test)", "every converted or added field still submits a correct value with the picker script disabled or unloaded, via the underlying native inputs, carrying U19/U22/U29's no-JS contract forward (route test)", "quick-entry static payload is re-measured against the Q1 weight-budget test with any changed entry.js/app.css bytes, and either stays inside budget or the test is amended in the same diff with the new total recorded (test)"]
notes = "Depends on U28 (done) for the growth/temperature/milestone modal-panel markup this extends, and U29 (status=\"review\" as of 2026-08-22 - if still not done when this is picked up, treat its vendored files and entry.js's existing bindPanelPickers/pendingCorrection machinery as the contract, same caveat U30/U31 already carry against it) for the vendored AnyPicker/jQuery and the generic date+time picker binding this task's Time fields ride for free. Also sequence-related to U31 (status=\"todo\") - both tasks add AnyPicker select-mode numeric wheels to quick_entry.html/entry.js; whichever lands first should establish the mode/option verification (against the real vendored anypicker.min.js) and the other should reuse it rather than re-deriving from scratch a second time, and both should leave app.css's dark-theme override rules (U30) intact rather than duplicating them. Confirmed no architect sign-off is required for the api.py ts-parameter additions: logging_service's log_growth/log_temperature/log_milestone already declare ts: datetime|None=None (pre-existing, not touched here), so this task only adds a new optional Form field to three routers plus _panel_ts(ts) wiring, the same non-breaking shape post_feed/post_nappy already use - not a public-signature change. AnyPicker mode:\"select\"/dataSource/inputElement usage per Mark Baber's own example, 2026-08-22 - verify against the vendored source before relying on it, not the library's own docs, per U29/U30/U31's established caveat. 2026-08-22: implemented, on branch task/U34-log-page-scrollwheel-entry-for-growth (U31 was still status=\"todo\" when this was picked up, so this task establishes the mode:\"select\" verification from scratch rather than reusing it). Verified directly against src/cradle/routers/static/vendor/anypicker.min.js (not docs), exactly as directed: extra.sArrModes is exactly [\"select\",\"datetime\"] - there is no separate range/step mode, confirming \"select\" is the only fit. Mark Baber's own quoted example (`dataSource: Array.from({length:100},(_,i)=>i+1)`, a bare array of numbers) does not match the real option shape and was not used verbatim - __setComponentsOfSelect's own auto-derive branch (the code path that builds a select-mode dataSource from a plain <select>'s <option>s) proves the real shape is `dataSource: [{component, data: [{val, label, selected}, ...]}]` with a matching `components: [{component}, ...]` array sizing the picker (components defaults to null and is read only via .length, so a select-mode init with no components renders nothing at all). `inputElement` and the jQuery-plugin \"destroy\" action (used to rebuild the growth wheel when Measure changes, since AnyPicker's select-mode dataSource is set once at init) were likewise confirmed as real, working options/actions directly in the source. entry.js gained: rangeValues/decimalRangeValues (build a values array, the latter via integer-tenths arithmetic to dodge float-step precision drift), numericWheelRows (values -> {val,label,selected} rows), bindNumericWheel (bind-or-rebuild a select-mode wheel over a native input via the same readonly-proxy-plus-type=hidden trick U29's bindPanelPickers already uses, so no new binding convention was introduced), GROWTH_WHEELS (weight 200-25000g step 25, length/head_circ 250-1200/600mm step 5) and TEMP_WHEEL (34.0-42.0C step 0.1) with sensible mid-range defaults (3500g/500mm/350mm/37.0C) pre-selected so a hidden required field is never left empty if the wheel is never touched, and bindGrowthValueWheel/bindTemperatureWheel wiring a change listener on #growth-measure that calls the rebuild function. Weight's step was widened from an initial 10g to 25g after house-reviewer flagged the resulting 2481-row wheel as unnecessarily dense for a phone scroll-wheel (not a blocker, but a cheap, in-scope improvement - 993 rows now, no loss of usable precision). quick_entry.html: growth's Measure <select> and Value <input> gained ids (#growth-measure/#growth-value), temperature's temp_c gained #temp-c - the only markup change needed since AnyPicker's dataSource is built entirely in JS (a static <select>-of-2000-options was rejected as the alternative, both for DOM weight and because the per-Measure swap needs a JS-driven rebuild regardless). growth/temperature/milestone each gained `<label>Time<input type=\"time\" name=\"ts\" value=\"{{ now_time }}\"></label>` copied verbatim from feed/nappy's existing markup, placed directly before each panel's Save button. api.py: post_growth/post_temperature/post_milestone each gained `ts: Annotated[str | None, Form()] = None` plus `ts=_panel_ts(ts)` wired into the existing logging_service calls - logging_service.log_growth/log_temperature/log_milestone's ts kwarg was already there and untouched, EventsRepo.EDITABLE already listed \"ts\" for all three tables, and entry.js's bindPanelPickers/pendingCorrection machinery already binds generically to every input[type=time][name=ts] inside #panel - confirmed by test, no changes needed to reach growth/temperature/milestone once the field existed. app.css needed no changes: the U30 dark-theme Cancel/Set overrides and the generic .ap-theme-ios component-row rules already apply to any AnyPicker overlay regardless of mode, and the existing .ap-ts-picker proxy-input styling (task U29, already generic despite its name) was reused as-is for the new numeric proxies. 10 new route tests added to tests/routes/test_quick_entry.py (under a new U34 section), one or more per exit criterion: select-wheel presence/wiring for growth and temperature, unchanged value/temp_c parsing, Time-field markup parity with feed/nappy, untouched-Time-field-still-logs-at-now regression, picked-time persists via _panel_ts, adjust-time backdate round-trip for all three panels, and no-JS native-input fallback. tests/unit/test_weight_budget.py needed no amendment: quick-entry total is 77,850 bytes against the 153,600-byte budget (entry.js grew by ~4.3KB from this diff), comfortably inside it - the test passes unmodified. ./scripts/test.sh (436 passed), scripts/lint.sh and scripts/check_layers.sh all green, python3 scripts/backlog.py OK (84 tasks, acyclic). Reviewed by house-reviewer (no critical/warning findings; one suggestion - the weight wheel's row density - addressed above) and criteria-auditor (all six exit criteria independently verified met, touches compliance confirmed exact - only api.py/entry.js/quick_entry.html/test_quick_entry.py actually changed). Held at review, not done, per CLAUDE.md - only CI and a human reviewer make that call."

