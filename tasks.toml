notes = "Closes the exact gap U18's own notes (2026-08-21 status-review entry) and U26's notes both already named and left open - see U18 notes ('consistency capture is not in the Dirty panel and cannot be added without either widening touches into services/repos or U21 landing first... Recommend sequencing U21 before this moves to done') and U26 notes ('U18 owns the consistency control on the entry side'). U21 (closing the service/repo half) has since landed, done, so the only remaining work is exactly the router+template half U18 could not reach within its own touches - this task exists so that work has a task id rather than continuing to sit undone inside an already-closed U18. Do not touch logging_service.py or events_repo.py: both already support consistency end to end (U21) and are deliberately outside this task's touches. Filed by Mark Baber, 2026-08-23, alongside U38 (History page grouping/gating/wheels) - related but independent; see U38's notes for the split rationale."

[[task]]
id = "U40"
phase = 1
title = "Concise day-grouped activity summary (augment /history or a new page)"
