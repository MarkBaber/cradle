description = "The Dirty panel in U18 offers a description of the mess beyond its colour. models/enums.py has StoolColour and nothing else: there is no vocabulary for consistency, NappyEvent has no field to hold one, and the nappy table has no column. Define the closed set as StoolConsistency, add the field to NappyEvent defaulting to an UNSET member, persist it in a new migration, and extend the repo round-trip. Choosing which descriptions are worth distinguishing is a clinical claim, which is why this is architect-routed rather than folded into U18."
exit_criteria = ["StoolConsistency enum with an UNSET default member, stored by .value like every other enum", "NappyEvent round-trips consistency through EventsRepo (test)", "migration applies cleanly on an existing database and is recorded in schema_version (test)", "nappy rows written before the migration read back as UNSET rather than raising (test)"]
notes = "Do not let an impl agent pick these names: which stool descriptions are worth distinguishing is the same class of claim as which colours are flags (U11, A8), and a badly chosen set quietly shapes what a parent reports to a midwife. No rule reads this field and none should be written here - if a consistency ever becomes an alert condition it needs messages.py copy and therefore A8. P3 already claims migration 0002: take the next free number and check the directory before writing the file. Implemented as StoolConsistency (8 members, UNSET first, sized to match StoolColour so the U18 panel stays one tappable list); the member comments describe appearance only and carry no flag annotations, unlike StoolColour. Field is NappyEvent.consistency, column added by migrations/0004_stool_consistency.sql as a single ALTER TABLE ... NOT NULL DEFAULT 'unset', which is what backfills pre-migration rows to UNSET rather than raising. Vocabulary and rejected alternatives recorded in docs/adr/0012-stool-consistency-vocabulary.md; that ADR plus its README index row are the only changes outside touches, and the enum is deliberately not re-exported from models/__init__.py because that file is not in touches - events_repo.py imports it from cradle.models.enums and U21 (appended) moves it. U21 also carries the log_nappy pass-through U18 needs and the EDITABLE/CSV-header pair."

[[task]]
id = "U18"
phase = 1
title = "Feed and Mess entry panels"
status = "done"
routing = "impl"
depends = ["U16", "U17"]
touches = ["src/cradle/routers/api.py", "src/cradle/routers/pages.py", "src/cradle/routers/templates/quick_entry.html", "src/cradle/routers/static/app.css", "tests/routes/test_quick_entry.py"]
description = "quick_entry.html posts a bare method or kind and nothing else, so FeedEvent.duration_min, FeedEvent.volume_ml and NappyEvent.stool_colour are unreachable from the page that exists to write them - /api/feed and /api/nappy already accept all three. Keep the six tiles under Feed / Mess / Sleep headings; a tap opens a panel below the grid with that choice pre-selected, and Save posts the whole event. Breast: side (L/R) and duration in minutes. Bottle: volume in ml, method defaulting to bottle_expressed with bottle_formula selectable - the button posts bottle_formula today, which is the wrong default for a household that expresses. Wet: timestamp only. Dirty: timestamp, StoolColour and the U17 consistency. Every panel defaults its timestamp to now and every field is optional."
exit_criteria = ["each of the five tiles opens a panel with its own choice pre-selected (route test)", "breast feed logged with side and duration_min, bottle with volume_ml, end to end (route test)", "volume_ml entered here appears in /today bottle intake and in the bottle_ml series (test)", "dirty nappy logged with colour and consistency end to end (route test)", "STOOL_COLOUR fires from a colour entered through the UI, not from a synthetic fixture (test)", "accepting every default is 2 taps and writes a row at now (route test)", "no field is required: Save with defaults never 4xx (route test)"]
notes = "Absorbs U11, which is parked for that reason; its two colour criteria are carried over above. Build the panel as an htmx fragment swap, not client state: D1 chose server-rendered fragments, and D1 also names Alpine, but static/vendor holds only htmx and plotly - Alpine is not actually vendored, and vendoring it is an architect call under the closed dependency set (SPEC 6), so do not reach for it. Native <select> and <input type=time> only in this task; the scroll wheel is U19 and must not block this. Do not touch models, repos or enums: the fields all exist after U17, and a wider diff belongs in another task. Implemented: tiles are hx-get links into '/?panel=...&method=...|kind=...', swapping just #panel (hx-select) so the same URL is also the no-JS fallback (a plain page load with the panel already open server-side); Save stays a real form POST to /api/feed or /api/nappy, matching the existing dual hx-post+action convention. Bottle tile now links method=bottle_expressed, fixing the wrong default. BLOCKED on the 'and consistency' half of the dirty-nappy exit criterion: LoggingService.log_nappy (src/cradle/services/logging_service.py) has no consistency parameter and EventsRepo.EDITABLE['nappy'] doesn't include it, and both files are outside this task's touches - U17's own notes and U21's description already name this exact gap as U21's job ('the log_nappy pass-through U18 needs'), and U21 (status todo) is not in U18's depends. Colour is logged and STOOL_COLOUR fires end to end from it; consistency capture is not in the Dirty panel and cannot be added without either widening touches into services/repos or U21 landing first. All other exit criteria pass under scripts/test.sh (282 tests green) plus scripts/lint.sh and scripts/check_layers.sh. Recommend sequencing U21 before this moves to done, or splitting the consistency criterion out to U21 explicitly. 2026-08-21, status review confirmed rather than landed: U21 (PR #24) closed the service half of the consistency blocker - log_nappy now takes a consistency argument and EventsRepo.EDITABLE['nappy'] allows the column - but the router and template half was never done. api.py's post_nappy does not pass consistency through, and no template in the repo mentions the field at all, so exit criterion 4 ('dirty nappy logged with colour and consistency end to end') is still unmet: consistency can be stored and exported, but a parent cannot enter it. Both remaining files are already inside this task's touches, so finishing it needs no new task. U22 is held at review for the same reason - it depends on U18, and validate_tasks.py refuses a done task with an unfinished dependency."

[[task]]
id = "U19"
phase = 1
title = "Scroll-wheel time control"
status = "done"
routing = "impl"
depends = ["U18"]
touches = ["src/cradle/routers/static/app.css", "src/cradle/routers/static/entry.js", "src/cradle/routers/templates/quick_entry.html", "tests/routes/test_quick_entry.py"]
description = "U18 ships the panels with a native <input type=time>, which on a phone means a keyboard or a platform dialog for the single field that gets adjusted most often - the event happened twenty minutes ago and someone is logging it one-handed. Replace it with a thumb-driven wheel: a vertical scroll-snap list of times, seeded at now, snapping to a fixed step. CSS scroll-snap plus a small amount of plain JS to read the snapped value into the form; no new dependency."
exit_criteria = ["the wheel writes a value the existing form post accepts unchanged (route test)", "the panel still submits a correct timestamp with JS disabled or the script unloaded (route test)", "keyboard and screen-reader access to the same value retained", "no new entry in the vendor directory and no change to pyproject dependencies"]
notes = "The no-JS fallback criterion is the load-bearing one: this is a wheel over a real form control, not a replacement for it, so a script that fails to load must degrade to something a parent can still submit. Presentation only - it changes no stored value and no route signature, which is why it is separable from U18 and must not delay it. Keep it in its own static file rather than inline, so the CSP and the service-worker cache list stay simple. SUPERSEDED 2026-08-19 by U22: Mark Baber asked for the picker to be built as an iPhone-style scroll wheel and explicitly authorised a vendored external JS library for it, which overrides this task's no-new-dependency constraint. U19 was never implemented, so building the vanilla scroll-snap version here and immediately replacing it in U22 would be a wasted diff over the same files. Parked rather than dropped so the two constraints that still matter survive: the panel must still submit a correct timestamp with JS disabled or unloaded, and the value it writes must be one the existing form post already accepts unchanged - both carried over verbatim into U22's exit criteria. U20's depends was repointed from U19 to U22 in the same edit, since nothing else can consume this task's output before it exists. Do not implement U19 separately. 2026-08-21: a run was dispatched against this task's original impl instructions (vanilla scroll-snap, no vendored JS); per the note above it built nothing - implementing would have been a wasted diff immediately superseded by U22, which already ships the picker (status review) and already carries U19's two surviving constraints verbatim in its own exit criteria. Status moved from todo (incorrectly schedulable, despite the notes forbidding the work) straight to review at Mark Baber's explicit direction rather than to blocked/held, since nothing here needs further human decision-making beyond confirming U19 is subsumed - a human reviewer can flip it to done alongside or after U22."

