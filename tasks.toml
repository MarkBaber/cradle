exit_criteria = ["parity test green over >=40 vectors", "test fails on empty vector file"]
notes = "R1/R2/R3 all done, so this was unblocked. 48 vectors added (weight/length/head_circ, both sexes, ages 0-730d incl. two early preterm-corrected-age points and six off-table interpolated ages) with L/M/S read directly from the RCPCH source file rcpch/growth-references uk-who/UK_WHO_0_20_preterm.csv at commit c13ee6983f94cb4c74f257bf70a62958cd5e3bc4 (the same commit R2 vendored from) - not from src/cradle/reference/data/ukwho_lms.csv and not via src/cradle/reference/lms.py. expected_z was computed independently of that module (a separate script implementing the published LMS formula against those source L/M/S rows), so the oracle is not testing the code against itself; full derivation/provenance is recorded in the CSV's header comment and the test file's docstring. The old `if not rows: return` empty-file bypass in test_ukwho_parity.py is removed; a new test_empty_vector_file_fails asserts an empty vector file now fails the gate rather than passing, and test_ukwho_parity_has_at_least_40_vectors pins the >=40 count. scripts/test.sh: 395 passed (verified twice via a fresh checkout of this branch's commit, since a subagent's isolated worktree copy showed the pre-R4 stale file on the first attempt - working-tree edits must be committed before an isolated verification run will see them). python3 scripts/backlog.py: OK, 81 tasks, graph acyclic, schema complete. Held at review per CLAUDE.md - CI and a human still need to sign off; downstream G1/U5/C3 etc. remain correctly blocked/review until this and their own reviews land. Could not push this branch: the repo's push hook runs scripts/validate, which fails on the pre-existing G1-depends-on-unfinished-R4 assertion in validate_tasks.py - present on main before this branch and already flagged as out-of-scope in G1/N3/Q4/O4's own notes (task 727 is the one that owns fixing that check). Not fixed here, since it is outside this task's touches. Commits are local on task/R4-oracle-vectors-parity-gate (8bb0b58, d320adb) pending either R4 landing (which flips this specific assertion true) or task 727."

