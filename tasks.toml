notes = "Filed by Claude while resolving a merge conflict between this session's own (unmerged, thinner) U44 draft and #84's already-merged, richer U44 (photos + HTML book export, new JournalEntry/JournalPhoto domain). Rather than silently drop the AnyPicker requirement Mark Baber stated explicitly in the original request ('the date/time will use AnyPicker') just because it lost the id collision, it's preserved here as a small, additive follow-up scoped only to the entry form's date/time control - no domain/schema disagreement with #84, no re-litigation of its design. Implemented: journal.html's create-entry form now carries the same hidden date + time[name=ts] fields and vendor/entry.js script+link tags as quick_entry.html's panels, so bindPanelPickers (already generic over input[type=time][name=ts] document-wide) binds it for free - no entry.js/app.css changes needed. Route tests cover both the picker markup and the plain-native-input no-JS path; test_weight_budget.py's journal assertion was updated to match (assets reused, none new, BUDGET_BYTES untouched). All four exit_criteria pass; scripts/test.sh, lint.sh, check_layers.sh green. Known residual gap flagged by house-review, left for a follow-up task rather than grown into this diff: bindPanelPickers always renders AnyPicker's full date+time picker (the vendored library has no time-only mode - extra.sArrModes is only [\"select\",\"datetime\"], same constraint U34 already hit), but only the *time* portion is ever written back to the native input; the *date* portion only reaches the server for panel forms via the /api/adjust-time follow-up, which is hard-gated on form.closest('#panel') plus an htmx:afterSwap-driven toast (entry.js:457-501) - infrastructure the journal create-entry form doesn't have, since /api/journal (api.py, out of this task's touches) always does a plain 303 redirect, not an htmx toast swap. Net effect: picking a non-today date in journal's picker is silently ignored server-side (_parse_panel_date(\"\") defaults to today) - the Date tab is currently decorative for journal specifically. Closing that gap needs either an api.py change to branch on HX-Request (making /api/journal htmx-aware like _respond()) or new JS to intercept-and-correct the plain POST; both are out of scope for this task's touches list and would re-litigate #84/U29's design, so it's deliberately left as a candidate follow-up task rather than expanding this diff."

[[task]]
id = "U46"
phase = 1
title = "History page: cover every domain, paginate one week at a time with a week-of-life label, aligned columns, and unique badge colors"
status = "review"
routing = "impl"
depends = ["U43", "U44", "M1", "V4"]
touches = [
    "src/cradle/services/history_service.py",
    "src/cradle/routers/pages.py",
    "src/cradle/routers/templates/history.html",
    "src/cradle/routers/templates/day_summary.html",
    "src/cradle/routers/static/app.css",
    "src/cradle/routers/static/entry.js",
    "tests/unit/test_history.py",
    "tests/routes/test_history_summary.py",
    "tests/unit/test_weight_budget.py",
]
description = "Filed by Mark Baber, 2026-08-25: 'ensure that the History page has every data input... use pagination to show one week at a time, with a label at the top of the page with the week of life (starting from the birth date)... the columns of the data should be aligned, i.e. the data on different dates should have the same column width... the badges for Feed, Nappy, etc should have unique colors'. This is four related gaps in the merged day-grouped /history page (U43/U40), all found by comparing it against EventsRepo.EDITABLE (the actual set of loggable domains) and app.css's `.tag` rules: (1) Every-data-input coverage: HistoryService.DOMAINS (history_service.py) is hardcoded to ('feed', 'nappy', 'sleep', 'growth', 'temperature', 'milestone', 'note') - seven of the eleven domains EventsRepo.EDITABLE actually registers. Missing entirely from /history: 'expression' and 'milk_batch' (M1: breast-pump sessions and colour-coded stored-milk batches), 'activity' (M2/M3/V4: tummy time, reading & talking, sensory play, foreign language), and 'journal' (U44: freeform stories/temperament entries with photos) - none of these ever appear on the History page today no matter what's logged. Add all four to DOMAINS and to HistoryService.rows()'s per-domain query+add() blocks and HistoryRow's activity_kind/short_detail branching, following the exact pattern already established there for feed/nappy/etc. Two design points left to implementer's judgement, to be recorded in this task's notes once decided: milk_batch has no single 'ts' field in EDITABLE (its EDITABLE columns are expressed_at/stored_at/thawed_at/opened_at/used_at) - pick one to anchor it to a day-group (stored_at, matching 'when it entered storage', is the natural default, but implementer may choose otherwise); and journal was deliberately kept off the History page's Edit/Clone/Delete row-action plumbing by U44's own notes ('if that integration is wanted later it should be its own task') - this task is that follow-up for *visibility*, but full Edit/Clone/Delete parity for journal rows (which would mean teaching the row-action panel about journal's own title/story/temperament/photo fields, a shape none of the other six quick-entry panel types share) is not required; a read-only row linking back to /journal for editing is an acceptable minimum. (2) Pagination: /history currently has no week pager at all - HistoryService.rows()/day_grouped_rows() just take an optional since/until pulled from a plain GET filter form (history.html) plus a flat limit=200, so a long-running log becomes one ever-growing scroll. Add week-based pagination: default to the calendar week containing today, exactly one week's rows per page, with Prev/Next controls (plain hx-get links following the same hx-select=\"#panel\"-adjacent pattern day_summary.html's day-add button already uses, targeting /history/fragment so paging doesn't force a full page reload). Week-start convention (Mon-Sun vs Sun-Sat) is implementer's call; record the choice in notes. (3) Week-of-life label: add a label at the top of the page reading the displayed week's number of life, computed from the baby's dob (svc.settings.profile(), already loaded via has_profile()'s existing gate) using the same 'age_days 0 == day 1 of life' convention today_service.py/series_service.py already establish for day_of_life, extended one level to weeks (e.g. week_of_life = age_days_at_week_start // 7 + 1). A paginated week that starts before dob (reachable by paging Prev past birth) should degrade gracefully - implementer's judgement, e.g. omitting the label or clamping to 'Week 1' - rather than showing a negative or zero week number. (4) Column alignment: day_summary.html renders one independent <table class=\"summary-table\"> per day-group <section>, so each day's Time/Activity/Kind/Detail/Actions columns are auto-sized from that day's own rows alone - HTML gives sibling <table>s no shared column-width computation, so columns visibly drift out of alignment between one date and the next even though they're stacked to look like one table. Fix so columns line up across every day-group on the currently displayed week - e.g. a single shared <table> per page with day-heading rows breaking up one <tbody>, or a CSS Grid applied uniformly via fixed grid-template-columns instead of per-table auto layout. Implementer's choice of mechanism. (5) Unique badge colors: app.css's .tag rules give feed/nappy/sleep/growth/temperature their own color today, but growth reuses --bottle and temperature reuses --warn (the same hue as the alerts amber severity class - a semantic collision on a non-alert badge), and milestone/note plus this task's four newly-added domains (expression, milk_batch, activity, journal) have no .tag.<table> rule at all, so they all fall through to .tag's bare default color:var(--dim) and render identically grey. Give every one of the eleven domains its own visually distinct :root custom property and .tag.<table> rule, none reused across domains and none matching alerts' amber/red severity classes (A7/U42/U43 precedent: non-alert UI must not borrow alert hues). --dirty already exists in :root but is currently unused by any .tag rule (nappy's badge always shows the table name, not the wet/dirty kind) - leaving it unused, or repurposing nappy's badge to vary by kind, is implementer's call."
exit_criteria = ["/history's day-grouped view includes rows for expression, milk_batch, activity, and journal - the four EventsRepo.EDITABLE domains currently absent from HistoryService.DOMAINS - alongside the existing seven, when events of those kinds exist in the displayed window (test per newly-added domain)", "/history defaults to and paginates in exactly one-calendar-week windows, with working Prev/Next controls that move the displayed window by a week each way (route test)", "the page shows a week-of-life label at the top, computed from the baby's dob and the currently displayed week using the day_of_life convention already established in today_service.py/series_service.py, extended to weeks (test)", "Time/Activity/Kind/Detail/Actions columns render at the same width across every day-group on a page - not independently auto-sized per day-group (inspection/test)", "every one of the eleven domains (feed, nappy, sleep, growth, temperature, milestone, note, expression, milk_batch, activity, journal) has its own distinct badge color, none shared with another domain and none matching the alerts amber/red severity classes (inspection/test)", "every new/changed control still submits/navigates correctly with the picker script disabled or unloaded, carrying forward the app's established no-JS contract (U19/U22/U29/U31) (route test)", "history and summary static payloads are re-measured against the Q1 weight-budget test with any changed app.css/entry.js bytes, and either stay inside budget or the test is amended in the same diff with the new total recorded (test)", "scripts/test.sh, scripts/lint.sh, and scripts/check_layers.sh green"]
notes = "Filed by Mark Baber, 2026-08-25: 'Create a task to ensure that the History page has every data input. This should use pagination to show one week at a time, with a label at the top of the page with the week of life (starting from the birth date). The columns of the data should be aligned... The badges for Feed, Nappy, etc should have unique colors'. Filed rather than implemented directly, as requested. Scoped as one task spanning history_service.py/pages.py/templates/app.css the same way U43 (its direct predecessor - this task builds on the day-grouped layout and Edit/Clone/Delete row actions U43 already shipped) was, rather than four separate tasks, since domain-coverage, pagination, the week-of-life label, column alignment, and badge colors are all touching the same small file set and are individually too small to be worth the per-task filing/branch/CI overhead U45's own notes on right-sizing already illustrate. depends includes M1 (expression/milk_batch domain) and V4 (activity domain) alongside U43/U44 since this task's domain-coverage gap can't be closed without those domains already existing; all four dependencies are status=done as of filing. Investigation performed while filing (not yet implemented): confirmed via EventsRepo.EDITABLE (events_repo.py) that eleven domains are registered but HistoryService.DOMAINS (history_service.py) lists only seven; confirmed via app.css that milestone/note currently share .tag's default grey with no dedicated rule, and that temperature's tag reuses --warn, the same variable alerts' amber severity class uses elsewhere; confirmed via today_service.py/series_service.py that 'age_days 0 == day 1 of life' is the existing day-of-life convention this task's week-of-life label should extend, not invent from scratch.\n\nImplemented 2026-08-26. Design decisions: week-start = Monday (Mon-Sun windows), record via pages.py's _week_start(); milk_batch anchored to stored_at ('when it entered storage', the task's suggested default). Column alignment done via table-layout:fixed with one shared per-column width recipe in app.css, keeping each day-group's own <section><table> (U40/U43's structure) rather than merging into one shared table across the page - a merged table was tried first but reverted because it deleted the <section class=\"day-group\"> markup tests/routes/test_quick_entry.py::test_history_multiple_same_time_rows_keep_independent_row_ids (outside this task's touches) asserts on; table-layout:fixed with matching widths satisfies the same-width exit criterion without that structural break. expression/milk_batch/activity rows get a generic Delete only (routers/api.py's /api/delete -> LoggingService.undo -> EventsRepo.soft_delete, already table-agnostic) - no Edit/Clone, because quick_entry.html (outside this task's touches) has no edit/clone panel branches for those three tables and adding them was out of scope. journal rows are fully read-only per U44's own notes ('if that integration is wanted later it should be its own task') - a plain link to /journal, no row-action plumbing at all.\n\nBLOCKER, unresolved - flagging per CLAUDE.md's Blocked protocol rather than looping: defaulting /history to the calendar week containing 'today' (via svc.today.summary().as_of, the injected Clock - the same pattern the / route at pages.py already uses) surfaces a pre-existing bug in routers/api.py's _panel_ts(): when a quick-entry panel posts a bare 'HH:MM' ts with no 'date' field, _panel_ts defaults ref_date to to_local(datetime.now(UTC)).date() - real wall-clock time, not the app's injected Clock, unlike every other 'now' in the codebase (TodayService, LoggingService, this task's own week default). Under the old unpaginated /history (show everything, limit=200) that inconsistency was invisible; under week-pagination it pushes those events outside the default-displayed week whenever a FixedClock-based test's NOW differs from the real run date (e.g. tests use NOW=2026-07-15 while this session's real date was 2026-08-26). routers/api.py is outside this task's touches, so the one-line fix (route _panel_ts's ref_date default through the injected Clock, matching TodayService's own pattern) can't be made here. Confirmed by isolated reruns that all 7 affected tests fail only because of this, not a logic bug in this diff: tests/routes/test_quick_entry.py::test_history_edit_corrects_both_date_and_time, ::test_growth_temperature_milestone_save_with_picked_time_persists_that_exact_time, ::test_growth_temperature_milestone_time_field_round_trips_through_adjust_time, ::test_growth_temperature_milestone_fields_submit_correctly_with_picker_script_disabled, ::test_history_multiple_same_time_rows_keep_independent_row_ids, ::test_history_edit_saving_updates_the_same_event_and_moving_ts_relocates_the_row, ::test_history_day_add_button_seeds_that_days_own_date_and_nine_am. Recommend a small follow-up task: route _panel_ts's ref_date default through the injected Clock, and update the handful of test_quick_entry.py assertions that assumed /history shows every date unpaginated by default.\n\nSeparately, scripts/test.sh also currently fails 7 more tests entirely unrelated to this task - pre-existing, caused by the 'Update config' commit at HEAD (135b072) changing rules_config.toml's entry-default/wheel-step values (e.g. bottle_volume_ml 60->70, wheel-steps weight 25->10) without updating the tests that hardcode the old values: tests/routes/test_settings.py::test_get_entry_defaults_reflects_config_out_of_the_box, ::test_post_entry_defaults_rejects_non_positive_values, ::test_settings_page_shows_the_current_entry_defaults, ::test_new_entry_default_appears_on_the_next_panel_open, ::test_get_wheel_steps_reflects_config_out_of_the_box, ::test_post_wheel_steps_rejects_non_positive_values, and tests/routes/test_quick_entry.py::test_bottle_panel_prefills_the_configured_volume_default. Confirmed pre-existing by reproducing all 6 test_settings.py failures running that file alone, with none of this task's changes in the import path. Not fixed here: rules_config.toml's values are architect-only per CLAUDE.md and test_settings.py is outside this task's touches.\n\nscripts/lint.sh and scripts/check_layers.sh are both fully green. Every test in this task's own touched test files (tests/unit/test_history.py: 14 tests, tests/routes/test_history_summary.py: 19 tests, tests/unit/test_weight_budget.py: 8 tests, all passing) exercises all 8 exit criteria directly, including one route test per newly-added domain, week pagination + Prev/Next, the week-of-life label (including the before-dob clamp), column-width parity, all eleven distinct non-alert badge colours, and the no-JS plain-href contract for the new pager controls."

[[task]]
id = "Q5"
phase = 6
title = "Make main green: 14 route tests have been failing on main across several merges"
status = "done"
routing = "impl"
