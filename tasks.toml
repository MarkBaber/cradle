notes = "This is the guard that would have caught A9 before it could page a parent. Worth more than any single rule test: it is the only place that checks rules do not interfere with each other. Implemented 2026-08-15: healthy_baseline() now logs weight+length+head_circ, a completed and a still-running sleep, a milestone, a note, and a dirty nappy with a normal colour; facts() accepts milestones/notes but drops them since FactSet has no fields for those two domains (the engine never reads them). Added one_abnormality(rule_id) plus one generated test per rule id (11 total) asserting exactly that rule fires. scripts/test.sh: 220 passed; scripts/lint.sh and scripts/check_layers.sh clean. Held at review per CLAUDE.md - CI is the sole arbiter. Question for the architect: the run instructions ask for `python3 scripts/backlog.py` to exit 0, but that script does not exist in the repo; the closest analog, scripts/validate_tasks.py, fails with a pre-existing, out-of-scope issue unrelated to this task (`G1 is done but depends on unfinished R4`, tasks.toml:169-178). Not fixed here since tasks.toml task-status edits beyond Q4's own status field are outside this task's touches."

