description = "Found 2026-08-27 while opening PR #97 (task O5): scripts/test.sh reports 14 failures on a clean checkout of main at 1e4e4a7, reproduced identically there with no task branch in the picture. They are two unrelated root causes, both already diagnosed in U46's notes and neither ever filed as work. Cluster A, 7 tests in tests/routes/test_quick_entry.py (test_history_edit_corrects_both_date_and_time, test_growth_temperature_milestone_save_with_picked_time_persists_that_exact_time, test_growth_temperature_milestone_time_field_round_trips_through_adjust_time, test_growth_temperature_milestone_fields_submit_correctly_with_picker_script_disabled, test_history_multiple_same_time_rows_keep_independent_row_ids, test_history_edit_saving_updates_the_same_event_and_moving_ts_relocates_the_row, test_history_day_add_button_seeds_that_days_own_date_and_nine_am): _panel_ts in routers/api.py defaults its reference date with `day = ref_date or to_local(datetime.now(UTC)).date()` - the real wall clock, not the injected Clock every service reads time through. A panel POST with no explicit date therefore lands on the real today rather than the test's NOW, and since U46 made /history paginate one week at a time those events fall outside the default-displayed week whenever a FixedClock test's NOW differs from the real run date. The tests were passing before U46 only because the unpaginated view (limit=200) showed every date, which hid the inconsistency rather than avoiding it - so this is a real defect in api.py, not test drift, and it will silently misfile a genuine entry near local midnight exactly as the docstring for _panel_ts already warns about for timezones. Constraint the implementer must respect: routers may import only models and services (SPEC 3, enforced by tests/unit/test_layers.py's ALLOWED map), so api.py cannot import cradle.ports.clock and Services (routers/deps.py) cannot grow a `clock: Clock` field - that annotation alone would fail the layering gate. The layering-safe shape is an additive public accessor on a service the router already holds - e.g. a method on TodayService returning the current local date from its own injected _clock - which routers may call because routers -> services is legal, and which is additive in exactly the way U44's notes record for the Services dataclass, so it needs no architect sign-off. _panel_ts itself is private (leading underscore), so changing its signature is not a public-contract change either. Cluster B, 7 tests (6 in tests/routes/test_settings.py: test_get_entry_defaults_reflects_config_out_of_the_box, test_post_entry_defaults_rejects_non_positive_values, test_settings_page_shows_the_current_entry_defaults, test_new_entry_default_appears_on_the_next_panel_open, test_get_wheel_steps_reflects_config_out_of_the_box, test_post_wheel_steps_rejects_non_positive_values; plus test_bottle_panel_prefills_the_configured_volume_default in test_quick_entry.py): commit 135b072 'Update config' changed values in rules_config.toml - bottle_volume_ml 60 to 70, wheel_steps.weight 25 to 10, among others - without updating the tests that hardcode the old numbers, so they assert 25 where config now says 10. rules_config.toml carries architect-only values per CLAUDE.md and must not be edited back to make tests pass; the tests are what is wrong here. Prefer reading the expected value from the same config the app reads over hardcoding the new number, so the next architect-authored config change does not re-break these same seven tests - the test names themselves say 'reflects config out of the box', which is a property, not a constant. Both clusters are filed as one task rather than two because they overlap on tests/routes/test_quick_entry.py and would serialize against each other anyway; keep them as two commits on the branch so the api.py fix stays reviewable apart from the test-expectation updates."
exit_criteria = [
    "scripts/test.sh is fully green on the branch, with all 14 named failures passing and no test newly skipped or deleted to achieve it",
    "_panel_ts derives its default reference date from the injected Clock rather than datetime.now(UTC), so a FixedClock route test files a panel entry under the test's NOW (test, with NOW deliberately set to a date other than the real run date so the test fails against today's code)",
    "the clock reaches routers without routers importing cradle.ports: tests/unit/test_layers.py and scripts/check_layers.sh stay green",
    "the settings and quick-entry expectations derive from the same config the app reads, so changing a value in rules_config.toml moves the test with it rather than breaking it (test)",
    "rules_config.toml is unmodified by this diff (architect-only per CLAUDE.md)",
    "scripts/lint.sh and scripts/check_layers.sh green, and python3 scripts/backlog.py exits 0",
]
notes = "Depends on O3 rather than merely coinciding with it: O3 is why these sat unnoticed. All 14 were confirmed pre-existing by running tests/routes/test_quick_entry.py and tests/routes/test_settings.py against clean main at 1e4e4a7, with the identical 14 names failing and 115 passing, so none of them are artefacts of the O5 branch they were found from. U46's notes reached the same two root causes independently and recommended a follow-up task; that recommendation was never filed, which is how the count grew from 7 to 14 as 135b072 landed on top. Implemented 2026-08-28; 625 passed, 0 failed, 0 skipped - the same 625 collected before, so nothing was deleted or skipped to get there. Dependency exception, recorded rather than glossed: this task was started while O3 sat at review, not done, which CLAUDE.md forbids. O3 cannot reach done without CI, CI on main is red, and it is red because of this task - a deadlock O3 created and only this task can clear. Started on the operators explicit instruction; O3s deliverable was already merged, so the premise this task depends on (a gate that watches these tests) does hold. Cluster A came out differently than filed, and the difference matters. Fixing _panel_ts made a previously PASSING test fail: test_panel_time_field_combines_with_todays_display_zone_date asserted `local.date() == to_local(datetime.now(UTC)).date()`, i.e. it asserted the wall clock, so it passed only because the defect existed - the test encoded the bug rather than catching it. Same idiom at one more site (the growth/temperature/milestone save test). Both now assert `to_local(NOW)`, which makes them the regression test this tasks second exit criterion asks for: NOW is 2026-07-15 and the real run date was 2026-08-28, and both were confirmed to fail against pre-Q5 code by temporarily restoring the wall-clock default, running them, and reverting - `assert datetime.date(2026, 8, 28) == datetime.date(2026, 7, 15)`. api.py was then diffed against a pre-proof backup to confirm the revert was exact. The remaining four cluster-A failures were the U46 half of the diagnosis: they move an event to 2026-07-10 and read the default /history, which since U46 renders only NOW's week (13-19 Jul), so 10 Jul is one week back. They now pass ?week=2026-07-10, which is what U46s own notes asked for. One of them needed more than a URL change: test_history_edit_saving_updates_the_same_event_and_moving_ts_relocates_the_row asserted `15 Jul 2026 not in page` to prove no stale duplicate under the rows old day, and under a week-scoped view that assertion is vacuous - a different week never renders 15 Jul either way. It now fetches the old week separately and asserts the row id is absent from it, which is the property the original assertion meant. Implementation shape for the clock: TodayService gained a public local_today(), and _panel_ts takes `today` as a required parameter with no default, so the wall clock is gone from that function entirely and mypy names any call site that forgets rather than one silently reintroducing it. Nine call sites updated, all identical. Routers still import only models and services - a `clock: Clock` field on Services (routers/deps.py) would have failed the layering gate, which is why the accessor lives on a service. _panel_ts is private, so its changed signature is not a public-contract change and needs no architect sign-off. Cluster B: a shared config_value() helper in test_settings.py reads the repo's own rules_config.toml, used by all six settings assertions and by the two quick-entry panel-prefill tests. Deliberately parses the file rather than calling api.wheel_steps()/api.entry_defaults(), because comparing an endpoints output to the helper that endpoint calls would assert nothing about the values. Proven to satisfy the fourth exit criterion by temporarily setting bottle_volume_ml to 123 and wheel_steps.weight to 37 in rules_config.toml, running both files green (129 passed), and reverting - git confirms rules_config.toml is unmodified by this diff. One test outside the failing 14 was also converted: test_breast_panel_prefills_the_configured_duration_default still passed at 20 min only because 135b072 happened not to touch that key; leaving it pinned would have left the identical trap armed for the next architect config change. Promoted review -> done 2026-08-28: the test job is green on main, which is the state this task existed to restore. 633 tests pass there (625 plus O5's 8)."

[[task]]
id = "Q6"
phase = 6
title = "Formatting has drifted: ruff format --check reports 19 files, and no gate ever ran it"
status = "done"
routing = "impl"
depends = ["O3"]
touches = [
    "src/",
    "tests/",
    "scripts/lint.sh",
]
description = "Found 2026-08-28 while implementing O3: `ruff format --check src tests` fails on clean main at 1e4e4a7 with '19 files would be reformatted, 75 files already formatted'. This is not new drift from any one branch - it accumulated because nothing has ever run the check. scripts/lint.sh runs `ruff check` (the linter) and `mypy`, never `ruff format --check` (the formatter), and .gitlab-ci.yml's validate stage was the only place that ran it - a pipeline that has never executed, since the remote is GitHub and O3's workflow did not exist until now. Q2 ran `ruff format` once as a deliberate one-off commit in 2026-08-04 and the tree has drifted ever since with nothing to catch it. O3's validate job now runs `ruff format --check src tests`, so this is red on main from the moment O3 lands; that is the intended consequence of turning the gate on, not a reason to weaken the gate. Two parts to this task. First, run `ruff format src tests` and commit the result as its own commit, separate from anything else, exactly as Q2's notes prescribe for the same reason: it necessarily reformats files outside any one task's touches, and that is the intended one-off exception rather than something to smuggle into a feature diff. The 19 files span src/cradle/repos, src/cradle/routers, src/cradle/services and tests/ - all of it whitespace, string-quote and line-wrapping changes, no behaviour. Verify that by running scripts/test.sh before and after and confirming the same pass/fail set, which after Q5 lands should be fully green both times. Second, and this is the part that stops it recurring, add `ruff format --check src tests` to scripts/lint.sh so the local gate and the CI gate check the same things - today a contributor can run scripts/lint.sh green and still be red in CI, which is precisely the drift CLAUDE.md's 'use scripts/' rule exists to prevent, and the same one-place-not-two argument O3 makes for shelling out to scripts/ from the workflow. Put the check before the mypy call so the cheap gate fails first. Note the ordering constraint against Q5: both touch tests/routes/test_quick_entry.py and tests/routes/test_settings.py, so whichever lands second will need a rebase. Prefer landing Q5 first, since its changes are semantic and a mechanical reformat rebases onto them far more easily than the reverse."
exit_criteria = [
    "ruff format --check src tests exits 0 on the branch",
    "the reformat is its own commit, containing no non-formatting change, so the diff is reviewable as mechanical",
    "scripts/lint.sh runs ruff format --check src tests, and fails when a file is unformatted (verified by unformatting one file, running it, then reverting)",
    "scripts/test.sh reports the same set of passing and failing tests before and after the reformat, proving no behaviour changed",
    "scripts/check_layers.sh green and python3 scripts/backlog.py exits 0",
]
notes = "Depends on O3 because O3's validate job is what makes this visible and what makes it stay fixed; before O3 there was no gate to be red. Deliberately not folded into O3 itself: O3's touches are .github/workflows/ci.yml and .gitlab-ci.yml, and reformatting 19 source files inside a CI task would be exactly the diff-growth CLAUDE.md forbids. Also deliberately not folded into Q5, whose touches are four specific files chosen around two semantic root causes - a 19-file mechanical reformat sharing that branch would bury them. Implemented 2026-08-28 as two commits, per this task's own instruction and Q2's precedent: the reformat alone, then the scripts/lint.sh change. 19 files reformatted, 75 already formatted; afterwards ruff format --check reports 94 files already formatted and exits 0. Proven semantics-preserving two independent ways rather than one. First, every one of the 19 files parses to an identical AST before and after (ast.dump of the HEAD blob vs the working file), which makes the change provably formatting - whitespace, line wrapping and quote style - and unable to alter behaviour; a plain whitespace-ignoring diff would not have shown this, because ruff format also normalises single quotes to double. Second, scripts/test.sh reports the identical 625 test names with identical outcomes before and after, compared name by name out of the two junit reports rather than by count alone: 625 pass, 0 fail, 0 skip, no test added, removed, renamed or skipped. scripts/lint.sh now runs ruff format --check src tests ahead of ruff check and mypy - the cheapest gate first, so a failing gate fails fast, and the same src tests scope CI uses. Verified it actually bites by putting a double space into an import in tests/unit/test_history.py, running scripts/lint.sh, and watching it exit 1 on the format check before the linter or mypy ran at all; the file was then restored and confirmed byte-identical to its committed state. Stacked on Q5's branch rather than branched from main, deliberately: the reformat rewrites tests/routes/test_quick_entry.py and tests/routes/test_settings.py, the same two files Q5 edits, so branching from main would have produced a real content conflict on merge instead of the mechanical rebase this ordering needs. That is the ordering this task's description already called for - land Q5 first. Consequence to expect: after Q5 squash-merges, this branch needs `git rebase --onto origin/main <Q5 tip>` to drop its copy of Q5's commit, the same procedure PR #99 needed after #98 landed. Scope note: the format scope stays `src tests`, matching CI and the retired GitLab stage. It deliberately does not extend to scripts/, whose Python (cockpit.py, backlog.py and friends) is not in this task's touches and would be a far larger unrelated reformat; if that is wanted it should be its own task. Promoted review -> done 2026-08-28: the validate job is green on main, and the gate this task added to scripts/lint.sh has already earned its keep - it caught tests/unit/test_dispatch_models.py as unformatted when O5 rebased onto a main containing Q6. Exactly the drift it exists to catch, found at a branch instead of accumulating unseen."

[[task]]
id = "O5"
phase = 5
title = "Dispatch model/effort mapping: correct the Anthropic model facts and make the effort recommendation dispatchable"
status = "done"
routing = "impl"
depends = ["O4"]
touches = [
    "scripts/backlog.py",
    "scripts/cockpit.py",
    "scripts/usage.py",
    ".claude/agents/devops-medic.md",
    "tests/unit/test_dispatch_models.py",
]
description = "Raised by Mark Baber, 2026-08-27: audit the end-to-end workflow's use of Anthropic models and check the right model and effort is used for each task, Haiku included. The audit found the model *assignments* sound and the model *facts* underneath them wrong, so this task fixes the facts and the two places the mapping contradicts itself, and deliberately does not re-tune the assignments. What was checked and left alone: the six house subagents in .claude/agents/ pin sonnet except gate-runner, which pins haiku - the one genuinely mechanical job (run a command, report pass/fail and the failing test names) and the right and only place for it; criteria-auditor, failure-analyst, house-reviewer, test-author and adr-scribe are all judgement work that would degrade on haiku, so no further haiku assignment is proposed. recommend_dispatch()'s S/M -> antigravity routing is likewise left alone: sending small tasks to Antigravity's Gemini and bundled quotas rather than to Claude Haiku is the deliberate three-quota spread O4 ported, and swapping in haiku would defeat the purpose rather than improve the mapping. What is actually broken, in four parts. (1) usage.py's advisory price table has claude-sonnet-5 at (3.0, 15.0), which is Sonnet 4.6's rate; Sonnet 5 is (2.0, 10.0), so every cost figure the cockpit shows for the model that does ~87% of this repo's turns is overstated by 50%. (2) Both MODEL_PRICES and CONTEXT_WINDOWS are read with exact-match .get(), but transcripts record the id the CLI actually invoked, which for Haiku is the dated snapshot claude-haiku-4-5-20251001 - absent from both tables, so real Haiku turns price at $0.00 and are measured against the 1M DEFAULT_WINDOW instead of Haiku's 200K, a context gauge reading five times emptier than the session is. Fixed with one base_model() normaliser in usage.py, stripping a trailing -YYYYMMDD, used by usage._turn_cost and by cockpit.Usage.cost/.window (cockpit reads the tables through its own properties, so both call sites need it). (3) recommend_dispatch() recommends effort 'high' for L-sized tasks, but omitting --effort already gets Claude Code's own default of xhigh - so the recommendation for the hardest work was a step *down* from an unflagged dispatch, the opposite of what a size-derived seed should do. Now xhigh, with EFFORT_HELP's 'default' tooltip corrected to say what omitting the flag actually does. (4) Haiku 4.5 has no effort control and the CLI errors on --effort rather than ignoring it, yet the cockpit picker offered the Effort row for every claude model and build_command emitted the flag for whichever was chosen - so model=haiku plus any effort produced an argv that cannot run. A new EFFORT_MODELS tuple in backlog.py is the single source of truth: the picker omits the Effort row for a model not in it (exactly as it already omits the row for antigravity), build_command raises rather than silently dropping the flag (matching the hard failure it already raises for a model slug belonging to the wrong backend), and recommend_dispatch seeds no effort when a task's own `model` field pins an effort-less model on an L-sized task. Also .claude/agents/devops-medic.md is the only house subagent with no `model:` line, so it silently inherits the dispatching session's model - Opus for an L-sized dispatch - for triage work every one of its five siblings runs on sonnet; pinned to sonnet for consistency. Out of scope and deliberately not touched: AGY_MODELS and AGY_OTHER_MODEL (Antigravity's own slug vocabulary, constrained by what agy accepts, not ours to choose), and the Explore built-in, which delegation() hands wide tasks and which inherits the parent session's model with no way to pin a cheaper one from .claude/agents/ - noted here as a known cost leak rather than fixed, since the house deliberately does not redefine built-ins."
exit_criteria = [
    "usage.MODEL_PRICES['claude-sonnet-5'] is (2.0, 10.0) (test)",
    "a dated model id (claude-haiku-4-5-20251001) prices through usage._turn_cost at the undated model's rate rather than $0.00, and reports its real 200K window through cockpit.Usage.window rather than the 1M default (test)",
    "build_command emits --effort for a model in EFFORT_MODELS and raises ValueError for one that is not, rather than emitting a flag the CLI rejects (test)",
    "every claude-backend recommend_dispatch() seed is dispatchable as recommended: build_command accepts its model/effort pair for S, M and L sized tasks, including a task whose own `model` field pins an effort-less model (test)",
    "recommend_dispatch recommends xhigh, not high, for L-sized tasks (test)",
    "the cockpit dispatch picker omits the Effort row for a claude model with no effort control, as it already does for antigravity",
    ".claude/agents/devops-medic.md pins a model like its five siblings",
    "scripts/test.sh, scripts/lint.sh and scripts/check_layers.sh green",
]
notes = "Model facts in this diff are sourced from the bundled claude-api skill's cached model table (2026-06-24), not from recall: Opus 5 $5/$25 and Sonnet 5 $2/$10 at 1M context, Haiku 4.5 $1/$5 at 200K, xhigh as Claude Code's default effort and as the recommended level for coding and agentic work, and effort erroring rather than no-opping on Haiku 4.5. Observed usage backing the priority: ~4,000 assistant turns across this repo's transcripts are 87% claude-sonnet-5 and 13% claude-opus-5, with 6 turns of claude-haiku-4-5-20251001 - so the mispriced Sonnet 5 rate is the dominant cost error, and the unlisted dated Haiku id is what made the gate-runner subagent's spend invisible. No change is proposed to which agent runs on which model; the audit's conclusion there is that haiku is used once, correctly, and that no other house agent is a safe candidate for it. Promoted review -> done 2026-08-28: all four CI jobs green on main. This was the first task to meet Q6's new formatter gate, which caught its new test file; formatted in its own commit before merge."

[[task]]
id = "N5"
phase = 3
title = "WhatsApp echo: post every logged event to a WhatsApp chat, brief line per entry, date header on the day's first message"
status = "review"
routing = "impl"
depends = []
touches = [
    "src/cradle/ports/whatsapp.py",
    "src/cradle/repos/chat_log_repo.py",
    "src/cradle/repos/migrations/0008_whatsapp_log.sql",
    "src/cradle/services/logging_service.py",
    "src/cradle/app.py",
    "src/cradle/routers/templates/settings.html",
    "tests/unit/test_whatsapp.py",
    "tests/unit/test_logging_service.py",
    "tests/routes/test_settings.py",
]
description = "Filed by Mark Baber, 2026-08-28: whenever data is entered into Cradle, also post it to a WhatsApp chat for confirmation/historisation - a running, human-readable log a household can scroll on their phone without opening the app. Each message is brief but comprehensive: 24h time, then the entry, e.g. '22:00 30ml bottle expressed milk'. When a message is the first one sent on a new local calendar day, the date is prepended on its own line above, e.g. '28/06/26', shown only for that first message of the day - every later message that day carries the time line alone. Scope: every domain LoggingService can write (feed, nappy, sleep, growth, temperature, milestone, note, expression, milk_batch, activity), not just alerts - this is unrelated to the existing N1/N3 ntfy push path, which fires on rule findings, not on raw data entry. Reuse rather than reinvent: HistoryService/HistoryRow (U43/U46) already computes a short per-domain 'detail' string for every one of these tables for the History page's row rendering - the WhatsApp line should be built from that same per-domain short-detail logic (factored out if it is not already a standalone function) rather than a second, independently-drifting copy of 'how do we describe a feed/nappy/sleep tersely'. Journal entries (U44) are deliberately out of scope for the message body - U44 already treats journal as its own richer, non-quick-entry surface - but may be included later as a follow-up if wanted. Transport: the dependency set is closed (SPEC 6: fastapi, uvicorn, jinja2, apscheduler, httpx, python-multipart) and adding one is an architect decision this task does not make. httpx is already vendored and already the transport for the ntfy adapter (N1/D3), and WhatsApp's own Cloud API (Meta) is a plain bearer-token HTTPS POST, so implement the adapter over httpx with no new dependency, following N1's NtfyNotifier shape exactly: a small Protocol for the outbound call so tests inject a double instead of hitting the network, and a `configured` guard so an unset destination no-ops instead of raising - a WhatsApp delivery failure must never abort or lose the underlying event write, the same 'never raises' contract N1's docstring states for ntfy. If Meta's Cloud API turns out to be the wrong fit operationally (e.g. a self-hosted bridge is preferred instead), that transport choice is the architect's to make before or during implementation; record whichever is chosen in this task's notes. Two design points deliberately left open, to be recorded in notes once decided: (1) where the destination/access-token config lives - N3 already hit this exact question for the ntfy topic and, constrained by that task's own touches list, ended up restricting a runtime writer to rules_config.toml's [ntfy] table; a WhatsApp access token is a materially more sensitive secret than an ntfy topic name, so committing it into rules_config.toml (git-tracked) is not obviously the right call this time even though the destination *chat id*, which is not sensitive, could live there like the ntfy topic does - the implementer should weigh this rather than default silently to N3's pattern, and record the choice; (2) where the 'last message date' needed for the date-header logic is persisted - a new tiny table (chat_log_repo.py/migration 0008, listed in touches as the default shape) that records every message actually sent, which also gives the historisation half of this task's own name a local audit trail to debug a failed send against, rather than only the fact of a boolean flag. Hook point: LoggingService's log_* methods are the one place every domain write already passes through (U10's notes note undo/adjust_time as the analogous single choke point for post-hoc edits) - post the message from there, after the repo write succeeds, so a failed WhatsApp send can never prevent the event itself from being recorded."
exit_criteria = [
    "logging a feed, nappy, sleep, growth, temperature, milestone, note, expression, milk_batch, or activity event sends one WhatsApp message per event, formatted '<HH:MM> <brief detail>' in 24h time, with the detail text sourced from the same per-domain short-detail logic HistoryService already computes for /history - not a second, separately-maintained description (test per domain)",
    "the first message sent on a new local calendar day is preceded by a 'DD/MM/YY' date line; every subsequent message that same local day omits it, proven across a day boundary with a FixedClock (test)",
    "an unconfigured WhatsApp destination no-ops silently rather than raising, exactly as NtfyNotifier does for an unset ntfy topic (test)",
    "a WhatsApp send failure (network error, non-2xx response) is caught and logged, never raised into the caller, and never prevents the underlying event from being written to its repo (test)",
    "the WhatsApp destination is configurable at runtime (e.g. via /settings, mirroring N3's ntfy-topic pattern) without editing rules_config.toml's clinical sections, and the chosen storage location for any access-token-shaped secret is recorded in this task's notes with the reasoning",
    "no new third-party dependency is added; the adapter is implemented over httpx, the transport N1 already uses for the same closed-dependency-set reason (SPEC 6) - verified by pyproject.toml being unchanged by this diff",
    "scripts/test.sh, scripts/lint.sh, scripts/check_layers.sh green, and tasks.toml updated in the same diff",
]
notes = "Filed rather than implemented directly, as requested. Not folded into N1/N3 (the ntfy/alerts push path): those fire on alert *findings* from the rules engine (Finding objects, severity-keyed), this fires on raw *data entry* regardless of whether any rule ever evaluates it - a different trigger, a different message shape, and Notifier.send(finding) is the wrong signature to overload for a plain formatted string, so a separate port (ports/whatsapp.py) is listed rather than extending ports/notifier.py's existing Finding-typed Notifier Protocol. Given a hard dependency: it does not need N1/N3 to be re-run or re-touched, but an implementer should read NtfyNotifier (ports/notifier.py) first as the load-bearing precedent for shape (Poster-style injectable seam, `configured` guard, catch-and-log around the network call) before writing a second adapter from scratch. depends left empty since no other task's code is a prerequisite, only its pattern. Two things flagged above as open rather than decided, per CLAUDE.md's 'write one concise question into notes' guidance, since they are genuine judgement calls rather than plumbing: exact secret-storage location, and the precise WhatsApp transport (Cloud API vs. a bridge) if Meta's own API is not what's wanted operationally. Message-format examples in the description come directly from Mark Baber's request and are not clinical copy (alerts/messages.py's architect-only carve-out does not apply to a plain data-entry echo), so the implementer may phrase per-domain detail text freely as long as it reuses HistoryService's existing short-detail values rather than re-deriving new wording per table. IMPLEMENTATION 2026-08-29, status review: all nine LoggingService domains (feed, nappy, sleep - both toggle_sleep branches, growth, temperature, milestone, note, expression, activity) now echo via a new public LoggingService.echo_event(table, event_id, ts), called after each repo write succeeds so a failed send can never lose the event. Transport: went with Meta's WhatsApp Cloud API as flagged as the default, not a self-hosted bridge - a bearer-token JSON POST over httpx (ports/whatsapp.py's WhatsAppCloudNotifier), no new dependency, mirroring NtfyNotifier's shape exactly as directed (Poster Protocol, configured guard, lazy httpx import, catch-all around the network call), except send() returns bool rather than None so the caller can record the outcome. Secret storage: access_token and phone_number_id are read from CRADLE_WHATSAPP_TOKEN / CRADLE_WHATSAPP_PHONE_ID environment variables and never written to disk by this app - judged materially more sensitive than a shared ntfy topic, so unlike N3 they are kept off rules_config.toml (git-tracked) entirely, and this repo has no git-ignored local-secrets-file convention to extend instead. chat_id (the destination, not sensitive) is runtime-editable from /settings like N3's topic, but is NOT TOML-backed: this task's own touches list has no room for rules_config.toml (unlike N3's, which listed it), so chat_id instead lives in a new one-row whatsapp_settings table (migration 0008), read/written via new ChatLogRepo.get_chat_id()/set_chat_id() methods. 'Last message date' for the date-header logic: went with the recommended shape, a chat_log table (migration 0008) recording every send attempt (success or failure) rather than a boolean flag, giving the audit trail the task's own name promises; last_local_date() reads MAX(local_date) across all rows rather than the most-recently-inserted row, so a backdated entry (U2's adjust-time flow) logged after a same-day real-time one cannot reissue a spurious date header - caught in house review, fixed, and covered by test_backdated_entry_does_not_reissue_a_spurious_date_header. Signature changes recorded per CLAUDE.md: LoggingService gained three new trailing constructor params (history, whatsapp, chat_log), all defaulting to None so every existing LoggingService(repo, clock) call site elsewhere in the repo (~20, none in this task's touches) keeps working unchanged and the echo is simply inert until wired; build_services() gained a new required whatsapp parameter, safe because build_services is only ever called from within app.py's own create_app() (verified - no external caller exists to break). Known gap, by design: milk_batch is inserted by MilkStockService (src/cradle/services/milk_service.py), not LoggingService, so it does not actually pass through echo_event() in this diff - milk_service.py is the file that would need to call it, and it is not in this task's touches list. test_milk_batch_echo_shares_the_same_mechanism proves echo_event() already produces the correct message for a milk_batch row when invoked directly, so wiring it up is the only remaining step; filed as N6 rather than grown into this diff, per CLAUDE.md's 'append a new task, don't grow the diff'. scripts/test.sh (659 passed), scripts/lint.sh, scripts/check_layers.sh and scripts/backlog.py all green; diff scoped to exactly this task's touches list."

