[[task]]
id = "U41"
phase = 1
title = "Charts page: cut load-to-render time via server-side caching + a lighter/lazier Plotly path"
status = "todo"
routing = "impl"
depends = []
touches = [
    "src/cradle/services/growth_service.py",
    "src/cradle/routers/static/sw.js",
    "src/cradle/routers/static/chart.js",
    "src/cradle/routers/static/series.js",
    "scripts/vendor_assets.sh",
    "tests/unit/test_growth_service.py",
    "tests/unit/test_weight_budget.py",
    "tests/routes/test_charts.py",
]
description = "Raised by Mark Baber, 2026-08-23: /charts can take a second or more to render, and Mark Baber named both caching and a better drawing approach as acceptable fixes. Root causes, found by inspection: (1) scripts/vendor_assets.sh vendors Plotly's full bundle (PLOTLY_URL=https://cdn.plot.ly/plotly-${PLOTLY_VERSION}.min.js -> src/cradle/routers/static/vendor/plotly.min.js, currently ~4.5MB unminified-on-disk) even though this app only ever uses cartesian trace types - bar, scatter, lines+markers, a dual y-axis (yaxis2 overlaying), fill:\"tonexty\", and Plotly.addFrames/animate for the growth-chart centile playback (chart.js, series.js) - never 3d/geo/gl/mapbox/finance. Plotly publishes smaller partial bundles (e.g. a cartesian-only build) built from the same source as the full bundle - swapping which one vendor_assets.sh fetches is not a new dependency (SPEC §6, ADR 0009 - still Plotly.js, still vendored) and should cut both download size and, more importantly, the JS parse/compile/execute cost paid on every page load, which is the actual dominant cost of a 1+ second wait. (2) The service worker (sw.js, task W1) precaches only app.css/manifest.json/icon.svg - plotly.min.js, chart.js and series.js are never precached, so even a repeat visit to /charts re-fetches (or at best HTTP-revalidates) the multi-megabyte bundle instead of getting it instantly from the SW cache. (3) /charts and /api/charts/{measure} recompute GrowthService.centile_chart_series() from scratch on every request - a loop of value_at_z/value_at_centile calls across ~9 centiles x up to ~120 ages - even though the result only changes when a new growth event is logged for that measure or the baby profile changes; GrowthService is constructed once per process (app.py's build_services) and its instance already lives for the app's lifetime, so an instance-level cache keyed on something cheap that changes exactly when the real inputs change (e.g. measure + baby identity/sex/dob + the count or latest id/ts of that measure's growth events) is a correct, low-risk win with no new infrastructure. Fix all three: (a) swap vendor_assets.sh to fetch a Plotly bundle variant that still covers every trace/feature this app actually uses - verify the real vendored file's exposed registry/capabilities directly (e.g. its trace-type registry or an explicit feature check), not from Plotly's marketing docs, the same verify-the-real-vendored-source discipline U29/U30/U31 already established for AnyPicker, and if no smaller published bundle actually covers everything used here, stop and record that gap in this task's notes rather than silently keeping the full bundle or vendoring something outside Plotly's own published builds; (b) add plotly.min.js, chart.js and series.js to sw.js's precached ASSETS array and bump CACHE (\"cradle-static-v1\" -> v2) per its existing cache-busting convention, keeping test_service_worker_caches_static_only's GET-only/static-only invariants intact; (c) memoize centile_chart_series in GrowthService with correct invalidation on new growth events/profile changes. Do not touch the LMS math itself (reference/lms.py, out of touches, architect-owned per CLAUDE.md) - this is caching around it, not changing it."
exit_criteria = ["GrowthService.centile_chart_series() does not redo its LMS interpolation loop on a second call for the same measure/baby/events, verified by a call-count or timing-shaped unit test (test)", "logging a new growth event for a measure (or changing the baby profile) invalidates that cache - the very next centile_chart_series() call reflects the new data, not a stale cached result (test)", "plotly.min.js, chart.js and series.js are present in sw.js's precached ASSETS list with CACHE bumped, and test_service_worker_caches_static_only's existing safety assertions still pass (test)", "scripts/vendor_assets.sh fetches a Plotly bundle variant smaller than today's full plotly.min.js while still supporting every trace type/feature /charts actually uses (bar, scatter, lines+markers, dual y-axis, fill \"tonexty\", addFrames/animate) - verified against the real vendored file, and every existing /charts and /api/charts/{measure}, /api/series/daily, /api/series/ribbon route test in tests/routes/test_charts.py still passes unchanged (route test / regression)", "scripts/test.sh, scripts/lint.sh, and scripts/check_layers.sh green"]
notes = "Filed by Mark Baber, 2026-08-23: 'a second or more to load the charts... use caching, or an improved way of drawing the plots'. This task does both rather than picking one, since the two root causes (an uncached heavy JS bundle fetched fresh every visit, and a per-request server-side recompute) are independent and cheap to fix together. Left to implementer's judgement, not required by exit_criteria: if these three changes don't feel sufficient once measured, lazily initializing the four below-the-fold daily-totals charts (series.js's feedschart/wetchart/dirtychart/sleeptargetchart, currently all rendered synchronously via one shared fetch in renderPerMetricCharts) via IntersectionObserver so they don't all pay Plotly.newPlot's cost before the user sees anything is a reasonable follow-on, same presentation latitude other tasks in this queue get - but it is not required to close this task. Does not touch reference/lms.py (architect-owned clinical math) or SPEC/ADR 0009's choice of Plotly itself (D9) - only which published Plotly bundle is vendored and how/when it's fetched, which needs no architect sign-off since the dependency set (SPEC §6) is unchanged."

[[task]]
id = "U42"
phase = 1
title = "Badges, achievements & medals: reward engagement without deadlines or pressure"
status = "done"
routing = "impl"
depends = ["P1", "V1", "U1", "U2"]
touches = [
    "src/cradle/models/achievements.py",
    "src/cradle/models/__init__.py",
    "src/cradle/repos/badges_repo.py",
    "src/cradle/repos/migrations/",
    "src/cradle/services/achievements_service.py",
    "src/cradle/services/__init__.py",
    "src/cradle/routers/deps.py",
    "src/cradle/app.py",
    "src/cradle/routers/pages.py",
    "src/cradle/routers/api.py",
    "src/cradle/routers/templates/achievements.html",
    "src/cradle/routers/templates/base.html",
    "src/cradle/routers/templates/quick_entry.html",
    "src/cradle/routers/static/entry.js",
    "src/cradle/routers/static/app.css",
    "tests/unit/test_achievements_service.py",
    "tests/unit/test_badges_repo.py",
    "tests/routes/test_achievements.py",
    "tests/routes/test_quick_entry.py",
    "tests/unit/test_weight_budget.py",
]
description = "Raised by Mark Baber, 2026-08-23: add a badges/achievements/medals system that rewards a parent for logging data, caring for the baby, and exploring the app - and separately celebrates the baby's own first-time moments (e.g. 'first bus ride') - framed entirely as a positive surprise, never a checklist with a deadline. Two badge families in one system: (1) parent/engagement badges - e.g. first feed logged, first full day tracked, first time each quick-entry category (feed/nappy/sleep/growth/temperature/activity) has been used, a small number of gentle usage milestones - awarded by a new AchievementsService reading the existing per-domain repos (EventsRepo, P1), never by adding fields to LoggingService or changing any of its method signatures (V1's log_* contracts are unchanged - this is a read-only observer bolted on alongside logging, evaluated in routers/api.py right after each existing svc.logging.log_*() call succeeds, the same place U2's undo-toast is already assembled); (2) baby 'moment' badges keyed off the existing open-ended Milestone domain (models.Milestone, category='first', free-text title, SPEC 5.1/5.4) - since the app cannot enumerate every possible first (bus ride, haircut, swim...) in advance, award a 'moment captured' badge each time a new category='first' milestone is logged, rather than hardcoding a fixed list of moment names. Persist awards in a new `badge` table (new migration under repos/migrations/, applied automatically by Db.migrate() same as every prior migration) with a UNIQUE(baby_id, badge_key) constraint mirroring alert_log's existing fingerprint-uniqueness dedup pattern (0001_init.sql) so the same badge can never be double-awarded to the same baby; badges are additive only - once awarded a row is never deleted or updated, there is no expiry, and nothing about a badge is ever presented as overdue or missed, per Mark Baber's explicit 'reward, not a chore... do not want the user to feel they have to do a set of tasks by a specific time' - concretely: no due-by dates, no countdowns, no streak-loss messaging, and no reuse of alerts/app.css's amber/red severity styling anywhere in this feature, since an achievement is never a health signal. Wire a new /achievements page (routers/pages.py, added to base.html's tabbar following the same first-run-with-no-profile redirect every other page already uses) that lists every earned badge with when it was earned, so a parent can look back at their own progress; any not-yet-earned badge shown there (optional, implementer's judgement on whether to show locked badges at all) must render neutrally - name/description only, no progress-bar-with-deadline framing. On the quick-entry page, a fresh unlock triggers a small celebratory animation distinct from the existing undo-toast (U2) and, only at that exact unlock moment, an optional short sound - never on ordinary page loads or on a save that unlocks nothing. Because this app is routinely used at night beside a sleeping baby, sound must default OFF and be controlled by an easily reachable, persisted mute/unmute control (e.g. a toggle on the celebration UI itself and/or in Settings) - once muted, nothing plays until re-enabled. Keep the animation/sound assets out of the initial quick-entry payload (fetch them lazily only at the moment a badge actually unlocks) so the Q1 weight-budget test is unaffected by default; add new services.__init__/routers.deps.Services/app.py wiring for AchievementsService the same additive way every other service (growth, alerts, milestones, export, series, milk, projections) was already added to the Services dataclass over time - this is a new field, not a change to any existing one, so it needs no architect sign-off under CLAUDE.md's 'public signatures are contracts' rule. Badge names/descriptions are UX/reward copy, not medical claims or clinical thresholds, so - unlike alerts/messages.py and rules_config.toml's clinical tables - they are not inside CLAUDE.md's architect-only carve-out and can be authored directly in this task; do not add a new alerts/rules.py rule, a messages.py entry, or a scheduler sweep job for any of this - achievements are evaluated synchronously alongside the user's own action, never as a background nagging check, which is the mechanism that keeps this feature feeling like a reward rather than another thing being monitored."
exit_criteria = ["a new `badge` table (migration in repos/migrations/) records one row per award with a UNIQUE(baby_id, badge_key) constraint, so the same badge can never be awarded twice to the same baby (test)", "AchievementsService evaluates a starter catalog covering at least: first use of each quick-entry category (feed/nappy/sleep/growth/temperature/activity), and a 'moment captured' badge for every new category='first' Milestone logged (covering the open-ended 'first bus ride' case) - fire and no-fire cases per badge type (test)", "logging an event through the existing quick-entry POST flow that earns a new badge returns it in the HTMX response without changing any LoggingService method's signature (route test)", "logging the same event again, or any event that does not newly qualify, awards nothing extra - repeat calls never double-award (test)", "the quick-entry page renders a distinct celebration (visually different from the U2 undo-toast) only on a genuine new unlock, never on a plain save or page load (route test)", "achievement sound defaults off and is controlled by a persisted mute/unmute toggle; once muted, no further sounds play (test)", "a new /achievements page, reachable from base.html's tabbar and following the existing first-run-with-no-profile redirect pattern, lists every earned badge with its award time (route test)", "no earned badge is ever removed, hidden, marked overdue, or styled with the alerts amber/red severity classes; any unearned badge shown renders neutrally with no deadline/countdown framing (test)", "no new alerts/rules.py rule, alerts/messages.py entry, or scheduler sweep job is added for achievements - evaluation is regression-tested as synchronous-only (test)", "quick-entry and any other changed static payloads are re-measured against the Q1 weight-budget test; lazy-loading the animation/sound assets should leave the existing budget unmoved, but if it still grows the test is amended in the same diff with the new total recorded (test)", "scripts/test.sh, scripts/lint.sh, and scripts/check_layers.sh green"]
notes = "Filed by Mark Baber, 2026-08-23: 'add badges, achievements and medals... encourage the user to enter data, look after their baby effectively and go beyond by enriching and teaching them... should be seen as a reward, not a chore... should look special, with animations and sounds... able to look at their past achievements... also achievements for moments, like first bus ride'. Deliberately scoped as plumbing + a modest starter catalog (roughly half a dozen parent badges plus the open-ended moment badge) rather than a large content catalog - the badge-definition list is meant to be easy to extend later (same 'data-driven, not a pile of copy-pasted branches' latitude given to U31/U34/U36's wheel catalogs), and growing it further is a natural, non-blocking follow-up rather than in-scope here. Deliberately does NOT reuse alerts/ (rules.py/engine.py/messages.py) even though the alerts engine's fact-in/finding-out determinism and alert_log's fingerprint dedup are the direct inspiration for this feature's own dedup - alerts is architect-owned clinical-copy territory (CLAUDE.md) and a positive-reinforcement badge is not a health signal, so keeping this entirely inside services/repos/routers avoids any risk of gamification copy drifting into medical-adjacent territory and avoids touching check_layers.sh's layering contract at all. No architect sign-off recorded because: (a) the Services dataclass gains an additive field only, no existing signature changes; (b) badge copy is reward/UX text, not a clinical claim or threshold, so it sits outside CLAUDE.md's alerts/messages.py + rules_config.toml carve-out the same way [entry_defaults]/[projections]/[wheel_steps] already do for their own reasons (U37's notes give the same style of reasoning). Sound defaulting off (rather than on) is a deliberate safety-first choice given the app's real usage pattern (logging at night beside a sleeping baby) - flagged here in case Mark Baber would rather default it on with a very quiet/short cue instead."

