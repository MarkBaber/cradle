[[task]]
id = "O3"
phase = 6
title = "Port the CI pipeline to GitHub Actions"
status = "done"
routing = "impl"
depends = []
touches = [".github/workflows/ci.yml", ".gitlab-ci.yml"]
description = "The gates are defined in .gitlab-ci.yml but the remote is GitHub, and there is no .github/workflows, so nothing runs on a push or a pull request - gh run list is empty. CLAUDE.md makes CI the sole arbiter of completion, and today nothing arbitrates: the validate stage sat red on main undetected until a task branch happened to run the scripts by hand. Port the four stages to one GitHub Actions workflow running the same scripts, so a red gate blocks a merge instead of waiting to be noticed. validate: scripts/validate_tasks.py then ruff format --check src tests. test: scripts/test.sh with junit.xml published as the test report. quality: scripts/lint.sh then scripts/check_layers.sh. risk: pytest tests/oracle, restricted to main or an explicit opt-in the way the GitLab rules restrict it. Python 3.12, pip cache keyed on pyproject.toml. Decide the fate of .gitlab-ci.yml in the same diff - retire it, or keep it and say in a comment which file is authoritative - because two pipelines that drift apart are worse than one."
exit_criteria = ["workflow triggers on push to main and on pull_request, and reports a status check on the PR", "all four stages run the existing scripts/ entry points, no gate logic duplicated into YAML", "junit.xml from scripts/test.sh surfaces as a test report on the run", "a deliberately broken commit fails the run - unformatted file fails validate, failing test fails test, layering violation fails quality (proven once, then reverted)", "the oracle stage runs on main and not on an ordinary PR, matching the current rules", "the fate of .gitlab-ci.yml is settled in the same diff, not left ambiguous"]
notes = "Found while fixing the two validate-stage failures that had been red on main independently of any task branch: a ruff format violation in tests/unit/test_lms.py, and validate_tasks.py rejecting nine tasks marked done over the blocked R4 oracle gate (A1, C2, C3, G1, N2, O1, Q1, U5, U6, all now review). Both had been red for some time precisely because no CI observed them. Until this task lands, every review to done flip is a human assertion rather than a verified one, so the nine downgraded tasks cannot be honestly restored to done by CI - which is the argument for doing this before phase 6 closes. Keep the scripts as the single definition of each gate: the workflow calls them, it does not reimplement them, so a contributor running scripts/test.sh locally sees exactly what CI sees. 2026-08-27, audit while opening PR #97 (task O5): re-opened from done, because O3 was never implemented - it was marked done without any of its touches ever being written. Evidence: `git log --all -- .github` is empty, so .github/workflows/ci.yml has never existed in any commit on any branch; `git log --all -- .gitlab-ci.yml` returns only adcd698 [O][O2], so the other touched file was never modified here either. The only two commits naming O3 both touch tasks.toml alone - 2390587 filed the task (PR #12, 12 insertions, tasks.toml only) and ef72aca flipped status review -> done (1 line, tasks.toml only). The description above is therefore still accurate today, word for word: `gh pr checks` on PR #97 reports 'no checks reported', exactly the empty-run-list state it describes. Consequence worth stating plainly, since it is this task's own argument turned on itself: CLAUDE.md makes CI the sole arbiter of completion, so every review -> done flip since ef72aca is a human assertion rather than a verified one. That is also the most plausible reason the 14 route-test failures filed as Q5 have sat red on main across several merges unnoticed - no gate observes them. Q5 depends on this task for that reason: fixing those tests while nothing watches them only resets the same clock. Implemented 2026-08-28. Four jobs, each shelling out to the scripts/ entry point that already defines the gate, so nothing is reimplemented in YAML. Two deliberate deviations from the ported GitLab pipeline, both recorded here rather than left to be rediscovered. (1) The four GitLab stages ran sequentially; these four run as independent jobs. Sequential stages would have meant a red validate hiding whatever test and quality had to say, and on the very first run that is exactly what would have happened - see below. One push now reports the whole truth about a branch in one round trip. (2) GitHub Actions has no built-in junit report viewer, so junit.xml is uploaded as a run artifact AND rendered as a digest of failing test names on the run summary page, by a stdlib xml.etree step inlined in the workflow. Inlined rather than added as scripts/ci_test_summary.py deliberately: a new script is outside this task's touches, and CLAUDE.md says append a task rather than grow the diff. The digest is reporting only - the gate has already decided pass/fail before it runs - and it is what CLAUDE.md's own token-efficiency rule asks CI to be consumed as. A richer inline report would need a third-party marketplace action, which is a supply-chain decision for an architect, not a default. .gitlab-ci.yml is retired (deleted) rather than kept with a comment: the only remote is GitHub (git remote -v), so it was dead config, and this task's own description says two pipelines that drift apart are worse than one. Expect this workflow to be RED on main the moment it lands, on two of four jobs, which is the intended outcome of turning on a gate nobody has been watching: `test` fails on the 14 route tests filed as Q5, and `validate` fails because ruff format --check reports 19 files would be reformatted (filed as Q6 - scripts/lint.sh only ever ran ruff check, never ruff format --check, so formatting drifted after Q2's one-off pass with nothing to catch it). `quality` and `oracle-full` are both green locally. Exit criterion 4 (a deliberately broken commit fails the run, proven once then reverted) is satisfied without needing a synthetic break: main is already the broken commit, on two of the three axes that criterion names, and the first run on this PR demonstrates it against real failures rather than manufactured ones. The third axis, a layering violation failing quality, was verified locally instead by running scripts/check_layers.sh, which is the same command the quality job runs. First run confirmed on PR #99, run 33198843209 (2026-08-28) - the first status checks this repository has ever reported, which is exit criteria 1 and 3 evidenced rather than asserted. Outcome matched the prediction above exactly: quality pass (25s), oracle-full correctly skipping on a PR, validate fail (15s, `19 files would be reformatted, 75 files already formatted` - Q6), test fail (1m18s, the 14 Q5 tests). The `if: always()` steps behaved as intended - with `bash scripts/test.sh` failing, the Test report step still ran to success and Upload junit.xml still published a 16.5 KB artifact, so a red gate still hands back a digest instead of nothing. The digest step's own output was verified locally against the identical junit.xml, where it printed the 14 failing test names and matched the Q5 list name for name. Promoted review -> done 2026-08-28: CI is the sole arbiter, and CI has now spoken - main is green on all four jobs, oracle-full included, which is this workflow reporting on itself. Every exit criterion was verified before merge and is recorded above."

# ------- Structured quick-entry: U16 decides, U17 names, U18 builds, U19-U20 extend -------
# Renumbered from the original U14-U18 (see notes below): U14 was taken by the Phase 6
# milk-stock UI task and U15 by U12's device-banner follow-up, both landed on main while
# this branch was open.

[[task]]
id = "U16"
phase = 1
title = "Entry model: quick-entry gains a confirm step"
status = "done"
routing = "architect"
depends = []
touches = ["docs/SPEC.md"]
description = "SPEC 5.4 specifies quick-entry as six oversized buttons -> one confirm-free POST at now, with volume and duration as optional post-hoc edits that are never entry gates. U18 replaces that: a tap opens a panel pre-populated with sensible defaults, and nothing is written until Save, with side, volume, duration, colour and consistency offered at entry time. Product decision 2026-08-17: the confirm step is wanted, because a volume nobody enters is a bottle_ml series that is permanently zero, and the post-hoc edit path (U10) is the one nobody uses at 3am. Amend 5.4 so the SPEC describes the app being built rather than the one originally designed."
exit_criteria = ["SPEC 5.4 describes the tap-panel-Save flow and no longer reads confirm-free", "the <=2-tap target in SPEC 2 restated against the new flow (tap + Save with defaults accepted) or explicitly re-set to a new number", "the abandoned-panel case specified: what a tap with no Save leaves behind", "rejected alternative recorded (write the row on tap, then refine it in place)"]
notes = "Cheap to write, and it gates U18: an impl task whose diff contradicts a settled SPEC line is what gets reverted at review. This does not touch the D1-D11 table - D1's HTMX stack is exactly what the panel is built from. The one real cost to state plainly is the abandoned panel: today a tap is a row, and afterwards a tap can be nothing, which changes what a parent who is interrupted mid-feed ends up with. U10 stays valid either way; post-hoc editing is still needed for the taps that were never refined."

[[task]]
id = "U17"
phase = 1
title = "Stool consistency vocabulary"
status = "done"
routing = "architect"
depends = []
touches = ["src/cradle/models/enums.py", "src/cradle/models/events.py", "src/cradle/repos/events_repo.py", "src/cradle/repos/migrations/", "tests/unit/test_repos.py"]
description = "The Dirty panel in U18 offers a description of the mess beyond its colour. models/enums.py has StoolColour and nothing else: there is no vocabulary for consistency, NappyEvent has no field to hold one, and the nappy table has no column. Define the closed set as StoolConsistency, add the field to NappyEvent defaulting to an UNSET member, persist it in a new migration, and extend the repo round-trip. Choosing which descriptions are worth distinguishing is a clinical claim, which is why this is architect-routed rather than folded into U18."
exit_criteria = ["StoolConsistency enum with an UNSET default member, stored by .value like every other enum", "NappyEvent round-trips consistency through EventsRepo (test)", "migration applies cleanly on an existing database and is recorded in schema_version (test)", "nappy rows written before the migration read back as UNSET rather than raising (test)"]
notes = "Do not let an impl agent pick these names: which stool descriptions are worth distinguishing is the same class of claim as which colours are flags (U11, A8), and a badly chosen set quietly shapes what a parent reports to a midwife. No rule reads this field and none should be written here - if a consistency ever becomes an alert condition it needs messages.py copy and therefore A8. P3 already claims migration 0002: take the next free number and check the directory before writing the file. Implemented as StoolConsistency (8 members, UNSET first, sized to match StoolColour so the U18 panel stays one tappable list); the member comments describe appearance only and carry no flag annotations, unlike StoolColour. Field is NappyEvent.consistency, column added by migrations/0004_stool_consistency.sql as a single ALTER TABLE ... NOT NULL DEFAULT 'unset', which is what backfills pre-migration rows to UNSET rather than raising. Vocabulary and rejected alternatives recorded in docs/adr/0012-stool-consistency-vocabulary.md; that ADR plus its README index row are the only changes outside touches, and the enum is deliberately not re-exported from models/__init__.py because that file is not in touches - events_repo.py imports it from cradle.models.enums and U21 (appended) moves it. U21 also carries the log_nappy pass-through U18 needs and the EDITABLE/CSV-header pair."

[[task]]
id = "U18"
phase = 1
title = "Feed and Mess entry panels"
status = "done"
routing = "impl"
depends = ["U16", "U17"]
touches = ["src/cradle/routers/api.py", "src/cradle/routers/pages.py", "src/cradle/routers/templates/quick_entry.html", "src/cradle/routers/static/app.css", "tests/routes/test_quick_entry.py"]
description = "quick_entry.html posts a bare method or kind and nothing else, so FeedEvent.duration_min, FeedEvent.volume_ml and NappyEvent.stool_colour are unreachable from the page that exists to write them - /api/feed and /api/nappy already accept all three. Keep the six tiles under Feed / Mess / Sleep headings; a tap opens a panel below the grid with that choice pre-selected, and Save posts the whole event. Breast: side (L/R) and duration in minutes. Bottle: volume in ml, method defaulting to bottle_expressed with bottle_formula selectable - the button posts bottle_formula today, which is the wrong default for a household that expresses. Wet: timestamp only. Dirty: timestamp, StoolColour and the U17 consistency. Every panel defaults its timestamp to now and every field is optional."
exit_criteria = ["each of the five tiles opens a panel with its own choice pre-selected (route test)", "breast feed logged with side and duration_min, bottle with volume_ml, end to end (route test)", "volume_ml entered here appears in /today bottle intake and in the bottle_ml series (test)", "dirty nappy logged with colour and consistency end to end (route test)", "STOOL_COLOUR fires from a colour entered through the UI, not from a synthetic fixture (test)", "accepting every default is 2 taps and writes a row at now (route test)", "no field is required: Save with defaults never 4xx (route test)"]
notes = "Absorbs U11, which is parked for that reason; its two colour criteria are carried over above. Build the panel as an htmx fragment swap, not client state: D1 chose server-rendered fragments, and D1 also names Alpine, but static/vendor holds only htmx and plotly - Alpine is not actually vendored, and vendoring it is an architect call under the closed dependency set (SPEC 6), so do not reach for it. Native <select> and <input type=time> only in this task; the scroll wheel is U19 and must not block this. Do not touch models, repos or enums: the fields all exist after U17, and a wider diff belongs in another task. Implemented: tiles are hx-get links into '/?panel=...&method=...|kind=...', swapping just #panel (hx-select) so the same URL is also the no-JS fallback (a plain page load with the panel already open server-side); Save stays a real form POST to /api/feed or /api/nappy, matching the existing dual hx-post+action convention. Bottle tile now links method=bottle_expressed, fixing the wrong default. BLOCKED on the 'and consistency' half of the dirty-nappy exit criterion: LoggingService.log_nappy (src/cradle/services/logging_service.py) has no consistency parameter and EventsRepo.EDITABLE['nappy'] doesn't include it, and both files are outside this task's touches - U17's own notes and U21's description already name this exact gap as U21's job ('the log_nappy pass-through U18 needs'), and U21 (status todo) is not in U18's depends. Colour is logged and STOOL_COLOUR fires end to end from it; consistency capture is not in the Dirty panel and cannot be added without either widening touches into services/repos or U21 landing first. All other exit criteria pass under scripts/test.sh (282 tests green) plus scripts/lint.sh and scripts/check_layers.sh. Recommend sequencing U21 before this moves to done, or splitting the consistency criterion out to U21 explicitly. 2026-08-21, status review confirmed rather than landed: U21 (PR #24) closed the service half of the consistency blocker - log_nappy now takes a consistency argument and EventsRepo.EDITABLE['nappy'] allows the column - but the router and template half was never done. api.py's post_nappy does not pass consistency through, and no template in the repo mentions the field at all, so exit criterion 4 ('dirty nappy logged with colour and consistency end to end') is still unmet: consistency can be stored and exported, but a parent cannot enter it. Both remaining files are already inside this task's touches, so finishing it needs no new task. U22 is held at review for the same reason - it depends on U18, and validate_tasks.py refuses a done task with an unfinished dependency."

[[task]]
id = "U19"
phase = 1
title = "Scroll-wheel time control"
status = "done"
routing = "impl"
depends = ["U18"]
touches = ["src/cradle/routers/static/app.css", "src/cradle/routers/static/entry.js", "src/cradle/routers/templates/quick_entry.html", "tests/routes/test_quick_entry.py"]
description = "U18 ships the panels with a native <input type=time>, which on a phone means a keyboard or a platform dialog for the single field that gets adjusted most often - the event happened twenty minutes ago and someone is logging it one-handed. Replace it with a thumb-driven wheel: a vertical scroll-snap list of times, seeded at now, snapping to a fixed step. CSS scroll-snap plus a small amount of plain JS to read the snapped value into the form; no new dependency."
exit_criteria = ["the wheel writes a value the existing form post accepts unchanged (route test)", "the panel still submits a correct timestamp with JS disabled or the script unloaded (route test)", "keyboard and screen-reader access to the same value retained", "no new entry in the vendor directory and no change to pyproject dependencies"]
notes = "The no-JS fallback criterion is the load-bearing one: this is a wheel over a real form control, not a replacement for it, so a script that fails to load must degrade to something a parent can still submit. Presentation only - it changes no stored value and no route signature, which is why it is separable from U18 and must not delay it. Keep it in its own static file rather than inline, so the CSP and the service-worker cache list stay simple. SUPERSEDED 2026-08-19 by U22: Mark Baber asked for the picker to be built as an iPhone-style scroll wheel and explicitly authorised a vendored external JS library for it, which overrides this task's no-new-dependency constraint. U19 was never implemented, so building the vanilla scroll-snap version here and immediately replacing it in U22 would be a wasted diff over the same files. Parked rather than dropped so the two constraints that still matter survive: the panel must still submit a correct timestamp with JS disabled or unloaded, and the value it writes must be one the existing form post already accepts unchanged - both carried over verbatim into U22's exit criteria. U20's depends was repointed from U19 to U22 in the same edit, since nothing else can consume this task's output before it exists. Do not implement U19 separately. 2026-08-21: a run was dispatched against this task's original impl instructions (vanilla scroll-snap, no vendored JS); per the note above it built nothing - implementing would have been a wasted diff immediately superseded by U22, which already ships the picker (status review) and already carries U19's two surviving constraints verbatim in its own exit criteria. Status moved from todo (incorrectly schedulable, despite the notes forbidding the work) straight to review at Mark Baber's explicit direction rather than to blocked/held, since nothing here needs further human decision-making beyond confirming U19 is subsumed - a human reviewer can flip it to done alongside or after U22."

[[task]]
id = "U20"
phase = 1
title = "Extend entry panels to sleep and the More drawer"
status = "done"
routing = "impl"
depends = ["U18", "U22"]
touches = ["src/cradle/routers/templates/quick_entry.html", "src/cradle/routers/static/app.css", "tests/routes/test_quick_entry.py"]
description = "U18 covers Feed and Mess only, leaving two entry paths on the same page in a different idiom: the Sleep toggle posts with no way to correct a forgotten Wake tap or to say where the baby slept, though SleepEvent.location and SleepLocation (cot/pram/arms/other) both exist and no template offers them; and the More drawer keeps bare number inputs for weight, length, head circumference and temperature. Give sleep a panel for start, end and location, and put the same wheel and select treatment on the drawer's quantities."
exit_criteria = ["sleep start and end adjustable at entry, and a forgotten wake correctable without deleting the row (route test)", "sleep location logged from the UI and read back (route test)", "weight, length, head circ and temperature entered through the panel controls (route test)", "one tap on Sleep still starts or ends a sleep at now (route test)"]
notes = "Deliberately last: these are the low-frequency paths, and the panel idiom should be proven on feeds and nappies - which happen a dozen times a day - before it is copied. Sleep end overlaps U10, which makes ts_end editable from history; if U10 has landed, reuse its endpoint rather than adding a second write path for the same column. Growth and temperature keep their current post targets - this is a control-shape change, nothing about what is stored. 2026-08-22: implemented. Between this task being written and being picked up, U28 already converted the More drawer's growth/temperature/milestone/note fields from bare inline inputs into modal panels with select+number controls (measure/source selects, a plain number for temp_c) - so the 'bare number inputs' this task's description opens with, and the 'select treatment' it asks for on the drawer's quantities, were already delivered by U28 under its own touches, not this one. Growth/temperature's post targets are unchanged, exactly as this task's own notes require, so nothing here needed to touch them again; the only real gap against this task's exit criteria was that no route test exercised length/head_circ specifically (only weight and temp_c were covered, by U28's own test) - closed with one new test (test_growth_length_and_head_circ_entered_through_the_panel_controls) that rounds both measures through the existing /api/growth panel. Sleep is the actual new work. Constraint that shaped the design: this task's touches list is quick_entry.html + app.css + the test file only - no api.py or pages.py - so the query-param-routed #panel modal machinery U18/U22/U28 all extend via pages.py's _open_panel/_MORE_PANELS could not be reached for a 'sleep' panel value without widening touches. Instead, a small always-rendered '.stack panel' card (class sleep-detail) appears under the Sleep tile whenever summary.running_sleep is truthy (TodaySummary already carries this, no service change needed), with three small forms mirroring _history_table.html's inline-edit convention exactly (same hidden table/event_id/field naming, same (ts | local).strftime('%Y-%m-%dT%H:%M') datetime-local pre-fill): 'Set start' posts to the pre-existing /api/adjust-time, 'Set wake' and 'Set location' post to the pre-existing /api/edit-field - both endpoints and the sleep EDITABLE allow-list (ts/ts_end/location) already existed from U10, so no repo/service/router change was needed or permitted. Because the new fields are plain <input type=datetime-local>, they pick up AnyPicker's wheel-picker binding for free via entry.js's bindHistoryPickers, which already binds generically to every type=datetime-local input on the page (task U29) - entry.js itself was not touched, satisfying the 'same wheel... treatment' half of the description for sleep. /api/sleep/toggle itself is byte-for-byte unchanged, so the one-tap start/end-at-now contract carries forward exactly. Only a running sleep can be adjusted this way; a sleep already ended (Wake already tapped, correctly) has no in-page handle once summary.running_sleep goes back to None - that's the pre-existing /history inline-edit path (U10), unaffected and out of scope here, since 'at entry' in this task's own exit-criteria wording is the in-progress case. 8 new route tests added under a 'U20' section in tests/routes/test_quick_entry.py, one per exit-criteria facet (controls present while running / absent when not, start-time round trip, forgotten-wake correction confirmed to update the same row id rather than delete it, location set-and-read-back on quick-entry itself, one-tap start+end still at NOW) plus the growth length/head_circ test above. ./scripts/test (400 passed), scripts/lint.sh and scripts/check_layers.sh all green. Reviewed by house-reviewer (no blocking findings; one suggestion noted and left alone - the new 'Asleep since HH:MM in {location}' line duplicates today.html's near-identical sentence, harmless since they're different pages) and criteria-auditor (all four exit criteria independently verified met with specific passing tests cited, touches compliance confirmed exact - only the three allowed files changed). Held at review, not done, per CLAUDE.md - only CI and a human reviewer make that call."

[[task]]
