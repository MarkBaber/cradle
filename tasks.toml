description = "Raised by Mark Baber, 2026-08-22: the bottle panel's volume_ml and breast panel's duration_min (U22) are plain <input type=number> fields today, needing a number typed by hand even though only certain step values are ever meaningful. Replace both with a touch-friendly scroll-wheel control matching the iOS feel U22/U29 already established for time: volume_ml steps in 5ml increments, breast duration_min steps in 5-minute increments. U27 (Tummy Time, Reading & Talking, Sensory Play, Foreign Language tiles) adds further duration_min fields on the same page; of those, Tummy Time's duration_min steps in 1-minute increments instead of 5 - the others are unspecified by this request and can stay whatever U27 lands with unless directed otherwise. Prefer reusing the already-vendored, already-authorised AnyPicker/jQuery (U29) for these wheels if its shipped build actually supports a bare numeric/list wheel (check the real mode/option names against the vendored anypicker.min.js source, not assumed from docs - same caveat U29 and U30 both flag) rather than pulling in a second picker library; if AnyPicker's shipped build cannot do a plain numeric wheel, stop and flag that gap in this task's notes rather than silently vendoring something new, since SPEC 6 closes the dependency set and adding to it is an architect decision, not an implementer's call."
exit_criteria = ["the bottle panel's volume_ml is a scroll-wheel control offering only multiples of 5, and Save posts the picked value through the existing volume_ml parsing unchanged (route test)", "the breast panel's duration_min is a scroll-wheel control in 5-minute steps, same contract (route test)", "if U27 has landed by the time this is implemented, its Tummy Time duration_min is a scroll-wheel control in 1-minute steps, same contract (route test); if U27 has not landed, this criterion is deferred and flagged as a follow-on in this task's notes rather than silently dropped", "every converted field still submits a correct value with the picker script disabled or unloaded, via the underlying native number input, matching U19/U22's no-JS contract (route test)", "quick-entry static payload is re-measured against the Q1 weight-budget test, and either stays inside budget or the test is amended in the same diff with the new total recorded (test)"]
notes = "Depends on U22 for the panel/field markup this restyles and on U27 for the Tummy Time field this also covers - U27 is status=\"todo\" as of 2026-08-22 (not yet started), so if this is picked up first, implement the bottle/breast wheels now, explicitly defer the Tummy Time criterion, and leave a note here rather than blocking the whole task on U27. This bundles bottle+breast+tummy-time into one task, not three, on the same grounds U22's own notes gave for bundling its four changes: all of them touch quick_entry.html/entry.js/app.css and their tests, and a second pass over the same files per field is exactly what CLAUDE.md's touches rule exists to avoid. Do not widen scope to volume/duration fields U27 might add beyond Tummy Time (Reading & Talking, Sensory Play, Foreign Language are duration-only with no increment specified here) - leave those as U27 lands them unless a follow-up task directs otherwise. 2026-08-22: implemented. Confirmed AnyPicker's shipped source supports mode: \"select\" with custom dataSource and components (reusing bindNumericWheel). (1) Bottle panel's volume_ml is bound via bindBottleVolumeWheel to BOTTLE_VOLUME_WHEEL (rangeValues(5, 500, 5), 5ml increments), saving through existing volume_ml parsing unchanged. (2) Breast panel's duration_min is bound via bindBreastDurationWheel to BREAST_DURATION_WHEEL (rangeValues(5, 120, 5), 5-minute steps), saving through existing duration_min parsing unchanged. (3) U27's activity panel and Tummy Time category landed in tree; Tummy Time duration_min is bound via bindTummyDurationWheel to TUMMY_DURATION_WHEEL (rangeValues(1, 60, 1), 1-minute steps), saving through existing duration_min parsing unchanged. (4) No-JS contract verified: all converted fields submit correctly without JS via underlying native number inputs. (5) Weight budget: quick-entry payload stays comfortably within budget; test_weight_budget passes unmodified. 4 new route tests added to tests/routes/test_quick_entry.py. All 456 tests green under ./scripts/test, python3 scripts/backlog.py OK."

[[task]]
id = "U32"
phase = 1
title = "FeedMethod: BREAST_BOTH so a both-sides feed is one event, not two"
status = "done"
routing = "architect"
depends = ["U22"]
touches = ["src/cradle/models/enums.py", "src/cradle/models/events.py", "src/cradle/services/logging_service.py", "src/cradle/services/projection_service.py", "src/cradle/services/milk_service.py", "src/cradle/repos/events_repo.py", "src/cradle/routers/api.py", "src/cradle/routers/pages.py", "src/cradle/routers/templates/quick_entry.html", "src/cradle/routers/static/app.css", "tests/unit/test_repos.py", "tests/unit/test_logging_service.py", "tests/unit/test_projection_service.py", "tests/routes/test_quick_entry.py"]
description = "Raised by Mark Baber, 2026-08-22: the breast panel's L/R toggle (U22) is a mutually-exclusive radio pair, so a feed that used both sides has no way to be logged as itself - only as two separate taps producing two separate rows. Allow both L and R toggle buttons to be active at once, and add FeedMethod.BREAST_BOTH = \"breast_both\" so a both-sides feed is one event with method=breast_both, the direct analogue of the BreastSide.BOTH value already used for pumping sessions (M1) - confirmed with Mark Baber (2026-08-22): one combined event is the wanted representation, not two rows from one Save. Change the toggle-input radios to controls that allow both active simultaneously (independently-toggleable checkboxes, or an equivalent the implementer judges cleanest) mapping to breast_left / breast_right / breast_both depending on which are active at Save. Every place FeedMethod is matched exhaustively must treat BREAST_BOTH as a breast feed alongside BREAST_LEFT/BREAST_RIGHT: in particular projection_service's feed-rate logic (U26), which already skips breast feeds as rate samples and resets the projection clock on them by matching BREAST_LEFT/BREAST_RIGHT - BREAST_BOTH must fall into the same branch, not the bottle branch and not an unmatched default."
exit_criteria = ["FeedMethod gains BREAST_BOTH = \"breast_both\"; BREAST_LEFT/BREAST_RIGHT and their .value strings are unchanged (test)", "the breast panel's L and R toggle buttons can both be made active at once, and Save with both active posts method=breast_both, persisted via the existing /api/feed endpoint (route test)", "Save with exactly one of L/R active still posts breast_left/breast_right unchanged, regression-covering U22's own exit criterion for the toggle pair (route test)", "projection_service's feed-rate/clock-reset logic (U26) treats a breast_both feed exactly as it treats breast_left/breast_right - skipped as a rate sample, resets the due_at clock - not as a bottle feed or an unmatched case (test)", "scripts/check_layers.sh green"]
notes = "Public-enum change - architect sign-off recorded here per CLAUDE.md's 'public signatures are contracts' rule, and routed architect rather than impl for that reason, unlike U30/U31 which are pure presentation over already-authorised components. Mark Baber confirmed 2026-08-22 that a single breast_both event, not two separate breast_left/breast_right events from one Save, is the wanted representation - directly mirroring the existing BreastSide.BOTH (enums.py) already used for pumping in M1, so this is not a novel vocabulary shape for this codebase. Before starting, grep FeedMethod's full usage (enums.py, events.py, __init__.py, milk_service.py, projection_service.py, logging_service.py, events_repo.py, routers/api.py, routers/pages.py, quick_entry.html) and check each exhaustively - milk_service.py's usage looks unrelated (pumping keys off BreastSide, not FeedMethod) but confirm rather than assume before leaving it untouched. Scope is FeedMethod only; do not touch BreastSide, StoolColour or any other enum while in enums.py. Depends on U22 for the toggle-button markup/CSS this extends; if U22 is still status=\"review\" when this is picked up, treat its current tree state as the contract, the same caveat U28/U29/U31 already carry against their own dependencies. 2026-08-22: implemented. enums.py: FeedMethod gains BREAST_BOTH = \"breast_both\" only; BREAST_LEFT/BREAST_RIGHT and every other enum (BreastSide, StoolColour, etc.) untouched. Confirmed milk_service.py is genuinely unrelated (keys off BreastSide for pumping, its one FeedMethod reference at :238 is a literal BOTTLE_EXPRESSED unaffected by the new member) - left untouched, as were events.py, logging_service.py, events_repo.py, pages.py and app.css, because each already handles FeedMethod generically (events.py's default field value, logging_service.py's generic passthrough, events_repo.py's generic serialize/deserialize round-trip, pages.py's `_FEED_METHODS = {m.value for m in FeedMethod}`, and app.css's `:checked+.toggle-btn` selector which doesn't care about input type) - none of these needed a code change for BREAST_BOTH to round-trip and render correctly. projection_service.py likewise needed no change: `_is_bottle()` matches against `_BOTTLE_METHODS = (BOTTLE_EXPRESSED, BOTTLE_FORMULA)`, so BREAST_BOTH automatically falls into the same non-bottle branch as BREAST_LEFT/BREAST_RIGHT (no rate sample, gap-median fallback as last feed) - added regression tests to prove it rather than assume it. Actual touches: enums.py (new member), routers/api.py (`/api/feed` gains two optional Form fields `side_left`/`side_right`; when either is present the method is derived from which of the two are set - both -> BREAST_BOTH, one -> that side - falling back to the existing `method` field, unchanged, when neither is present, which is what keeps every pre-U32 caller posting `method=breast_left`/`breast_right` directly working verbatim), quick_entry.html (the breast panel's two `<input type=radio name=method>` become two independently-toggleable `<input type=checkbox>` named `side_left`/`side_right`, same `id`s as before; the panel's open-gate tuple gains `\"breast_both\"`), and the three touched test files. Known, deliberately unhandled edge case (flagged by house-reviewer, judged out of scope for this plumbing task): if a parent unchecks both L and R before Save, there is no client-side \"at least one checked\" enforcement (checkboxes can't express that without JS, and T1 says never gate entry), so `post_feed` falls through to the `method` field's own default (`breast_left`) - a silent default rather than a crash or an unmatched case, consistent with this codebase's existing let-it-default philosophy elsewhere, but worth a follow-up if real usage shows parents actually hit it. house-reviewer also flagged tests/routes/test_quick_entry.py's pre-existing `test_breast_panel_side_toggle_buttons_are_mutually_exclusive` as stale (name/docstring claimed exclusivity that no longer holds); renamed to `test_breast_panel_single_side_preselects_exactly_that_side` with an updated docstring, body/assertions unchanged since they were still correct. ./scripts/test (399 passed), scripts/lint.sh and scripts/check_layers.sh all green. Reviewed by house-reviewer (one critical - tasks.toml not yet updated, addressed by this same edit; one warning - the stale test name, fixed; one suggestion - the unchecked-both-boxes default, noted above) and criteria-auditor (all five exit criteria independently verified met, touches list not exceeded). Held at review, not done, per CLAUDE.md - only CI and a human reviewer make that call."

[[task]]
id = "U33"
phase = 1
title = "Fix: quick-entry Save appears to do nothing and the panel never closes"
status = "done"
routing = "impl"
depends = []
touches = ["src/cradle/routers/api.py", "tests/routes/test_quick_entry.py"]
description = "Reported by Mark Baber, 2026-08-22: tapping Dirty, picking a stool colour and a time, then Save looked like it silently did nothing - no visible confirmation, and the panel stayed open. Root cause: every quick-entry panel form (Feed, Wet, Dirty, Growth, Temperature, Milestone, Note) targets #toast with hx-target/hx-swap, but #toast sits in the normal page flow underneath #panel's overlay (app.css: position:fixed, inset:0, z-index:60, opaque backdrop) while a panel is open. The POST always succeeded and the toast always swapped in - it was just rendered behind the still-open modal, invisible, and nothing ever told #panel to close. Not specific to the Dirty/colour panel; every panel with this same #toast target shares the bug, Dirty was just the one tapped."
exit_criteria = ["a quick-entry Save response carries an out-of-band swap that closes #panel (route test)", "this holds for every panel that shares _respond - feed, nappy (wet and dirty), growth, temperature, milestone, note, sleep toggle, expression (test)", "the existing toast/undo/adjust-time markup and behaviour are unchanged (regression, existing tests still pass)", "scripts/check_layers.sh green"]
notes = "2026-08-22: implemented entirely inside routers/api.py, no template change needed. _respond() (shared by every quick-entry POST handler) now appends a constant out-of-band fragment, `_PANEL_CLOSE_OOB = '<div id=\"panel\" class=\"overlay\" hx-swap-oob=\"true\"></div>'`, after the existing toast markup - htmx pulls out any hx-swap-oob element by id match and swaps it in place regardless of the request's primary hx-target, so #panel collapses back to its closed (no \"open\" class, empty) state in the same response that fills in #toast, while #toast keeps swapping via the form's own unchanged hx-target=\"#toast\"/hx-swap=\"innerHTML\". Applies uniformly to every _respond() caller (feed, nappy, sleep toggle, expression, growth, temperature, milestone, note); sleep toggle and expression aren't inside the overlay panel in the first place, so closing an already-closed #panel for those is a harmless no-op, not a special case to carry. /api/undo, /api/adjust-time and /api/edit-field are untouched (they run after the panel is already closed, and don't share _respond). Two tests added: test_dirty_panel_save_closes_the_panel_and_the_toast_is_visible (the exact reported repro - dirty nappy with a colour and a time) and test_every_quick_action_closes_the_panel_via_oob_swap (parametrized over QUICK_ACTIONS, so the fix isn't accidentally Dirty-specific). scripts/check_layers.sh green. scripts/test.sh: 278 passed via the offline runner, but tests/routes/test_quick_entry.py - including both new tests - is skipped in this sandbox (fastapi unavailable), matching every other route-test task in this file; CI must confirm both new tests green before this moves to done. scripts/lint.sh could not run either (ruff unavailable in this sandbox); CI must confirm. Held at review, not done, per CLAUDE.md - CI and a human reviewer are the sole arbiters."

