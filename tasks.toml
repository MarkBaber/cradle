description = "U18 ships the panels with a native <input type=time>, which on a phone means a keyboard or a platform dialog for the single field that gets adjusted most often - the event happened twenty minutes ago and someone is logging it one-handed. Replace it with a thumb-driven wheel: a vertical scroll-snap list of times, seeded at now, snapping to a fixed step. CSS scroll-snap plus a small amount of plain JS to read the snapped value into the form; no new dependency."
exit_criteria = ["the wheel writes a value the existing form post accepts unchanged (route test)", "the panel still submits a correct timestamp with JS disabled or the script unloaded (route test)", "keyboard and screen-reader access to the same value retained", "no new entry in the vendor directory and no change to pyproject dependencies"]
notes = "The no-JS fallback criterion is the load-bearing one: this is a wheel over a real form control, not a replacement for it, so a script that fails to load must degrade to something a parent can still submit. Presentation only - it changes no stored value and no route signature, which is why it is separable from U18 and must not delay it. Keep it in its own static file rather than inline, so the CSP and the service-worker cache list stay simple. SUPERSEDED 2026-08-19 by U22: Mark Baber asked for the picker to be built as an iPhone-style scroll wheel and explicitly authorised a vendored external JS library for it, which overrides this task's no-new-dependency constraint. U19 was never implemented, so building the vanilla scroll-snap version here and immediately replacing it in U22 would be a wasted diff over the same files. Parked rather than dropped so the two constraints that still matter survive: the panel must still submit a correct timestamp with JS disabled or unloaded, and the value it writes must be one the existing form post already accepts unchanged - both carried over verbatim into U22's exit criteria. U20's depends was repointed from U19 to U22 in the same edit, since nothing else can consume this task's output before it exists. Do not implement U19 separately. 2026-08-21: a run was dispatched against this task's original impl instructions (vanilla scroll-snap, no vendored JS); per the note above it built nothing - implementing would have been a wasted diff immediately superseded by U22, which already ships the picker (status review) and already carries U19's two surviving constraints verbatim in its own exit criteria. Status moved from todo (incorrectly schedulable, despite the notes forbidding the work) straight to review at Mark Baber's explicit direction rather than to blocked/held, since nothing here needs further human decision-making beyond confirming U19 is subsumed - a human reviewer can flip it to done alongside or after U22."

