description = "Three defects in EventsRepo. (1) list_growth applies the measure filter in Python after the SQL LIMIT, so list_growth(WEIGHT, limit=200) silently returns fewer than 200 weights once other measures are interleaved - and alerts_service relies on this call for the weight rules. Push the filter into the WHERE clause. (2) restore() documents `Target must be empty` but never checks, so re-importing into a populated database fails partway through on primary-key collisions with rows already written. Enforce the precondition or make the whole restore a single transaction. (3) temperature, milestone and note have no index on ts, while feed, nappy, sleep and growth do; add one in a new migration."
