description = "Raised by Mark Baber, 2026-08-21: the Log page should offer four more things worth tracking in early weeks, none of them feeds/nappies/sleep/growth/temperature/milestones/notes - developmental activities measured in minutes rather than volume or count. Add an `activity` domain: ActivityEvent (ts, category, duration_min, note, plus the shared logged_by/created_at/edited_at/deleted_at columns) and a closed ActivityCategory StrEnum with four members - tummy_time, reading_talking, sensory_play, foreign_language - stored by .value like every other enum. Register the table in EDITABLE with a column allow-list, same shape as M1's expression/milk_batch. Alongside the schema, add a new `[activity_targets]` table to rules_config.toml carrying the best-practice guidance text the Log page (U27) will display next to each category - this is informational copy for a parent, not an alert condition (no severity, no Finding, no messages.py entry), but it is exactly the kind of best-practice claim CLAUDE.md reserves for architect sign-off, the same reasoning U17 gave for stool-consistency vocabulary. Proposed starting values, for the architect to accept, edit or replace before this lands: tummy_time = \"Start at 1-2 min, build to 10-15 min, several short sessions across the day\"; reading_talking = \"15-20 min cumulative per day\"; sensory_play = \"1-2 brief sessions of 2-5 min\"; foreign_language = \"10-15 min cumulative per day of dedicated exposure (talking, singing, reading), folded into the same little-and-often pattern as reading_talking\" - this last figure is this task's own suggestion, not a cited NHS/NICE value like the rest of SPEC 2's domain table: NICE has no published newborn foreign-language-exposure guideline, so the reasoning offered is general early-language-acquisition practice (consistent short daily exposure matters more than session length at this age), and it needs explicit verification rather than silent acceptance. Document the new domain in SPEC 2's domain table and add a short schema paragraph to SPEC 5.3, matching how M1 documented milk_batch."
