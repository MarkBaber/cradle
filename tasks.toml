exit_criteria = ["Reading & Talking, Sensory Play, and Foreign Language activity panels each render duration_min as an AnyPicker select-mode scroll-wheel, not a plain number input, matching the existing Tummy Time treatment (route test per category)", "picking a value on each of the three wheels and saving posts through the existing duration_min parsing unchanged, persisting the picked value (route test per category)", "each converted field still submits a correct value with the picker script disabled or unloaded, via the underlying native number input, carrying U19/U22/U29/U31's no-JS contract forward (route test)", "quick-entry static payload is re-measured against the Q1 weight-budget test with any changed entry.js/quick_entry.html bytes, and either stays inside budget or the test is amended in the same diff with the new total recorded (test)"]
