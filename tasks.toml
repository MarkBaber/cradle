them in - the same shape U17 left for StoolConsistency and U21 cleared; and ADR 0014 was written outside touches, matching U17/ADR 0012. Also found, unrelated and untouched: scripts/validate_tasks.py already fails on main with 'G1 is done but depends on unfinished R4' (committed at 6423bba), which also trips the pre-bash hook - an architect call, not fixed here."

