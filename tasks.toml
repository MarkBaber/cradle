[[task]]
id = "U38"
phase = 1
title = "History page: group same-time entries, gate edit options to valid choices, and pre-fill AnyPicker wheels with the actual stored value"
status = "done"
routing = "impl"
depends = ["U26", "U31", "U34"]
touches = ["src/cradle/services/history_service.py", "src/cradle/routers/templates/_history_table.html", "src/cradle/routers/static/entry.js", "src/cradle/routers/static/app.css", "tests/unit/test_history.py", "tests/routes/test_quick_entry.py", "tests/unit/test_weight_budget.py"]
description = "Raised by Mark Baber, 2026-08-23, three related fixes to /history bundled together because all three touch the same _history_table.html/history_service.py markup and would otherwise mean three separate passes over the same file. (1) Every inline edit control on /history that sets a quantity - the feed row's 'Set ml' and 'Set min' (<input type=number>, no value= attribute at all today) - opens blank rather than seeded from what is already stored for that row, unlike the adjust-time 'Set' field beside it (<input type=datetime-local value=\"{{ (r.ts | local).strftime(...) }}\">, already correctly pre-filled) and unlike every AnyPicker wheel U31/U34 already shipped on the Log page, whose bindNumericWheel already prefers nativeInput.value over its hardcoded defaultValue when the value is on the wheel's grid (entry.js, bindNumericWheel's `current` line) - so seeding the native input's value= from the row's actual stored figure and binding the same bindNumericWheel/rangeValues machinery those tasks already built (not a new picker convention) makes 'Set ml'/'Set min' scroll wheels that open already parked on e.g. 60ml if 60ml was logged, exactly as requested. HistoryRow (history_service.py) currently exposes only a pre-formatted `detail` string and no raw per-table fields, so it cannot carry `volume_ml`/`duration_min` (or the fields needed for (2) below) through to the template today - add whatever raw fields the template needs. (2) The feed and nappy inline-edit branches each unconditionally render every option for every row regardless of what that row actually is, so several are invalid for some rows: a nappy row of kind=wet gets a 'Set colour' and 'Set consistency' form even though wet nappies carry no stool colour or consistency (StoolColour/StoolConsistency are dirty/mixed-only concepts - NappyEvent.kind is wet/dirty/mixed, models/enums.py), and symmetrically a feed row gets both 'Set ml' and 'Set min' even though FeedEvent.duration_min is a breast-feed concept and FeedEvent.volume_ml is a bottle-feed concept (models/events.py's own field comments: '# breast feeds' / '# bottle feeds') - a bottle feed exposes a meaningless 'Set min' and a breast feed a meaningless 'Set ml'. Gate each form on the row's actual kind/method: nappy colour+consistency only when kind is dirty or mixed (not wet); feed 'Set min' only for the three breast methods (breast_left/breast_right/breast_both) and 'Set ml' only for the two bottle methods, mirroring the same method/kind already carried on the row. (3) Entries logged at the same date/time today each get their own full-width date/time cell, so a feed, a wet nappy and a dirty nappy all logged at 6:20 render as three visually unrelated rows repeating '23 Aug 06:20' three times with no indication they belong together. Group consecutive rows sharing the same local date+minute (the same `(r.ts | local).strftime('%d %b %H:%M')` granularity already displayed, not exact-second equality, since two Saves through the same Time picker at 06:20 will differ in stored seconds/microseconds) under one shared date/time heading, listing that heading once followed by each entry's own detail/edit-controls/delete row beneath it - rows are already sorted newest-first (history_service.py's existing sort), so same-timestamp rows are already adjacent and this is a presentation grouping (Jinja groupby or an equivalent grouping pass), not a re-sort or a change to what history_service returns as individually deletable/editable rows."
exit_criteria = ["a feed row's 'Set ml' input is an AnyPicker select-mode scroll-wheel seeded to the feed's actual volume_ml (e.g. a 60ml bottle opens the wheel parked on 60ml), reusing entry.js's existing bindNumericWheel/rangeValues machinery, and Save posts the picked value through the existing /api/edit-field volume_ml parsing unchanged (route test)", "a feed row's 'Set min' input is the same AnyPicker wheel treatment seeded to the feed's actual duration_min, same contract (route test)", "a nappy row's 'Set colour' and 'Set consistency' forms render only when that row's kind is dirty or mixed, and are absent for a wet-kind row (route test)", "a feed row's 'Set ml' form renders only for bottle-method rows (absent for breast-method rows) and 'Set min' renders only for breast-method rows (absent for bottle-method rows) (route test)", "two or more entries logged at the same local date+minute across different tables (e.g. a feed and two nappies all at 06:20 on the same day) render grouped under one shared date/time heading rather than each repeating their own date/time cell, while each entry keeps its own working edit/delete controls scoped to its own table+event_id (route test)", "entries at different times remain in their own separate groups, newest first, unchanged from today's ordering (regression test)", "every gated/seeded form still submits a correct value with the picker script disabled or unloaded, via the underlying native input, carrying U19/U22/U29/U31's no-JS contract forward to /history (route test)", "quick-entry and history static payloads are re-measured against the Q1 weight-budget test with any changed entry.js/app.css bytes, and either stay inside budget or the test is amended in the same diff with the new total recorded (test)"]
notes = "Depends on U26 (done) for the nappy colour/consistency inline-edit forms this narrows, and on U31/U34 (both status=\"review\" as of 2026-08-23) for the bindNumericWheel/rangeValues/decimalRangeValues machinery this reuses for the history page's own ml/min wheels rather than inventing a second numeric-wheel convention - if U31/U34 are still not done when this is picked up, treat their current tree state (the *_WHEEL constants and bindNumericWheel in entry.js) as the contract, same caveat later tasks in this queue already carry against in-review dependencies. Step size/bounds for the history-page ml/min wheels are left to the implementer's judgement, same latitude U31/U34 were given, and ideally reused from BOTTLE_VOLUME_WHEEL/BREAST_DURATION_WHEEL directly (already the correct increments for these exact fields) rather than re-deriving new ones. The grouping in (3) is presentation only: it must not change history_service.rows()'s existing flat, individually-addressable return shape in a way that breaks the per-row table/event_id the edit/adjust-time/delete forms key off, and must not merge distinct events into one deletable/editable unit. Filed by Mark Baber, 2026-08-23, alongside U39 (Log page Dirty-panel consistency gap) - related (both concern nappy consistency data) but independent: U39 is about capturing consistency at entry time on quick_entry.html, this task is about which already-stored fields the history page is allowed to expose/edit and how they're grouped/seeded, and neither blocks the other."

