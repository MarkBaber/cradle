nd no such file here and no-op; left as-is since removing it is more surgery than this task's exit criteria require, flagged here so it isn't mistaken for cradle-native. Explicitly NOT attempted: the source comments cross-reference a task series DX-01 through at least DX-22 (cockpit.py, friction.py, retro.py, worktree_guard.py) that has no corresponding entries anywhere in this file -- most likely NightShift's own DX backlog, not cradle's, but either way not reconstructable from code comments alone without fabricating history. Filed here as one task (O4) instead, by explicit instruction. Also worth knowing: a since-deleted branch task/CP-01-cockpit-the-poll-tick-must-not-block-the (and a one-line stash on it) shared this file's subject -- test_cockpit.py's own docstring header reads 'CP-01: poll tick must not block the input loop' -- but a prior audit confirmed that branch carried no code beyond what's already in the cockpit.py committed here, only a superseded tasks.toml note; nothing was lost by deleting it. status=review rather than done because CI has never run against this content and 'CI is the sole arbiter' per this file's own header, even though every local gate is green."

# ---------------- Next-event projections (V3, U23, U24) ----------------

[[task]]
id = "V3"
phase = 1
title = "Projection service: when the next feed and the next mess are due"
status = "done"
routing = "impl"
depends = ["P1"]
touches = ["src/cradle/services/projection_service.py", "src/cradle/services/__init__.py", "src/cradle/routers/deps.py", "src/cradle/app.py", "rules_config.toml", "tests/unit/test_projection_service.py"]
description = "Raised by Mark Baber, 2026-08-21. The log records what happened; nothing in it says what is about to. A parent standing over the cot at 15:30 wants two numbers - how long until the baby is hungry, and roughly how hungry they already are - and today has to work both out in their head from the /today strip's since-last-feed counter. Add a ProjectionService deriving both from the household's own history, with a manual override, returning a plain result the UI (U23) renders. Feed uses a volume-scaled rate rather than a flat gap, because a 30ml top-up and a 90ml feed do not buy the same amount of time: take the median of volume_ml / hours-to-the-next-feed over the last N consecutive bottle-to-bottle pairs to get ml per hour, then project due_at = last_feed.ts + last_feed.volume_ml / rate. Breast feeds reset the clock but do not feed the rate: they carry duration_min and no volume, so a pair with a breast feed between the two bottles is skipped as a rate sample, and if the LAST feed is a breast feed (or a bottle with volume_ml unset) the projection falls back to the median feed-to-feed gap over the last N feeds of any method. Mess is one combined stream - every NappyEvent regardless of kind - projected from the median gap over the last N nappies, with a second, weaker projection over DIRTY and MIXED only, returned alongside as a hint. Also return the two gauge inputs U23 draws: hunger as the accrued volume deficit (rate x hours since the last feed, against the typical feed volume, which is the median volume_ml of the last N bottles), and mess level as elapsed over the projected gap. Add a [projections] table to rules_config.toml holding the out-of-box defaults and the manual overrides - ml_per_hour, typical_feed_ml, mess_interval_min, window_max_h (default 2). An override that is set replaces the computed value; blank or zero means compute it."
exit_criteria = ["projections() returns a due time for feed and for mess from a synthetic timeline under FixedClock (unit test)", "a 30ml last bottle projects a sooner feed due time than a 90ml last bottle at the same rate and start (unit test)", "a breast feed resets time-since-last-feed but contributes no rate sample, and a breast feed as the LAST feed falls back to the median feed-to-feed gap (unit test)", "the combined mess due time uses every nappy kind and the dirty hint uses DIRTY and MIXED only (unit test)", "an override in [projections] replaces the computed rate and mess interval; blank or zero returns to the computed value (unit test)", "fewer than MIN_SAMPLES usable events returns a cold-start result carrying no due time, never a fabricated one (unit test)", "hunger deficit and mess level are returned as fractions the template renders directly, clamped at 1.0, with overdue reported as its own field (unit test)", "scripts/test.sh, scripts/lint.sh and scripts/check_layers.sh green"]
notes = "Sits in services/ next to today_service and reads its config the same way (constructor config_path), per the A3 amendment: the service owns the file read, the pure layers do not. No new layer, no new dependency, no import check_layers.sh does not already allow. NOT a clinical feature and must not become one: this is arithmetic over the household's own log, so no rule goes in alerts/rules.py, no copy goes in alerts/messages.py, and nothing here fires or suppresses an ntfy push - the existing feed-reminder alerts keep firing on their own thresholds and must not be rewired to consult this. Keep the wording descriptive (estimated from your own log), never advisory. N, the sample size, is a module constant and deliberately not user-configurable: Mark Baber chose the narrower /settings surface - rate and interval only - and a sample-size box invites fiddling without improving the estimate. window_max_h lives in [projections] for completeness, but the dial auto-scales past it at runtime (U23) so it rarely needs touching; if it turns out to, exposing it in the settings panel is a one-line follow-on to U24. Timestamps stay UTC like every other event; local formatting is the template's job via to_local and the U9 display timezone. The Services/app.py wiring is inside this task's touches on purpose - it is four lines, and splitting it would leave U23 with nothing to render."

[[task]]
id = "U23"
phase = 1
title = "Next-event dials: nested rings on /today, hunger and mess bars, compact echo on /log"
status = "done"
routing = "impl"
depends = ["V3", "U22"]
touches = ["src/cradle/routers/pages.py", "src/cradle/routers/templates/today.html", "src/cradle/routers/templates/_projections.html", "src/cradle/routers/templates/quick_entry.html", "src/cradle/routers/static/app.css", "tests/routes/test_projections.py", "tests/unit/test_weight_budget.py"]
description = "Render V3's projections in two deliberately different shapes: a nested ring pair answering WHEN, and labelled vertical bars answering HOW MUCH. The rings sit above the existing 24h strip on /today as concentric SVG arcs on one shared 0-to-window scale so the two are directly comparable - feed on the outer ring, mess nested inside - and they DEPLETE: each arc starts full and shrinks toward its due time, because what is being shown is time left. The centre carries the soonest countdown and the clock time it lands on (next feed in 0h30, 16:00), with each ring labelled with its own. The scale auto-scales - window = max(window_max_h, the longest live projection rounded up) - so a 3h mess interval never clips off a 2h dial, and both arcs always share whatever scale is in force. Underneath, two vertical bars with an icon each: hunger from V3's volume deficit, mess from its elapsed fraction, filling as the level rises so bar and ring read as visual inverses of the same clock. Under the mess bar, the dirty hint as a secondary line (dirty due ~HH:MM). Overdue: the arc empties, the bar pins full, both take an .overdue class for the restyle and the readout flips to feed due 20m ago - and it stops there, nothing escalates and nothing is pushed. Cold start, meaning fewer samples than V3's minimum: greyed dials reading log a few feeds and this will fill in - the card renders rather than hiding, so the feature is discoverable on day one. On /log, one compact line only - next feed in 0h30 - beside the entry tiles, where a parent is already standing when they wonder whether it is time."
exit_criteria = ["/today renders both rings on one shared scale, feed outer and mess inner, each arc depleting toward its due time (route test)", "the dial window auto-scales past window_max_h when a projection exceeds it, and both arcs move to the new scale together (route test)", "the hunger bar reads V3's volume deficit and not the elapsed fraction - a small last feed shows a fuller bar than a large one at the same elapsed time (route test)", "an overdue projection renders an emptied arc, a pinned-full bar, the overdue class and a due-N-ago readout (route test)", "cold start renders greyed dials and the not-enough-history prompt rather than hiding the card (route test)", "the combined mess countdown carries the dirty hint as a secondary readout (route test)", "/log carries the one-line next-feed echo and still submits with JS disabled (route test)", "quick-entry static payload re-measured against the Q1 weight budget with the new CSS included, and either inside it or the budget test amended in the same diff with the new total recorded (test)"]
notes = "Presentation only - it stores nothing and adds no write path. The rings are inline SVG with stroke-dasharray: no charting library and no new vendored asset, and in particular plotly stays page-gated to /charts and /patterns and must not be pulled onto /today, which is the page the Q1 weight budget is strictest about. Put the dials in their own _projections.html partial rather than inline in today.html so the /log echo and any future htmx refresh reuse one template - the same reason _today_strip.html exists as a fragment. The U22 dependency is for file safety, not behaviour: U22 is open over quick_entry.html, app.css and test_weight_budget.py, three of this task's seven touches, and two branches editing the weight budget at once is exactly the collision the touches rule exists to stop. Copy stays descriptive, never advisory - estimated from your own log, not you should feed now. Accessibility: the rings are decorative over a text readout, so the numbers must exist in the DOM as text with aria-hidden on the SVG, or the whole card is invisible to a screen reader. 2026-08-21: implemented. All arithmetic (window auto-scale, per-ring depletion fractions, hunger/mess pct, overdue/cold flags, countdown/ago text) computed as a view-model in pages.py's _dial_context()/_feed_echo() over V3's ProjectionResult - _projections.html itself just renders the numbers, matching the house convention that _today_strip.html models. Cold start is inferred per-ring from feed_due_at/mess_due_at being None (no explicit boolean on ProjectionResult); the whole-card 'log a few feeds and this will fill in' prompt fires only when BOTH are None, with each ring still greying independently and reading its own cold copy ('log a few nappies...' for mess) if only one side lacks history. Window auto-scale uses hours-remaining-until-due (due_at - as_of), not the raw interval length, since that's the only pair of fields ProjectionResult actually exposes; the two rings always share one window_h computed as max(window_max_h, ceil(hours-until) for whichever due dates are live. Center readout picks the soonest due_at across both rings (naturally handles 'already overdue' since a past due_at sorts earliest); the /log echo is deliberately feed-only and clock-time-free (next feed in 0h30, no HH:MM) per the task's own example, distinct from /today's center label which also names the clock time. Weight budget: recomputed at ~86.4KB (committed QUICK_ENTRY_ASSETS 15,775B + htmx/wheelpicker allowances 70,656B) against the unchanged 150KiB budget - inside it, so test_weight_budget.py was left untouched, matching the U22 precedent of not amending when the number lands inside budget. tests/routes/test_projections.py (new, 10 tests) covers all eight exit criteria; verified failing cleanly against a reverted tree before the implementation landed, then passing against it. ./scripts/test.sh (372 passed), scripts/lint.sh and scripts/check_layers.sh green, python3 scripts/backlog.py OK (71 tasks, acyclic). Reviewed by house-reviewer (no blocking findings; one stray .cockpit/friction.jsonl hook-telemetry change outside touches was reverted before commit) and criteria-auditor (all eight exit criteria independently verified met, touches scope clean). Held at review, not done, per CLAUDE.md - only CI and a human reviewer make that call."

[[task]]
id = "U24"
phase = 1
title = "Manual override for the projections, on /settings"
status = "done"
routing = "impl"
depends = ["V3", "U22"]
touches = ["src/cradle/routers/api.py", "src/cradle/routers/templates/settings.html", "src/cradle/routers/static/app.css", "rules_config.toml", "tests/routes/test_settings.py"]
description = "V3 reads its overrides from the [projections] table in rules_config.toml; this makes them editable without an SSH session and a text editor - the same objection that sent U9's file-edit approach back and produced N3's proper settings write. Add a small panel on /settings with three fields: the feed rate in ml per hour, the typical feed volume in ml, and the mess interval in minutes, each showing the currently computed value as its placeholder so a parent can see what the log says before deciding to overrule it. Empty means compute it, a number means use this. Follow N3 and U22 exactly for the write - a GET/POST /api/settings/projections pair in api.py with a regex scoped strictly to the [projections] section, so a settings post can never reach a clinical threshold elsewhere in the file."
exit_criteria = ["GET /api/settings/projections returns the current overrides and POST round-trips a new value (route test)", "a write leaves every other table in rules_config.toml byte-identical, asserted against a clinical threshold specifically (test)", "clearing a field returns that metric to the computed value on the next projection (route test)", "each field renders the computed value as its placeholder when no override is set (route test)"]
notes = "The byte-identical criterion is the load-bearing one and the reason this is its own task rather than a corner of V3: CLAUDE.md makes rules_config.toml's clinical values architect-only, and the only thing between a settings form and a weight-loss threshold is the scope of that regex. Copy the shape of _write_ntfy_topic in app.py and _write_entry_defaults in api.py rather than inventing a third TOML-writing idiom - if U22 has landed, reuse its helper outright. These are UX convenience numbers, not clinical thresholds, so the architect-only carve-out does not reach the [projections] table itself. Depends on U22 for the same file-collision reason as U23: settings.html, api.py and app.css are all open on that branch. Validation is a clamp, not a health claim - reject non-numeric and non-positive input with the existing form error style, and never warn a parent that a number they typed is too low or too high for a baby. 2026-08-21: implemented. V3 and U22 had both already landed on main (their tasks.toml status was stale at 'review'; verified by git log, not re-litigated). GET/POST /api/settings/projections live in api.py, following N3/U22 exactly: projections_overrides()/_write_projections_overrides() mirror entry_defaults()/_write_entry_defaults() one-for-one, a regex scoped strictly to [projections] via _PROJECTIONS_SECTION_RE, verified by test_post_projections_leaves_other_tables_byte_identical which strips that one section from the before/after text and asserts byte-equality on what remains, then asserts [weight].loss_red_fraction == 0.10 specifically. pages.py is outside this task's touches (as it is U22's and N3's) so, like the existing ntfy-topic field in the same template, the new panel has no Jinja-rendered value/placeholder - it fetches GET /api/settings/projections client-side and JS sets .value from the override and .placeholder from the computed field. Route tests therefore verify the computed value via the JSON response (test_get_projections_computed_reflects_the_log, seeded with V3's own synthetic-timeline test fixture: 5x90ml bottles 3h apart, 4 wet nappies 6h apart -> 30ml/h, 90ml typical, 360min mess interval) rather than by parsing server-rendered HTML, since there is none. Flagged compromise, not blocking (house-reviewer, 2026-08-21): _computed_projections() in api.py needs 'what V3 would compute with no override in force' but ProjectionResult only exposes due-times/fractions, not the raw rate/typical-volume/interval numbers, and projection_service.py is outside this task's touches. Rather than reimplementing V3's medians a second time (drift risk) it reuses V3's own pure sample functions (_bottle_rate_samples, _median_bottle_volume, _gap_median_hours) via a module import, reading through svc.projections._repo - ProjectionService's private repo handle - since routers may not import cradle.repos directly (SPEC 3) and ProjectionService has no public accessor for it. scripts/check_layers.sh passes (it walks imports, not attribute access) and this is read-only, but it is coupling to an implementation detail with no interface contract. Clean fix is a small follow-on task giving ProjectionService a public method returning the would-be-computed values (a few lines, same shape as the window_max_h follow-on V3's own notes already flagged for U24) - worth an architect call on whether to fold it into U23 or spin out separately. Held at review, not done, per CLAUDE.md - only CI and a human reviewer make that call. ./scripts/test (371 passed), scripts/lint.sh and scripts/check_layers.sh all green; python3 scripts/backlog.py (71 tasks, graph acyclic, schema complete, exit 0). Reviewed by house-reviewer (no blocking findings; two warnings, both addressed in this note) and criteria-auditor (all four exit criteria independently verified met)."

