exit_criteria = ["each of the five tiles opens a panel with its own choice pre-selected (route test)", "breast feed logged with side and duration_min, bottle with volume_ml, end to end (route test)", "volume_ml entered here appears in /today bottle intake and in the bottle_ml series (test)", "dirty nappy logged with colour and consistency end to end (route test)", "STOOL_COLOUR fires from a colour entered through the UI, not from a synthetic fixture (test)", "accepting every default is 2 taps and writes a row at now (route test)", "no field is required: Save with defaults never 4xx (route test)"]
notes = "Absorbs U11, which is parked for that reason; its two colour criteria are carried over above. Build the panel as an htmx fragment swap, not client state: D1 chose server-rendered fragments, and D1 also names Alpine, but static/vendor holds only htmx and plotly - Alpine is not actually vendored, and vendoring it is an architect call under the closed dependency set (SPEC 6), so do not reach for it. Native <select> and <input type=time> only in this task; the scroll wheel is U19 and must not block this. Do not touch models, repos or enums: the fields all exist after U17, and a wider diff belongs in another task. Implemented: tiles are hx-get links into '/?panel=...&method=...|kind=...', swapping just #panel (hx-select) so the same URL is also the no-JS fallback (a plain page load with the panel already open server-side); Save stays a real form POST to /api/feed or /api/nappy, matching the existing dual hx-post+action convention. Bottle tile now links method=bottle_expressed, fixing the wrong default. BLOCKED on the 'and consistency' half of the dirty-nappy exit criterion: LoggingService.log_nappy (src/cradle/services/logging_service.py) has no consistency parameter and EventsRepo.EDITABLE['nappy'] doesn't include it, and both files are outside this task's touches - U17's own notes and U21's description already name this exact gap as U21's job ('the log_nappy pass-through U18 needs'), and U21 (status todo) is not in U18's depends. Colour is logged and STOOL_COLOUR fires end to end from it; consistency capture is not in the Dirty panel and cannot be added without either widening touches into services/repos or U21 landing first. All other exit criteria pass under scripts/test.sh (282 tests green) plus scripts/lint.sh and scripts/check_layers.sh. Recommend sequencing U21 before this moves to done, or splitting the consistency criterion out to U21 explicitly."

[[task]]
