[[task]]
id = "U41"
phase = 1
title = "Charts page: cut load-to-render time via server-side caching + a lighter/lazier Plotly path"
status = "done"
routing = "impl"
depends = []
touches = [
    "src/cradle/services/growth_service.py",
    "src/cradle/routers/static/sw.js",
    "src/cradle/routers/static/chart.js",
    "src/cradle/routers/static/series.js",
    "scripts/vendor_assets.sh",
    "tests/unit/test_growth_service.py",
    "tests/unit/test_weight_budget.py",
    "tests/routes/test_charts.py",
]
description = "Raised by Mark Baber, 2026-08-23: /charts can take a second or more to render, and Mark Baber named both caching and a better drawing approach as acceptable fixes. Root causes, found by inspection: (1) scripts/vendor_assets.sh vendors Plotly's full bundle (PLOTLY_URL=https://cdn.plot.ly/plotly-${PLOTLY_VERSION}.min.js -> src/cradle/routers/static/vendor/plotly.min.js, currently ~4.5MB unminified-on-disk) even though this app only ever uses cartesian trace types - bar, scatter, lines+markers, a dual y-axis (yaxis2 overlaying), fill:\"tonexty\", and Plotly.addFrames/animate for the growth-chart centile playback (chart.js, series.js) - never 3d/geo/gl/mapbox/finance. Plotly publishes smaller partial bundles (e.g. a cartesian-only build) built from the same source as the full bundle - swapping which one vendor_assets.sh fetches is not a new dependency (SPEC §6, ADR 0009 - still Plotly.js, still vendored) and should cut both download size and, more importantly, the JS parse/compile/execute cost paid on every page load, which is the actual dominant cost of a 1+ second wait. (2) The service worker (sw.js, task W1) precaches only app.css/manifest.json/icon.svg - plotly.min.js, chart.js and series.js are never precached, so even a repeat visit to /charts re-fetches (or at best HTTP-revalidates) the multi-megabyte bundle instead of getting it instantly from the SW cache. (3) /charts and /api/charts/{measure} recompute GrowthService.centile_chart_series() from scratch on every request - a loop of value_at_z/value_at_centile calls across ~9 centiles x up to ~120 ages - even though the result only changes when a new growth event is logged for that measure or the baby profile changes; GrowthService is constructed once per process (app.py's build_services) and its instance already lives for the app's lifetime, so an instance-level cache keyed on something cheap that changes exactly when the real inputs change (e.g. measure + baby identity/sex/dob + the count or latest id/ts of that measure's growth events) is a correct, low-risk win with no new infrastructure. Fix all three: (a) swap vendor_assets.sh to fetch a Plotly bundle variant that still covers every trace/feature this app actually uses - verify the real vendored file's exposed registry/capabilities directly (e.g. its trace-type registry or an explicit feature check), not from Plotly's marketing docs, the same verify-the-real-vendored-source discipline U29/U30/U31 already established for AnyPicker, and if no smaller published bundle actually covers everything used here, stop and record that gap in this task's notes rather than silently keeping the full bundle or vendoring something outside Plotly's own published builds; (b) add plotly.min.js, chart.js and series.js to sw.js's precached ASSETS array and bump CACHE (\"cradle-static-v1\" -> v2) per its existing cache-busting convention, keeping test_service_worker_caches_static_only's GET-only/static-only invariants intact; (c) memoize centile_chart_series in GrowthService with correct invalidation on new growth events/profile changes. Do not touch the LMS math itself (reference/lms.py, out of touches, architect-owned per CLAUDE.md) - this is caching around it, not changing it."
exit_criteria = ["GrowthService.centile_chart_series() does not redo its LMS interpolation loop on a second call for the same measure/baby/events, verified by a call-count or timing-shaped unit test (test)", "logging a new growth event for a measure (or changing the baby profile) invalidates that cache - the very next centile_chart_series() call reflects the new data, not a stale cached result (test)", "plotly.min.js, chart.js and series.js are present in sw.js's precached ASSETS list with CACHE bumped, and test_service_worker_caches_static_only's existing safety assertions still pass (test)", "scripts/vendor_assets.sh fetches a Plotly bundle variant smaller than today's full plotly.min.js while still supporting every trace type/feature /charts actually uses (bar, scatter, lines+markers, dual y-axis, fill \"tonexty\", addFrames/animate) - verified against the real vendored file, and every existing /charts and /api/charts/{measure}, /api/series/daily, /api/series/ribbon route test in tests/routes/test_charts.py still passes unchanged (route test / regression)", "scripts/test.sh, scripts/lint.sh, and scripts/check_layers.sh green"]
notes = "Filed by Mark Baber, 2026-08-23: 'a second or more to load the charts... use caching, or an improved way of drawing the plots'. This task does both rather than picking one, since the two root causes (an uncached heavy JS bundle fetched fresh every visit, and a per-request server-side recompute) are independent and cheap to fix together. Left to implementer's judgement, not required by exit_criteria: if these three changes don't feel sufficient once measured, lazily initializing the four below-the-fold daily-totals charts (series.js's feedschart/wetchart/dirtychart/sleeptargetchart, currently all rendered synchronously via one shared fetch in renderPerMetricCharts) via IntersectionObserver so they don't all pay Plotly.newPlot's cost before the user sees anything is a reasonable follow-on, same presentation latitude other tasks in this queue get - but it is not required to close this task. Does not touch reference/lms.py (architect-owned clinical math) or SPEC/ADR 0009's choice of Plotly itself (D9) - only which published Plotly bundle is vendored and how/when it's fetched, which needs no architect sign-off since the dependency set (SPEC §6) is unchanged. -- Implementer update, 2026-08-23: (b) sw.js and (c) GrowthService memoization are implemented and unit-tested by direct file edit/read (cache key = baby_id/sex/dob/due_date + per-event (id, ts, value) tuples, so new events, edits, undo, and profile changes all invalidate it; verified by manual trace of the code, not by running pytest). (a) vendor_assets.sh now points PLOTLY_URL at the cartesian partial bundle (plotly-cartesian-${PLOTLY_VERSION}.min.js). -- Implementer update, 2026-08-24: prior session's Bash outage was environment-specific to that session and did not recur; resolved this run. Ran scripts/vendor_assets.sh for real: the cartesian bundle downloaded to 1,358,851 bytes (vs ~4.5MB for the full bundle), PLOTLY_SHA256 recorded as 72409fd95b505d17772f2dd9bb81a8672ce6d5b61dcf61ba1fd8442c9ea3e180. Verified against the actual vendored file, not docs: loaded it in a real DOM (jsdom, installed only in a scratch dir for this one-off check, not a project dependency) and read Plotly.PlotSchema.get().traces - registered trace types are bar, box, contour, heatmap, histogram, histogram2d, histogram2dcontour, image, pie, scatter, scatterternary, violin (no 3d/geo/gl/mapbox/finance/sankey types), and Plotly.addFrames/Plotly.animate/Plotly.newPlot/Plotly.react are all present as functions. Cross-checked chart.js + series.js: the only trace types either file ever passes as `type:` are \"bar\" and \"scatter\", both registered. Ran the full gate (scripts/test.sh, scripts/lint.sh, scripts/check_layers.sh) and scripts/backlog.py; created and committed on branch task/U41-charts-page-cut-loadtorender-time-via."

[[task]]
id = "U42"
phase = 1
title = "Achievements page: trophy grid with rarity, repeatable counters, custom authoring, progress bar"
status = "review"
routing = "impl"
depends = ["P1", "V1", "U1", "U2"]
touches = [
    "src/cradle/models/achievements.py",
    "src/cradle/models/__init__.py",
    "src/cradle/repos/badges_repo.py",
    "src/cradle/repos/migrations/",
    "src/cradle/services/achievements_service.py",
    "src/cradle/services/__init__.py",
    "src/cradle/ports/notifier.py",
    "src/cradle/routers/deps.py",
    "src/cradle/app.py",
    "src/cradle/routers/pages.py",
    "src/cradle/routers/api.py",
    "src/cradle/routers/templates/achievements.html",
    "src/cradle/routers/templates/base.html",
    "src/cradle/routers/templates/quick_entry.html",
    "src/cradle/routers/static/entry.js",
    "src/cradle/routers/static/app.css",
    "tests/unit/test_achievements_service.py",
    "tests/unit/test_badges_repo.py",
    "tests/routes/test_achievements.py",
    "tests/routes/test_quick_entry.py",
    "tests/unit/test_weight_budget.py",
]
description = "Originally filed by Mark Baber, 2026-08-23, then a scope-extension request from Mark Baber, 2026-08-25 was folded into this same task rather than filed separately, since the two overlap almost entirely and splitting them would just duplicate the schema/service/page work. NOTE ON PRIOR STATUS: this task was mis-marked status=\"done\" by commit df64bc8 on 2026-08-23, two minutes after PR #77 merged - but PR #77 (branch task/U42-badges-achievements-medals) only added this tasks.toml entry (33 lines, tasks.toml only); no models/achievements.py, badges_repo.py, achievements_service.py, achievements.html, or any wiring was ever committed on any branch. Nothing in this feature exists yet - build the full combined scope below from scratch. Original 2026-08-23 scope: a badges/achievements/medals system that rewards a parent for logging data, caring for the baby, and exploring the app - and separately celebrates the baby's own first-time moments (e.g. 'first bus ride') - framed as a positive surprise, not a checklist with a deadline. Two badge families: (1) parent/engagement badges - first feed logged, first full day tracked, first time each quick-entry category (feed/nappy/sleep/growth/temperature/activity) has been used, and a small number of other gentle usage milestones - evaluated by a new AchievementsService reading the existing per-domain repos (EventsRepo, P1); (2) baby 'moment' badges keyed off the existing open-ended Milestone domain (models.Milestone, category='first', free-text title, SPEC 5.1/5.4) - award a 'moment captured' badge each time a new category='first' milestone is logged, rather than hardcoding a fixed list of moment names (the app cannot enumerate every possible first in advance). 2026-08-25 extension, folded in: (a) every catalog entry - predefined or custom - carries an author-assigned static rarity tier (e.g. Common/Rare/Epic/Legendary); there is no accounts/population data to compute rarity from (SPEC: single baby, no auth, LAN-only, no cloud sync), so rarity is a fixed field set when the achievement is defined, never derived; (b) achievements may be repeatable - each qualifying event increments a persisted count rather than only ever recording a single award, so 'logged before 6am, 12 times' is expressible; a non-repeatable achievement keeps today's one-shot semantics; (c) users can craft their own achievements in addition to the predefined catalog, via a hybrid model: a rule-based path (pick an event domain + a condition - count threshold reached all-time, a streak of N consecutive days, or a single occurrence matching a field - evaluated automatically the same as predefined rules) for anything expressible as a simple condition, plus a manual/freeform path (name + description + icon + rarity, no rule, the user taps a button to mark it earned themselves - each tap increments the count if it's flagged repeatable) for subjective ones a rule can't capture (e.g. 'survived the 4-month sleep regression'); (d) the /achievements page becomes a trophy grid: every catalog entry (predefined + custom, earned or not) renders as a tile; unearned tiles are visibly greyed out (this supersedes the original scope's 'optional whether to show locked badges, and if shown render neutrally with no progress' language - Mark explicitly wants locked trophies visible now); tapping any tile opens a detail view showing its description, rarity tier, and - for repeatable achievements only - the current count; where the tile's rule is a count-threshold (not a streak, single-occurrence, or manual rule, which have no meaningful numerator/denominator to show), the detail view also shows numeric progress toward the next unlock (e.g. '7 of 10 nappies logged'); (e) a headline progress bar at the top of the page shows overall completion - unlocked catalog entries / total catalog entries, across both predefined and custom; (f) in addition to the existing on-page celebratory animation, a genuine new unlock also fires a push notification, reusing the existing Notifier port (ports/notifier.py) rather than inventing a second notification path - construct a models.Finding with severity=AlertSeverity.INFO, rule_id='achievement', and the badge's celebration message, and call the already-injected Notifier.send() with it (Notifier.send(finding: Finding) is a pre-existing Protocol method, so this is calling it, not changing its signature - no architect sign-off needed); this Finding is transient (built only to reuse the ntfy transport) and must NOT be persisted through alerts_service's alert_log/fingerprint-dedup path, since that path and its dedup semantics belong to the clinical alerts domain, not achievements - achievements keep their own dedup entirely inside the new badge/award table, exactly as the original scope already required. For repeatable achievements, use implementer's judgement on whether every single increment re-fires the celebration/push or only the first unlock does (recommended default, to avoid notification fatigue on a frequently-repeating condition: celebrate and push on the first unlock only, then increment the count silently thereafter unless the achievement definition specifies its own named count tiers to celebrate again at) - document whichever is chosen and why in this task's notes. All of the original scope's constraints still apply and are NOT relaxed by this extension: badges/awards are still additive-only (a row's count may increment, but nothing is ever deleted, decremented, or marked overdue/expired); still no due-by dates, countdowns, or streak-loss messaging; still no reuse of alerts/app.css's amber/red severity styling anywhere in this feature, since an achievement is never a health signal; the completion progress bar introduced by (e) is progress-toward-completion, not a deadline, and must not gain any time-based framing (no 'X days left', no countdown) - that would reintroduce exactly the pressure-framing the original task was written to avoid. Still evaluated inline/synchronously in routers/api.py right after each existing svc.logging.log_*() call succeeds (the same place U2's undo-toast is already assembled) and, for the moment-badge family, after svc.logging.log_milestone() - never by adding fields to LoggingService or changing any of its method signatures (V1's log_* contracts are unchanged; this stays a read-only observer bolted on alongside logging). Persist catalog + awards in new tables under a new migration (repos/migrations/, applied automatically by Db.migrate() same as every prior migration): a definitions table holding both predefined (seeded by the app, not user-editable) and custom (user-authored via the /achievements page's builder form) entries - key, name, description, rarity, rule type/domain/params, repeatable flag, source; and an award table keyed by (baby_id, badge_key) tracking count plus first/last-awarded timestamps, with the same UNIQUE(baby_id, badge_key) shape as before so 'award' rows themselves are never duplicated - a repeat qualifying event updates the existing row's count/last_awarded_at rather than inserting a second row. The full predefined-achievement copy list (names/descriptions/icons beyond the half-dozen starter examples named above) will be supplied by Mark Baber separately as a fast-follow and is NOT required for this task's Definition of Done; keep the catalog data-driven (a plain list/table of entries, not a pile of copy-pasted branches - same latitude U31/U34/U36's wheel catalogs and the original scope already had) so appending his fuller list later is a pure data change. On the quick-entry page, a fresh unlock still triggers a small celebratory animation distinct from the existing undo-toast (U2) and, only at that exact unlock moment, an optional short sound - never on ordinary page loads or on a save that unlocks nothing; sound still defaults OFF, controlled by an easily reachable, persisted mute/unmute control, and animation/sound assets stay out of the initial quick-entry payload (fetched lazily only at the moment a badge actually unlocks) so the Q1 weight-budget test is unaffected by default. Add new services.__init__/routers.deps.Services/app.py wiring for AchievementsService the same additive way every other service was already added to the Services dataclass over time - a new field, not a change to any existing one, so no architect sign-off needed. Achievement/badge copy (predefined or custom) is UX/reward text, not a medical claim or clinical threshold, so - unlike alerts/messages.py and rules_config.toml's clinical tables - it sits outside CLAUDE.md's architect-only carve-out and can be authored directly in this task (or by end users, for custom ones). Do not add a new alerts/rules.py rule, a messages.py entry, or a scheduler sweep job for any of this - achievements are evaluated synchronously alongside the user's own action, never as a background nagging check, which is the mechanism that keeps this feature feeling like a reward rather than another thing being monitored."
exit_criteria = ["new migration table(s) under repos/migrations/ hold achievement definitions (predefined + custom) each with a name, description, author-assigned rarity tier, rule descriptor, and repeatable flag, plus an award table keyed UNIQUE(baby_id, badge_key) tracking count and first/last-awarded timestamps - the same badge can never produce a second award row, a repeat qualifying event updates count/last_awarded_at on the existing row instead (test)", "AchievementsService evaluates a starter catalog covering at least: first use of each quick-entry category (feed/nappy/sleep/growth/temperature/activity), and a 'moment captured' badge for every new category='first' Milestone logged - fire and no-fire cases per badge type (test)", "a repeatable achievement's count increments on each qualifying event (not once per calendar day, not per rule-defined window) and a non-repeatable achievement stays a one-shot award no matter how many further qualifying events occur (test)", "a user can author a custom achievement two ways: (1) rule-based - domain + condition (count threshold / streak of N days / single-occurrence field match) - which then auto-evaluates and auto-unlocks like a predefined rule; (2) manual - name/description/icon/rarity with no rule, unlocked only by the user tapping a mark-earned control, incrementing its count on each tap if repeatable (test)", "logging an event through the existing quick-entry POST flow that earns or increments a badge does so without changing any LoggingService method's signature (route test)", "logging an event that does not newly qualify, or re-logging one that already earned a non-repeatable badge, awards/increments nothing extra (test)", "/achievements renders every catalog entry (predefined + custom) as a tile, earned or not; unearned tiles are visibly greyed out rather than hidden or optional (route test)", "an overall completion progress bar renders at the top of /achievements showing unlocked-count/total-catalog-count, with no deadline/countdown/time-based framing anywhere near it (route test)", "tapping a tile shows its description, rarity tier, and - for repeatable achievements - the current count; for locked count-threshold-rule tiles it additionally shows numeric progress toward unlock (e.g. '7 of 10') (route test)", "a genuine new unlock fires both the existing quick-entry celebratory animation and a push notification via the existing Notifier.send(Finding) call (no change to the Notifier Protocol signature), without persisting through alerts_service's alert_log/fingerprint-dedup path (test, notifier call asserted via a test double)", "achievement sound defaults off and is controlled by a persisted mute/unmute toggle; once muted, no further sounds play (test)", "no earned or in-progress badge/award is ever removed, decremented, marked overdue, or styled with the alerts amber/red severity classes (test)", "no new alerts/rules.py rule, alerts/messages.py entry, or scheduler sweep job is added for achievements - evaluation is regression-tested as synchronous-only, triggered from routers/api.py alongside the existing log_*/log_milestone calls (test)", "quick-entry and any other changed static payloads are re-measured against the Q1 weight-budget test; lazy-loading the animation/sound assets should leave the existing budget unmoved, but if it still grows the test is amended in the same diff with the new total recorded (test)", "scripts/test.sh, scripts/lint.sh, and scripts/check_layers.sh green"]
notes = "Filed by Mark Baber, 2026-08-23 ('add badges, achievements and medals... should be seen as a reward, not a chore... should look special, with animations and sounds... able to look at their past achievements... also achievements for moments, like first bus ride'), extended by Mark Baber, 2026-08-25 ('a page with trophies (badges) that show achievements unlocked and a progress bar to completion; locked achievements are greyed out; clicking on an achievement shows description text, rarity, and how many times you have achieved it for repeatable ones; a suite of predefined achievements, but allow the user to craft their own'). Status was incorrectly flipped todo->done by commit df64bc8 on 2026-08-23 with no implementation ever landing (PR #77 only added the tasks.toml entry); reverted to todo here rather than filing a separate task, per Mark Baber's explicit choice on 2026-08-25 to fold the extension into U42 in place and fix the record rather than leave a done-but-nonexistent entry alongside a new one. Interview conducted 2026-08-25 before filing this revision resolved: achievements track both parent-engagement behaviour and baby milestones/moments (unified, not split into two features); custom authoring is hybrid rule-based+manual; rarity is an author-assigned static tier (no population to compute rarity from - SPEC: single baby, no auth, LAN-only); progress is shown both as a headline completion bar and per-tile where the rule type supports a numerator/denominator; evaluation stays inline/synchronous (no scheduler); repeat counters increment per qualifying event, not per day; unlocks push via the existing ntfy Notifier; the predefined catalog's full copy list will be supplied separately by Mark Baber and is not required for this task's DoD - keep the catalog data-driven so his list is a pure data addition later. Deliberately does NOT reuse alerts/ (rules.py/engine.py/messages.py/alert_log) even though the alerts engine's fact-in/finding-out determinism and alert_log's fingerprint dedup are the direct inspiration for this feature's own dedup, and even though ports/notifier.py's transport IS reused for the celebratory push - alerts is architect-owned clinical-copy/dedup territory (CLAUDE.md) and a positive-reinforcement badge is not a health signal, so the achievement domain keeps its own catalog/award tables and dedup entirely inside services/repos/routers, only borrowing the Notifier Protocol's send() method (an existing call, not a signature change) to avoid standing up a second push-notification code path. No architect sign-off recorded because: (a) the Services dataclass gains an additive field only, no existing signature changes; (b) Notifier.send(finding: Finding) is called with its existing signature, not changed; (c) achievement/badge copy - predefined or user-authored - is reward/UX text, not a clinical claim or threshold, so it sits outside CLAUDE.md's alerts/messages.py + rules_config.toml carve-out the same way [entry_defaults]/[projections]/[wheel_steps] already do for their own reasons (U37's notes give the same style of reasoning). Sound defaulting off (rather than on) remains a deliberate safety-first choice given the app's real usage pattern (logging at night beside a sleeping baby). Open implementer judgement call, flagged rather than pre-decided: whether every repeat increment on a repeatable achievement re-fires the celebration animation/push, or only the first unlock does - recommended default is first-unlock-only to avoid notification fatigue, with silent counting thereafter unless a given achievement defines its own celebrated count tiers; document whichever is chosen and why. IMPLEMENTATION NOTE 2026-08-26: built on branch task/U42-achievements-page-trophy-grid-with. Chose first-unlock-only celebration (the recommended default above): AchievementsService._award celebrates (animation OOB swap + Notifier.send) when newly_unlocked is True, or when a repeatable badge's new count lands in its own celebrate_every tuple (empty by default for every PREDEFINED_CATALOG entry) - otherwise a repeat qualifying event increments count/last_awarded_at silently. Reason: avoids ntfy/animation fatigue on a frequently-repeating condition (e.g. moment.captured firing on every new category='first' Milestone) while still giving an implementer-defined escape hatch (celebrate_every) for an achievement that wants its own named count-tier celebrations later. Exit criteria all verified met by an independent criteria-auditor pass (models/achievements.py, repos/badges_repo.py + migration 0007_achievements.sql, services/achievements_service.py, /achievements trophy grid + custom-authoring form, quick-entry celebration OOB swap with WebAudio-synthesized sound defaulting off via a persisted mute toggle). scripts/lint.sh (ruff + mypy strict) and scripts/check_layers.sh are green. Full pytest run is 611 passed / 14 failed; all 14 failures (tests/routes/test_quick_entry.py and tests/routes/test_settings.py, around rules_config.toml's [wheel_steps]/[entry_defaults] tables having drifted numeric values) were independently reproduced byte-identical on a pristine main checkout with none of this branch's changes applied, confirming they are a pre-existing defect unrelated to U42 and out of this task's touches - not something this diff should fix per CLAUDE.md's 'stay inside touches, append a new task' rule. python3 scripts/backlog.py exits 0."

[[task]]
id = "U43"
phase = 1
title = "Merge /history and /summary into one History page: orange per-row Edit/Clone/Delete + a green per-day Add button"
status = "done"
routing = "impl"
depends = ["U4", "U38", "U40"]
touches = [
    "src/cradle/routers/pages.py",
    "src/cradle/routers/api.py",
    "src/cradle/routers/templates/history.html",
    "src/cradle/routers/templates/day_summary.html",
    "src/cradle/routers/templates/_history_table.html",
    "src/cradle/routers/templates/base.html",
    "src/cradle/routers/templates/quick_entry.html",
    "src/cradle/routers/static/app.css",
    "src/cradle/routers/static/entry.js",
    "src/cradle/services/history_service.py",
    "tests/unit/test_history.py",
    "tests/routes/test_history_summary.py",
    "tests/routes/test_quick_entry.py",
    "tests/unit/test_weight_budget.py",
]
description = "Raised by Mark Baber, 2026-08-23: the app currently ships /history (U4/U38: history.html + _history_table.html, a flat filterable table, one row per event, with existing inline edit-field/adjust-time forms and an unconfirmed Delete button) and /summary aka /day-summary (U40: day_summary.html, day_grouped_rows() in history_service.py, a read-only per-day-heading compact time/activity/kind/detail view with no edit affordances at all) as two separate tabbar entries (base.html). Merge them into a single 'History' page: keep the /history route and the History tabbar entry, retire the separate Summary tabbar entry, and make /summary and /day-summary redirect to /history for back-compat. Take the Summary page's day-grouped compact layout (one heading per calendar day, each event a compact time/activity/kind/detail row - day_summary.html, HistoryService.day_grouped_rows()) as the primary design, replacing /history's current flat one-row-per-event table. Onto that layout add: (1) three orange buttons to the right of every row - a pencil 'Edit', a copy-icon 'Clone', and a cross 'Delete' - styled distinctly from app.css's existing alerts amber/red severity classes (A7/U42) so they read as row actions, never as a health signal, despite the similar hue family. (2) Edit opens the same panel the Log page already opens for that row's datatype today (quick_entry.html's `#panel`/`.overlay` component, today fetched via `hx-get=\"/?panel=...&method=...\" hx-select=\"#panel\" hx-target=\"#panel\" hx-swap=\"outerHTML\"` from quick_entry.html's tiles) - the closest existing thing in this app to what Mark Baber calls a 'modal window' - but pre-filled with that row's actual stored values (ts plus whichever fields EventsRepo.EDITABLE lists for that table: feed's method/duration_min/volume_ml/note, nappy's kind/stool_colour/consistency, sleep's ts_end/location, growth's measure/value/source, temperature's temp_c/site, milestone's category/title/note, note's text/tags) instead of the panel's fresh-entry defaults. Saving from Edit updates the existing event_id in place via EventsRepo.edit_event's existing per-table allow-list (P2, already covers every field the panel could show including ts - no repo/model change needed), never creates a new row. Per Mark Baber's own note: since ts is itself editable, changing the date or time on an Edit can legitimately move that row into a different day-group/time-heading on the very next render - this is correct behaviour for the day-grouped view reflecting a corrected timestamp, not a bug, and must not leave a stale duplicate under the row's old heading. (3) Clone opens the identical pre-filled panel as Edit, but Saving (whether or not any field was changed) always creates a brand-new event through the same per-domain creation endpoint the Log page's own panel already posts to (e.g. POST /api/feed) - the source row is left untouched and both rows exist afterward - so a parent can, for example, copy one day's 6:20 bottle entry and change only the date to replicate it onto another day, per Mark Baber's own example. (4) Delete keeps the existing POST /api/delete soft-delete plumbing (P2/U4) but must no longer fire immediately on click - gate it behind a confirmation step in a popup modal, since today's Delete has no confirmation at all; there is no existing confirm-before-destructive-action pattern anywhere else in the app to reuse, so the exact mechanism (a native <dialog>, or a second small overlay following #panel's existing convention) is implementer's judgement. (5) A big green '+' button next to each day's date heading opens the same per-datatype entry choice the Log page offers, with that day's date pre-filled and the time defaulted to 09:00 rather than 'now' - api.py's existing `_panel_ts` helper only ever combines a bare 'HH:MM' with `today = to_local(datetime.now(UTC)).date()`, hardcoded to today, so it needs generalizing to accept an explicit date so it can be seeded from the day-group's own date (which will not be today for every group) instead. None of this changes LoggingService's log_* signatures (V1) or EventsRepo's edit_event/soft_delete contracts (P2) - Edit/Clone/Add reuse the exact create/update entry points the Log page's own panel already calls; this task is routers/templates/static plumbing plus the day-grouping/field-exposure HistoryService already does (U38/U40), not a services/repos redesign."
exit_criteria = ["/history renders the day-grouped, per-day-heading compact time/activity/kind/detail layout day_summary.html established (U40) as its only view, and /summary and /day-summary redirect to /history; base.html's tabbar has a single History entry, no separate Summary entry (route test)", "every row has three orange action controls - Edit, Clone, Delete - styled distinctly from app.css's existing alerts amber/red severity classes (inspection/test)", "clicking Edit opens the same per-datatype panel the Log page uses for that row's table, pre-filled with the row's actual stored field values including its timestamp - covering feed, nappy, sleep, growth, temperature, milestone, and note (route test per domain)", "saving an Edit updates the existing event (same event_id) rather than creating a new one; changing ts moves the row to the correct day-group/heading on the next render with no duplicate left behind (route test)", "clicking Clone opens the same pre-filled panel as Edit, but saving - with or without changes - always creates a new event; the original row is unchanged and both rows exist afterward (route test)", "clicking Delete opens a confirmation popup before the existing soft-delete (POST /api/delete) fires; dismissing the confirmation deletes nothing (route test)", "each day-group heading has a green '+' that opens the entry panel with that day's own date pre-filled and time defaulted to 09:00, correct for a non-today day-group, not just for today's (route test)", "every new/changed control still submits successfully with the picker script disabled or unloaded, via plain native inputs, carrying the app's established no-JS contract (U19/U22/U29/U31) forward onto the merged page (route test)", "history and summary static payloads are re-measured against the Q1 weight-budget test with any changed entry.js/app.css bytes, and either stay inside budget or the test is amended in the same diff with the new total recorded (test)", "scripts/test.sh, scripts/lint.sh, and scripts/check_layers.sh green"]
notes = "Filed by Mark Baber, 2026-08-23: 'merge the History and Summary pages to a single History page... take the primary design from the current Summary page but add orange buttons... Edit, Clone... Delete... If you click edit, it will bring up the same model[sic] window you see when you enter the same datatype in the Log page, however the data is prepopulated... clone button brings up a modal, with the same populated data... Delete... asks for confirmation in a popup modal... if the date or time is changed the data for that row may now be in another row... big green plus button next to each date... default the date to the date of the section... and the time to 9:00'. Depends on U4 (original /history), U38 (history-page field gating/seeding/grouping - status=review as of filing) and U40 (day-grouped /summary view - status=review as of filing); if U38/U40 are still not done when this is picked up, treat their current tree state (day_summary.html's day-grouped layout, _history_table.html's per-kind field gating) as the contract to build on, same latitude other in-review-dependency tasks in this queue already carry. 'Modal window' in Mark Baber's own request is read here as the Log page's existing `#panel`/`.overlay` component (quick_entry.html) - it already renders as an overlay today, and is the closest existing thing to a modal in this app; reuse it rather than inventing a second entry-form convention, mirroring the same reuse discipline U31/U34/U38 already established for AnyPicker/bindNumericWheel. Implementer note, 2026-08-24: Sleep rows get only Edit + Delete, not Clone - sleep's sole creation entry point (POST /api/sleep/toggle) is a stateful now-only start/stop with no fields, and toggling it to fake a 'create' for Clone would either end a real running sleep or silently ignore the pre-filled data; a proper sleep-insert primitive would mean touching events_repo.py/logging_service.py, both outside this task's touches, and V1 freezes LoggingService's log_* signatures. Edit still covers correcting a sleep row's ts/ts_end/location. Covered by test_history_clone_is_not_offered_for_sleep in tests/routes/test_quick_entry.py. Also fixed a related latent bug while wiring the day-group date-seeding through: entry.js's AnyPicker binding for the panel's time field always seeded its date from the browser's today (todayStr()), so opening Edit/Clone/Add for a past day would visibly show today's date in the picker even though the underlying native input + hidden date field still saved correctly; entry.js now seeds the picker from the panel's own hidden date field when present, and the post-save adjust-time correction compares against that same seed date instead of hardcoding today."

