[[task]]
id = "U25"
phase = 2
title = "/charts readings table: show the real date next to the age-in-days count"
status = "done"
routing = "impl"
depends = ["U5", "C3"]
touches = ["src/cradle/services/growth_service.py", "src/cradle/routers/templates/charts.html", "tests/unit/test_growth_service.py", "tests/routes/test_charts.py"]
description = "Raised by Mark Baber, 2026-08-21. /charts already has a plain-HTML table beneath the Plotly canvas (added in U5, so it works with JS off) - one row per logged reading, newest first. But every row reads only 'day N' plus the value: GrowthService.centile_chart_series() builds ChartSeries.trajectory as a bare (age_days, value) tuple per event, and the real calendar date the reading was taken - sitting right there on the source GrowthEvent as e.ts - is thrown away at that point (growth_service.py's centile_chart_series, the `trajectory = tuple(...)` line). A parent scanning the table for 'was that the one from her jab appointment' has to count days from the birth date in their head; the actual date should just be printed next to the day count. Extend ChartSeries.trajectory to carry the reading's date alongside age_days and value - keep it a plain tuple (age_days, value, date), not a new dataclass, so it stays a straightforward additional element rather than a shape the two existing positional consumers have to branch on: chart.js indexes it as p[0]/p[1] and the /api/charts/{measure} route serialises it with `[list(p) for p in series.trajectory]` - both keep working untouched with the extra element riding along, since nothing here reads index 2. Render the date in charts.html's table using the same local-time convention _history_table.html already established for the log's own readings (the `local` Jinja filter registered in pages.py, e.g. `{{ (reading_date | local).strftime('%d %b %Y') }}`) so 'day 14' reads as 'day 14 - 26 Jan 2026' rather than a bare ordinal. Keep the newest-first row order and the existing 'No {{ measure }} logged yet' empty state exactly as they are."
exit_criteria = ["centile_chart_series()'s trajectory carries each reading's calendar date (the source GrowthEvent's ts date) alongside its existing age_days and value (unit test)", "/charts renders a real calendar date next to 'day N' for every row of the readings table, not the age count alone (route test)", "the existing exact-tuple assertions on trajectory in test_growth_service.py and the trajectory list assertion in test_charts.py are updated for the new element and still pass", "the empty-history case still renders the 'No {{ measure }} logged yet' row with no error from the added date field (route test)"]
notes = "UI + service plumbing only: no new dependency, no vendored asset, nothing in rules_config.toml or alerts/messages.py. Depends on U5 (built the table and the no-JS fallback this extends) and C3 (added the `frames` field to the same ChartSeries dataclass this task is also widening) for file/shape safety, not because either is blocking work. Keep the tuple 3rd-element approach rather than a parallel dates list or a renamed field - trajectory is consumed positionally in two other places (chart.js, the JSON route) and a same-shaped-but-longer tuple is the only change that doesn't also require touching pages.py or chart.js, both deliberately left out of this task's touches. 2026-08-21: implemented. trajectory's 3rd element is a pre-formatted local-date string (to_local(e.ts).strftime('%d %b %Y'), e.g. '15 Jul 2026'), computed in growth_service.py rather than via the Jinja `local` filter the description's example showed - because the same tuple is also JSON-serialised verbatim by /api/charts/{measure} in pages.py (out of this task's touches) via a plain JSONResponse/json.dumps, which cannot encode a raw date/datetime object. A pre-formatted string is the only element type that's simultaneously JSON-safe for that route and directly renderable in charts.html without adding a new Jinja global (which would also require touching pages.py). charts.html renders `day {{ age }} - {{ date }}` per the task's own example separator. chart.js and the JSON route needed no changes, confirmed by grep: both only index trajectory positionally at p[0]/p[1]. All three `for a, _ in trajectory` unpacking sites (age-range clamp, chart series with/without reference data) updated to `for a, _, _ in trajectory`. Tests: test_growth_service.py's exact-tuple assertion updated for the 3rd element; test_charts.py's trajectory list assertion updated, plus two new route tests (real date renders in the page next to 'day N'; empty-history still renders the 'No {{ measure }} logged yet' row without error). ./scripts/test (382 passed), scripts/lint.sh and scripts/check_layers.sh green. Reviewed by house-reviewer: no blocking findings; the format-in-service-not-template deviation was flagged as a suggestion only, not a violation, given the JSON-route constraint, and a one-line comment was added at the trajectory construction site per its suggestion. Held at review, not done, per CLAUDE.md - only CI and a human reviewer make that call."

