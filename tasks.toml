exit_criteria = ["sleep start and end adjustable at entry, and a forgotten wake correctable without deleting the row (route test)", "sleep location logged from the UI and read back (route test)", "weight, length, head circ and temperature entered through the panel controls (route test)", "one tap on Sleep still starts or ends a sleep at now (route test)"]
notes = "Deliberately last: these are the low-frequency paths, and the panel idiom should be proven on feeds and nappies - which happen a dozen times a day - before it is copied. Sleep end overlaps U10, which makes ts_end editable from history; if U10 has landed, reuse its endpoint rather than adding a second write path for the same column. Growth and temperature keep their current post targets - this is a control-shape change, nothing about what is stored. 2026-08-22: implemented. Between this task being written and being picked up, U28 already converted the More drawer's growth/temperature/milestone/note fields from bare inline inputs into modal panels with select+number controls (measure/source selects, a plain number for temp_c) - so the 'bare number inputs' this task's description opens with, and the 'select treatment' it asks for on the drawer's quantities, were already delivered by U28 under its own touches, not this one. Growth/temperature's post targets are unchanged, exactly as this task's own notes require, so nothing here needed to touch them again; the only real gap against this task's exit criteria was that no route test exercised length/head_circ specifically (only weight and temp_c were covered, by U28's own test) - closed with one new test (test_growth_length_and_head_circ_entered_through_the_panel_controls) that rounds both measures through the existing /api/growth panel. Sleep is the actual new work. Constraint that shaped the design: this task's touches list is quick_entry.html + app.css + the test file only - no api.py or pages.py - so the query-param-routed #panel modal machinery U18/U22/U28 all extend via pages.py's _open_panel/_MORE_PANELS could not be reached for a 'sleep' panel value without widening touches. Instead, a small always-rendered '.stack panel' card (class sleep-detail) appears under the Sleep tile whenever summary.running_sleep is truthy (TodaySummary already carries this, no service change needed), with three small forms mirroring _history_table.html's inline-edit convention exactly (same hidden table/event_id/field naming, same (ts | local).strftime('%Y-%m-%dT%H:%M') datetime-local pre-fill): 'Set start' posts to the pre-existing /api/adjust-time, 'Set wake' and 'Set location' post to the pre-existing /api/edit-field - both endpoints and the sleep EDITABLE allow-list (ts/ts_end/location) already existed from U10, so no repo/service/router change was needed or permitted. Because the new fields are plain <input type=datetime-local>, they pick up AnyPicker's wheel-picker binding for free via entry.js's bindHistoryPickers, which already binds generically to every type=datetime-local input on the page (task U29) - entry.js itself was not touched, satisfying the 'same wheel... treatment' half of the description for sleep. /api/sleep/toggle itself is byte-for-byte unchanged, so the one-tap start/end-at-now contract carries forward exactly. Only a running sleep can be adjusted this way; a sleep already ended (Wake already tapped, correctly) has no in-page handle once summary.running_sleep goes back to None - that's the pre-existing /history inline-edit path (U10), unaffected and out of scope here, since 'at entry' in this task's own exit-criteria wording is the in-progress case. 8 new route tests added under a 'U20' section in tests/routes/test_quick_entry.py, one per exit-criteria facet (controls present while running / absent when not, start-time round trip, forgotten-wake correction confirmed to update the same row id rather than delete it, location set-and-read-back on quick-entry itself, one-tap start+end still at NOW) plus the growth length/head_circ test above. ./scripts/test (400 passed), scripts/lint.sh and scripts/check_layers.sh all green. Reviewed by house-reviewer (no blocking findings; one suggestion noted and left alone - the new 'Asleep since HH:MM in {location}' line duplicates today.html's near-identical sentence, harmless since they're different pages) and criteria-auditor (all four exit criteria independently verified met with specific passing tests cited, touches compliance confirmed exact - only the three allowed files changed). Held at review, not done, per CLAUDE.md - only CI and a human reviewer make that call."

