description = "Raised by Mark Baber, 2026-08-24: add a page to store dated notes about the baby - temperament, things they did, stories - so a parent can later look back and see how the baby has changed and grown, and remember the events along the way. The `note` domain this needs already exists end to end (P1/V1/0001_init.sql: `note` table with ts/text/tags, models.Note, EventsRepo.insert_note/list_notes, LoggingService.log_note(text, tags, logged_by, ts)) but has no page of its own today - it is reachable only through quick-entry's 'More' panel (pages.py's _MORE_PANELS) as a bare text+tags form with no date/time control at all, and POST /api/note (api.py) does not even accept a `ts` form field despite log_note already taking one, so every note is silently stamped 'now' regardless of when the thing being recorded actually happened. Add a new `/journal` page that: (a) wires the missing `ts` field through POST /api/note (mirror every other panel's `ts: Annotated[str | None, Form()] = None` -> `_panel_ts(ts)` plumbing already used for feed/nappy/milestone/etc - this is not a LoggingService signature change, log_note already accepts ts, just currently-dead on this one route) so a journal entry can be dated for an event that happened earlier, using the same AnyPicker date+time control already vendored and wired for quick-entry and history edit (task U29 - reuse entry.js's existing bindPanelPickers/bindHistoryPickers pattern and its native-input-when-JS-disabled fallback rather than a third integration of the library); (b) gives the entry form a small set of quick-select category chips (e.g. Temperament, Story/Moment, Observation, General - exact catalog and copy is implementer's judgement, same latitude already given to U31/U34/U36/U42's UX copy, since these are prompts and organisational tags, not clinical claims or thresholds) that do two things when tapped: append the category name into the existing `tags` field (so entries stay filterable/groupable later without any schema change), and swap the textarea's placeholder/prompt text to something that guides what to write for that category (e.g. Story -> 'Tell the story of what happened...', Temperament -> 'How would you describe them today?') - this is the 'inputs to guide the user to create content' Mark Baber asked for; (c) below the form, lists existing note-domain entries newest-first as the 'reflect on how they've grown' view, reusing HistoryService's existing note listing (DOMAINS already includes 'note'; rows()/day_grouped_rows(domains=('note',)) from U38/U40) rather than a new repo/service method, showing each entry's date, its tags, and its text. Editing or deleting an existing entry is deliberately left to the merged History page (U43) - /journal is a guided-creation-plus-reflection view, not a second place to maintain inline-edit/delete affordances for the same rows; nothing in this task should touch EventsRepo.edit_event, EventsRepo.soft_delete, or their existing History-page UI. No `models.Note`/`note` table schema change and no LoggingService.log_note signature change are needed or in scope - category is carried entirely in the existing `tags` field - so this task needs no architect sign-off under CLAUDE.md's public-signature-is-a-contract rule."
exit_criteria = ["GET /journal renders an entry form with the free-text note field, quick-select category chips that append to the existing tags field and swap the form's placeholder/prompt copy per category, and a date+time control using the same AnyPicker wiring already established for quick-entry/history (U29), including a working plain-native-input fallback when the picker script is disabled or unloaded (route test)", "POST /api/note accepts an optional ts form field and applies it via the existing LoggingService.log_note(ts=...) parameter (already present, previously unwired on this route), defaulting to now when omitted, so a journal entry can be dated in the past (route test)", "entries submitted from /journal persist through the existing note domain (EventsRepo.insert_note / models.Note) with no schema migration and no change to LoggingService.log_note's signature (test)", "/journal lists existing note-domain entries newest-first by reusing HistoryService's existing note-domain listing rather than a new repo/service method, each entry showing its date, tags, and text (route test)", "base.html's tabbar gains a Journal entry and /journal follows the existing first-run-with-no-profile redirect pattern every other page uses (route test)", "no inline edit/delete controls are added to /journal for existing entries; correcting or removing a note-domain row continues to work only via the merged History page (U43), unchanged by this task (regression: existing History route tests for the note domain keep passing)", "if entry.js or app.css grow in a way that changes the quick-entry page's measured static payload, tests/unit/test_weight_budget.py is re-measured and updated in the same diff with the new total recorded; if /journal's own additions are not part of the quick-entry bundle, the budget is unaffected and the test is left unchanged (test)", "scripts/test.sh, scripts/lint.sh, and scripts/check_layers.sh green"]
notes = "Filed by Mark Baber, 2026-08-24: 'a new page to store dated notes about the baby - temperament, things they did, stories - so I can later reflect on how they've changed and grown, and remember the events on that journey - with inputs to guide content creation (e.g. temperament, story categories) and AnyPicker for date/time'. Deliberately scoped as a thin new page over the existing note domain (P1/V1) rather than a new table: `tags` already exists for exactly this categorisation purpose per SPEC 5.1's own description of the note domain ('Jaundice observations, vitamin-D drops given, medication, anything unstructured'), and reusing it avoids a migration, an EventsRepo.EDITABLE change, and any LoggingService signature change - all of which would otherwise need architect sign-off per CLAUDE.md. The one real gap found by inspection is that POST /api/note never wired the `ts` field through to log_note even though every sibling panel does; fixing that is in scope here since it is exactly what 'dated notes... using AnyPicker for date/time' requires. Category chip catalog and placeholder-prompt copy are left to the implementer as non-clinical UX text, mirroring the latitude U31/U34/U36/U42 already record for similar choices. Filtering the journal list by category/tag is a reasonable follow-on but not required by these exit_criteria - left as implementer's judgement whether to include it now or as a later task."
