[[task]]
id = "O3"
phase = 6
title = "Port the CI pipeline to GitHub Actions"
status = "todo"
routing = "impl"
depends = []
touches = [".github/workflows/ci.yml", ".gitlab-ci.yml"]
description = "The gates are defined in .gitlab-ci.yml but the remote is GitHub, and there is no .github/workflows, so nothing runs on a push or a pull request - gh run list is empty. CLAUDE.md makes CI the sole arbiter of completion, and today nothing arbitrates: the validate stage sat red on main undetected until a task branch happened to run the scripts by hand. Port the four stages to one GitHub Actions workflow running the same scripts, so a red gate blocks a merge instead of waiting to be noticed. validate: scripts/validate_tasks.py then ruff format --check src tests. test: scripts/test.sh with junit.xml published as the test report. quality: scripts/lint.sh then scripts/check_layers.sh. risk: pytest tests/oracle, restricted to main or an explicit opt-in the way the GitLab rules restrict it. Python 3.12, pip cache keyed on pyproject.toml. Decide the fate of .gitlab-ci.yml in the same diff - retire it, or keep it and say in a comment which file is authoritative - because two pipelines that drift apart are worse than one."
exit_criteria = ["workflow triggers on push to main and on pull_request, and reports a status check on the PR", "all four stages run the existing scripts/ entry points, no gate logic duplicated into YAML", "junit.xml from scripts/test.sh surfaces as a test report on the run", "a deliberately broken commit fails the run - unformatted file fails validate, failing test fails test, layering violation fails quality (proven once, then reverted)", "the oracle stage runs on main and not on an ordinary PR, matching the current rules", "the fate of .gitlab-ci.yml is settled in the same diff, not left ambiguous"]
notes = "Found while fixing the two validate-stage failures that had been red on main independently of any task branch: a ruff format violation in tests/unit/test_lms.py, and validate_tasks.py rejecting nine tasks marked done over the blocked R4 oracle gate (A1, C2, C3, G1, N2, O1, Q1, U5, U6, all now review). Both had been red for some time precisely because no CI observed them. Until this task lands, every review to done flip is a human assertion rather than a verified one, so the nine downgraded tasks cannot be honestly restored to done by CI - which is the argument for doing this before phase 6 closes. Keep the scripts as the single definition of each gate: the workflow calls them, it does not reimplement them, so a contributor running scripts/test.sh locally sees exactly what CI sees."

