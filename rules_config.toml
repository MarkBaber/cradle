# Alert rule thresholds (SPEC 5.2). Code never hard-codes these.
# Sources: NHS newborn feeding/nappy guidance, NICE CG37/NG194, NICE NG143.

[feed_gap]
max_gap_hours = 4.0
max_age_days = 28

[feed_count_low]
min_feeds_24h = 8
max_age_days = 28

[wet_nappy_low]
# minimum wet nappies in trailing 24h by day of life (NHS table)
by_day_of_life = { "1" = 1, "2" = 2, "3" = 3, "4" = 4, "5plus" = 6 }

[stool_absent]
max_gap_hours = 24
from_day = 3
to_day = 28

[stool_colour]
black_normal_until_day = 5

[weight]
loss_red_fraction = 0.10        # >=10% below birth weight
regain_by_day = 14
centile_cross_z = 1.33          # ~2 channel widths

[fever_u3m]
temp_c = 38.0
max_age_days = 90

[weigh_in_due]
max_gap_days = 14
max_age_days = 180

[measurement_gap]
max_gap_hours = 12

[ntfy]
server = "https://ntfy.sh"
topic = ""                      # set in /settings; shared-secret topic (SPEC 8)

[display]
# IANA zone name used to parse datetime-local input and render timestamps
# (models/timefmt.py, task U9). Falls back to UTC if unset. A phone in a
# different timezone from this server must not silently shift timestamps,
# so this is explicit rather than inferred from the server's OS setting.
timezone = "Europe/London"

[entry_defaults]
# UX convenience numbers for the quick-entry panels (task U22), editable from
# /settings - NOT clinical thresholds, so they are outside CLAUDE.md's
# architect-only carve-out for this file. Pre-fills the bottle panel's
# volume_ml and the breast panel's duration_min; the value can still be
# changed before Save, so this is never an entry gate (T1).
bottle_volume_ml = 60
breast_duration_min = 20

[projections]
# UX convenience overrides for the next-feed/next-mess dials (task V3/U24) -
# NOT clinical thresholds, so outside CLAUDE.md's architect-only carve-out
# for this file. 0 or blank means "compute it from the log"; window_max_h has
# no computed alternative so it carries a real default.
ml_per_hour = 0
typical_feed_ml = 0
mess_interval_min = 0
window_max_h = 2

[activity_targets]
# Best-practice guidance shown next to each developmental-activity category on
# the Log page (tasks M2/U27). Display copy for a parent, one entry per
# ActivityCategory member - these gate nothing and fire no alert, so there is no
# severity, no Finding and no messages.py entry. They are nonetheless the
# health-guidance values themselves rather than a UX convenience default, so
# unlike [entry_defaults] and [projections] they stay inside CLAUDE.md's
# architect-only carve-out for this file: a future settings page must not let
# them be edited at runtime. Alerting on a missed activity would be a new
# alerts/ rule with its own severity and copy, not a threshold read from here.
tummy_time = "Start at 1-2 min, build to 10-15 min, several short sessions across the day"
reading_talking = "15-20 min cumulative per day"
sensory_play = "1-2 brief sessions of 2-5 min"
# UNVERIFIED - awaiting architect confirmation. Unlike the three above and the
# rest of SPEC 2's domain table, this figure is not a cited NHS/NICE value:
# NICE publishes no newborn foreign-language-exposure guideline. The reasoning
# is general early-language-acquisition practice - consistent short daily
# exposure matters more than session length at this age - folded into the same
# little-and-often pattern as reading_talking. Accept, edit or replace it.
foreign_language = "10-15 min cumulative per day of dedicated exposure (talking, singing, reading), folded into the same little-and-often pattern as reading_talking"
