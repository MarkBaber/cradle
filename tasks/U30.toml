phase = 1
title = "AnyPicker dark-theme polish: restyle Cancel/Set, Time as default tab, 5-minute time steps"
status = "done"
routing = "impl"
depends = ["U29"]
touches = ["src/cradle/routers/static/app.css", "src/cradle/routers/static/entry.js", "src/cradle/routers/templates/quick_entry.html", "src/cradle/routers/templates/_history_table.html", "tests/routes/test_quick_entry.py"]
description = "Raised by Mark Baber, 2026-08-22: three polish gaps in the AnyPicker date+time control U29 vendored, on both the quick-entry panel and /history's inline edit. (1) AnyPicker's 'iOS' theme renders its own Cancel and Set footer buttons with the library's default light/white chrome, which sits jarringly on this app's dark palette (--bg/--panel/--fg/--feed in app.css) - restyle them in app.css against the actual button selectors the shipped anypicker-all.min.css uses (verify the real class names directly against the vendored stylesheet, the same way U29's own notes had to verify AnyPicker's callback/option names against its source rather than trust the library's own README, which U29 found undocumented backwards). Do not fork or hand-edit the vendored CSS file itself - override it from app.css, same pattern app.css already uses for .ap-theme-ios rules. (2) AnyPicker's datetime mode currently opens with its date column as the first/active tab; reconfigure it (via whatever real AnyPicker option controls initial tab/column order - again, verify against the shipped source, not assumed docs) so Time opens as the default/active tab and Date is reachable as a secondary tab, on both the panel and /history pickers. (3) The minute wheel currently offers all 60 values; constrain it to 5-minute steps only (00, 05, 10, ... 55) via AnyPicker's real interval-equivalent option, again verified against source rather than guessed."
exit_criteria = ["app.css overrides AnyPicker's Cancel/Set button selectors (the real ones read from the vendored anypicker-all.min.css, not guessed) with the site's dark-palette variables, and a test asserts those override rules are present in app.css", "the picker's default/active view on open is Time, with Date reachable as a secondary tab, on both the quick-entry panel and /history's inline-edit field - verified via the real AnyPicker init option and value rendered on the page (route test)", "the minute wheel is configured to offer only 00/05/10/.../55 via AnyPicker's real interval option, verified the same way (route test)", "both pickers still submit a correct timestamp with the picker script disabled or unloaded, carrying U19/U22/U29's no-JS contract forward unchanged (route test)", "quick-entry static payload is re-measured against the Q1 weight-budget test with any changed app.css/entry.js bytes, and either stays inside budget or the test is amended in the same diff with the new total recorded (test)"]
notes = "Styling-only change over an already-authorised, already-vendored library (U29) - no new dependency, no architect sign-off needed. Do not touch anypicker.min.js/anypicker-all.min.css/jquery.min.js themselves; every change is either an app.css override or an init-option value in entry.js/quick_entry.html. If U29 is still status=\"review\" when this is picked up, treat its current tree state (vendored files, entry.js's bindPanelPickers/bindHistoryPickers, the ap-ts-picker markup) as the contract, the same caveat U28/V4/V2 already carry forward against their own dependencies. AnyPicker's real button/tab/interval option and selector names must be read from the shipped src/cradle/routers/static/vendor/anypicker.min.js and anypicker-all.min.css, not assumed from memory or the library's public docs - U29's own notes found the README's option names wrong, and there is no reason to expect the theme CSS's class names or the tab/interval option surface to be any more reliable sight-unseen. 2026-08-22: implemented, verified against the shipped vendored source (not README/docs) exactly as directed. (1) Cancel/Set: anypicker-all.min.css gives them no distinct class, only positional '.ap-button:last-child' (Set)/'.ap-button:not(:last-child)' (Cancel) selectors, both #007AFF text on a white '.ap-button{background:rgba(255,255,255,1)}'. app.css already had a same-specificity '.ap-theme-ios .ap-button' override (task U29) that never actually applied: anypicker-all.min.css is linked *after* app.css in both quick_entry.html and _history_table.html, so ties go to the vendor sheet by source order, and its own more specific ':last-child'/':not(:last-child)' rules always win the text colour regardless of order. Fixed by targeting the real ids the vendored markup renders for these two buttons - '#ap-button-set'/'#ap-button-cancel' (confirmed in anypicker.min.js's setButton/cancelButton markup strings) - which outrank both by specificity alone; app.css:229-237 now wires them to var(--panel)/var(--dim)/var(--feed). (2) Default tab: confirmed AnyPicker 2.0.x (internal version string 2.0.3, despite the npm package U29 pinned being 2.0.9 - a pre-existing upstream string/package mismatch, not introduced here) has NO public init option for which of Date/Time opens active - grepped every plausible option-name substring in anypicker.min.js, zero matches. The source hardcodes tmp.sDateTimeTab='date' and, on every picker show, calls this._setDateTimeTabs(this.tmp.sDateTimeTab) immediately after running the public onShowPicker(this) hook (both statements verified directly in the minified source, including the exact call-chain order). Wiring onShowPicker to set this.tmp.sDateTimeTab='time' is what that later call then reads - a real documented extension point, not a monkeypatch or fork - so entry.js:28-30 does exactly that, applied in both bindPanelPickers and bindHistoryPickers. (3) 5-minute steps: confirmed the real option is 'intervals', an {h,m,s} object (default {h:1,m:1,s:1}) consumed directly by the hour/minute/second wheel-building loops - no separate minuteInterval/step key exists (also grepped, zero matches). entry.js:28 sets MINUTE_INTERVAL={h:1,m:5,s:1}, applied via 'intervals: MINUTE_INTERVAL' in both bind functions. Three new route tests in tests/routes/test_quick_entry.py assert these against the actual served /static/app.css and /static/entry.js text (button-selector rule presence + dark-palette vars, onShowPicker/sDateTimeTab wiring x2, intervals.m=5 wiring x2) rather than executed JS, since the closed dependency set (SPEC 6) precludes a headless-browser harness - flagged by house-reviewer as a new-for-this-file but reasonable pattern given that constraint, not a defect. The pre-existing no-JS contract test (test_panel_and_history_submit_correct_timestamps_with_picker_script_disabled) is untouched and still green; api.py/pages.py/quick_entry.html/_history_table.html/vendor/* are all byte-identical to main - quick_entry.html and _history_table.html were left unused from the touches allowance since both polish items were achievable purely via entry.js init options. Weight budget: quick-entry total (app.css+pwa.js+manifest.json+icon.svg+entry.js+htmx) is 73582 bytes against the 150KB budget (about 80KB of headroom), comfortably inside it after this diff's ~230 added bytes across app.css/entry.js - tests/unit/test_weight_budget.py needed no amendment and stays green (4 passed). ./scripts/test.sh (393 passed), scripts/lint.sh and scripts/check_layers.sh all green. Reviewed by house-reviewer (one item: this status/notes update itself, now done in this same diff; no other blockers, all three verified-against-source technical claims confirmed independently) and criteria-auditor (all five exit criteria independently verified met, touches compliance confirmed exact - only app.css/entry.js/test_quick_entry.py actually changed). Held at review, not done, per CLAUDE.md - only CI and a human reviewer make that call."

