# ---------------- Combined iOS-style date+time picker (U29) ----------------

[[task]]
id = "U29"
phase = 1
title = "Combined iOS-style date+time picker for panels and history edit (AnyPicker/ios-style-picker or similar)"
status = "done"
routing = "impl"
depends = ["U22"]
touches = ["src/cradle/routers/static/entry.js", "src/cradle/routers/static/app.css", "src/cradle/routers/templates/quick_entry.html", "src/cradle/routers/templates/_history_table.html", "scripts/vendor_assets.sh", ".gitignore", "tests/routes/test_quick_entry.py", "tests/unit/test_weight_budget.py", "docs/SPEC.md"]
description = "Raised by Mark Baber, 2026-08-21: U22 already gave the entry panels an iPhone-style scroll wheel for time-of-day (vendored 'wheel-picker'), but it only picks the hour and minute - every panel still assumes the event happened today, so backdating even by one calendar day means leaving the panel for /history's plain native <input type=datetime-local>, which reintroduces exactly the fiddly-on-a-phone friction U22 solved for time. Two changes, one component seam: (1) give the panel's timestamp control a date column alongside hour/minute - still touch-scrollable, still styled like iOS's UIDatePicker - so 'log it as happening around 11 last night' is one interaction inside the modal, not a trip to /history. (2) replace the vendored 'wheel-picker' library with whichever of AnyPicker, ios-style-picker, or a comparable off-the-shelf iOS-style picker gives the smoothest, most native-feeling combined date+time wheel. Mark Baber named AnyPicker and ios-style-picker as candidates, not a name to build to sight-unseen, and explicitly directed (2026-08-21) that payload size is not a factor in the choice: pick the best interaction for the job, including a jQuery-dependent option like AnyPicker, even though nothing in this stack currently vendors jQuery. Whichever component is used, also swap /history's inline-edit datetime-local field (_history_table.html) for the same picker, so every place a timestamp is hand-entered on a phone gets one consistent smooth control. This task also carries a correction to SPEC 1's quick-entry weight-budget quality target and its Q1 test enforcement, made in this same diff (docs/SPEC.md 1 and 7.1) - see notes."
exit_criteria = ["the panel's timestamp control offers date and time in one scrollable iOS-style picker, and Save persists an event on the picked date - not always today (route test)", "picking a date other than today and saving round-trips through the existing ts parsing unchanged, or that parsing is extended in the same diff and covered by a test", "/history's inline-edit timestamp field uses the same combined picker, and a corrected date+time round-trips through it (route test)", "both the panel and /history's edit form still submit a correct timestamp with the picker script disabled or unloaded, carrying U19's and U22's own no-JS constraint forward (route test)", "whatever is vendored - including jQuery, if AnyPicker is chosen - is fetched and SHA-256-pinned via scripts/vendor_assets.sh per the U8/R5 convention", "tests/unit/test_weight_budget.py is updated to exempt the picker's vendored assets from the quick-entry budget total, the same shape of carve-out the test already gives Plotly on /charts, rather than gating this component on the 150KB ceiling - the test still asserts every other quick-entry asset (app.css, entry.js, htmx, the core tiles) stays within budget", "the .gitignore vendor pattern is checked to cover every file type the chosen library ships, not just .js - closing the gap U22's own notes flagged and left open"]
notes = "Dependency-set note: SPEC 6 closes the dependency set and CLAUDE.md makes adding one an architect decision; Mark Baber's own request here names AnyPicker and ios-style-picker as candidates, the same shape of explicit authorisation U22's notes relied on, so this stays impl-routed rather than architect-routed. Keep the authorisation to this one component seam; don't reach for jQuery or a heavier library anywhere else in the panel just because this exemption exists. 2026-08-21 correction, at Mark Baber's direct instruction: an earlier draft of this task flagged AnyPicker's jQuery dependency as a likely Q1-budget blocker and steered the implementer toward a lighter library or extending wheel-picker instead, to stay inside the historical 150KB ceiling. Mark Baber overrode that explicitly - size is not a constraint for this component, pick whichever option is best for the job, and correct any codebase text that reads as limiting size here rather than treating it as a hard gate. Two corrections made in this same diff, not deferred to whoever implements this task: SPEC 1's quick-entry weight-budget quality-target row now carries an explicit carve-out for the picker's vendored assets, and SPEC 7.1 records the amendment with its rationale. The Q1 gate itself is not abolished - it still protects the rest of the quick-entry payload exactly as before, the same way Plotly is excluded only because it is scoped to /charts; this is a same-shaped carve-out, not a removal of the gate, and the actual test_weight_budget.py code change (the exemption logic itself, sized to whatever library is actually chosen) is this task's own work, per its exit criteria. Behaviour note, not a scope objection: quick-entry's whole design (T1, SPEC 5.4) assumes 'log it now', with corrections handled post-hoc via /history's adjust-time flow (U2); letting the panel itself pick a past date blurs that line deliberately, at Mark Baber's explicit request, not an oversight to push back on. Depends on U22 for the modal-panel and existing picker plumbing this extends and inherits its outstanding gate: U22 is itself still status=\"review\" pending U18's unmet consistency criterion, so treat its current tree state as the contract and flag rework risk here if that changes before this lands - the same caveat V4 already carries against M2. 2026-08-21: implemented. Chose AnyPicker (npm 'anypicker' 2.0.9, MIT, jQuery plugin) over ios-style-picker after checking both against the actual npm registry: ios-style-picker is a React component (peerDependency react/react-dom, date-only - no hour/minute at all), incompatible with this stack's plain Jinja+htmx+vanilla-JS templates and not a combined date+time picker in the first place, so it was ruled out on fit, not size. AnyPicker's mode:\"datetime\"+theme:\"iOS\" gives a single combined wheel-set (date, hour, minute, AM/PM) styled like UIDatePicker out of the box. Vendored via jsdelivr (unpkg timed out for this package; jsdelivr is an equally standard CDN, already precedented by plotly.min.js's non-unpkg cdn.plot.ly source) - jquery.min.js 3.7.1 (87533 bytes), anypicker.min.js (86633 bytes), anypicker-all.min.css (31124 bytes, bundles the iOS/Android/Windows themes + font icons as an inlined base64 font so no separate font files needed to be vendored or gitignored). All three SHA-256-pinned in scripts/vendor_assets.sh and independently verified against the fetched files. Key design constraint: api.py/pages.py/models were outside this task's touches, so api.py's _panel_ts (parses the panel's ts field as bare \"HH:MM\", always combined with the server's own \"today\") could not be touched or extended - the panel's <input type=time name=ts> therefore still posts exactly that unchanged format/semantics. A picked date reaches the server instead via entry.js firing a follow-up POST to /api/adjust-time (an existing route, already parsing a full ISO string via datetime.fromisoformat, itself completely unchanged) immediately after a successful Save, correlated to the just-created event via the create-toast's data-table/data-event-id attributes (api.py's existing _toast() helper) - this is what makes exit criteria 1 and 2 both true without widening touches into api.py. The correction is skipped entirely when the picked date equals today (the common un-backdated case stays a single request); if the correction request itself fails, the toast is replaced with an explicit error asking the user to fix it in History, rather than silently leaving the event on today's date (a gap the house-reviewer subagent caught and this addresses). /history's inline-edit field needed no such split: /api/adjust-time already accepted a full date+time, so the picker there binds directly over the existing <input type=datetime-local name=ts> (and the sleep row's ts_end field), same hidden-original-input-plus-visible-clone trick U22's wheel-picker used. history.html/base.html have no touchable head-block, so _history_table.html loads the vendor <script>/<link> tags itself, at the bottom of the partial (defer only cares about DOM-parse completion, not tag position). Weight budget: jQuery+AnyPicker (205KB combined) are excluded from the quick-entry budget total entirely - not given an allowance-when-absent like htmx, but the same full carve-out shape Plotly already gets, per Mark Baber's explicit size-is-not-a-factor instruction; docs/SPEC.md 1 and 7.1 record the amendment (7.1 wording tightened from conditional \"if AnyPicker is chosen\" phrasing to the actual final choice, since it now is one). .gitignore's vendor pattern broadened from *.js to * to close the CSS gap U22's notes flagged (verified the already-tracked vendor/README.md is unaffected). 8 new/rewritten route tests added to tests/routes/test_quick_entry.py covering all four route-test exit criteria; tests/unit/test_weight_budget.py gained test_picker_assets_are_exempt_from_the_budget alongside the rewritten budget test. ./scripts/test (386 passed), scripts/lint.sh and scripts/check_layers.sh all green; python3 scripts/backlog.py reports 77 tasks, graph acyclic, schema complete, exit 0. Reviewed by house-reviewer (one real gap found and fixed - the adjust-time fetch()'s silent failure mode, above; the double-submit race on pendingCorrection was left as-is, flagged by the reviewer itself as a narrow, pre-existing risk class this diff doesn't introduce, not a regression) and criteria-auditor (all seven exit criteria independently verified met, touches compliance confirmed exact). Held at review, not done, per CLAUDE.md - only CI and a human reviewer make that call - and because the U22/U18 dependency chain this task inherits is itself still status=\"review\", not done."

