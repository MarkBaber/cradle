[[task]]
id = "U22"
phase = 1
title = "Friendlier log entry: modal panels, configurable smart defaults, iPhone-style time picker"
status = "done"
routing = "impl"
depends = ["U18"]
touches = ["src/cradle/routers/templates/quick_entry.html", "src/cradle/routers/templates/settings.html", "src/cradle/routers/static/app.css", "src/cradle/routers/static/entry.js", "src/cradle/routers/api.py", "src/cradle/routers/pages.py", "rules_config.toml", "scripts/vendor_assets.sh", "tests/routes/test_quick_entry.py", "tests/routes/test_settings.py", "tests/unit/test_weight_budget.py"]
description = "Raised by Mark Baber, 2026-08-19: the U18 panels work but are plain and slow to fill in. Four changes to the same panel system, bundled because they all touch quick_entry.html and its tests and a second pass over the same file is exactly what the touches rule exists to avoid. (1) Smart defaults: the bottle panel's volume_ml and the breast panel's duration_min currently open empty, so every entry needs a number typed in even though most bottles and feeds cluster around a household's own usual amount. Pre-fill each from a configured default (out of the box: 60ml bottle, 20min breast) and let the value still be changed before Save - never an entry gate, matching T1. (2) Configurable in /settings: the defaults must be editable without a file edit, the way U9's approach was rejected as too Pi-technical for ntfy in favour of N3's proper settings write. (3) Time pre-fill: every panel's <input type=time> currently opens blank; pre-fill it with the current time as HH:MM in the configured display timezone (U9) so accepting every default really does write 'now', matching U18's own 'accepting every default is 2 taps' criterion, which today is only true if the parent also fills in the time by hand. (4) Presentation: panels currently swap into a <div id=\"panel\"> in the normal page flow below the grid, pushing content down; render them instead as a centred modal overlay with a dimmed, semi-transparent backdrop over the page, closable without saving. (5) Time picker: replace the native <input type=time> with a touch-friendly scroll wheel styled like iOS's UIPickerView / the iPhone date-and-time picker. (6) Breast consolidation: the Feed grid currently has two tiles, Breast left and Breast right, each posting a fixed method; replace them with a single Breast tile, and inside its panel offer L and R as two toggle buttons - the selected side glows/carries an active style, the other is greyed out - instead of the current <select>."
exit_criteria = ["bottle panel's volume_ml input pre-fills with the configured default in ml, 60 out of the box (test)", "breast panel's duration_min input pre-fills with the configured default in minutes, 20 out of the box (test)", "both defaults are editable from /settings and the new value appears on the next panel open (test)", "every panel's time field pre-fills with the current time as HH:MM under FixedClock, in the configured display timezone (test)", "Feed/Mess panels render as a modal overlay with a dimmed backdrop rather than an inline swap in the page flow, and stay reachable and submittable with JS disabled, per U18's no-JS fallback contract (route test)", "the time control is a scroll-wheel picker that writes a value the existing form post accepts unchanged, and still submits a correct timestamp with JS disabled or the script unloaded (route test) - carries U19's two constraints over verbatim", "Breast is a single tile; its panel's L and R controls are mutually exclusive toggle buttons, exactly one carrying a selected/active class matching the posted method, the other carrying a dimmed/inactive class (route test)", "quick-entry static payload is re-measured against the Q1 budget with the new assets included, and either stays inside it or the budget test is amended in the same diff with the new total recorded (test)"]
notes = "Supersedes U19 (see its notes) - that task is parked, not double-built. Dependency: SPEC 6 closes the dependency set and CLAUDE.md makes adding one an architect decision; Mark Baber's own request explicitly authorises an external JS library for the picker, which is the sign-off, but keep it to that one seam - do not reach for a library for the modal, the toggle buttons or the defaults form, all of which are plain HTML/CSS/htmx. If a library is vendored, follow the U8/R5 convention: pin its SHA-256 in scripts/vendor_assets.sh alongside HTMX_SHA256/PLOTLY_SHA256, never an unpinned CDN script tag. Defaults storage: add a new [entry_defaults] table to rules_config.toml (bottle_volume_ml=60, breast_duration_min=20) rather than a new file - these are UX convenience numbers, not clinical thresholds, so CLAUDE.md's architect-only carve-out for rules_config.toml's *clinical values* does not reach them - but scope the runtime writer strictly to that one table, mirroring N3's ntfy-only regex patch, so a settings-page POST can never touch a threshold. Modal + toggle-button styling stays in app.css; no new template engine or client framework. Keep the abandoned-panel behaviour U16 already specified: closing the overlay without Save must leave no row written. The weight-budget criterion is the one to settle early, not late - entry.js plus any vendored picker library land on the same page Q1 budgets, and /log is not in Q1's existing charts-only exemption list, so check the number before writing the rest of the diff, not after. 2026-08-20: implemented. [entry_defaults] added to rules_config.toml. GET/POST /api/settings/entry-defaults live in api.py (not app.py, which is outside touches): a module-level CONFIG_PATH = Path('rules_config.toml'), plus entry_defaults()/_write_entry_defaults() mirroring app.py's N3 _write_ntfy_topic (regex scoped strictly to the [entry_defaults] section, verified by a test asserting [weight].loss_red_fraction is untouched after a write). pages.py cannot get config_path via DI either (create_app/Services both outside touches), so it imports `from cradle.routers import api as api_module` and calls `api_module.entry_defaults(api_module.CONFIG_PATH)` - a module-attribute read, not `from ... import CONFIG_PATH`, so tests monkeypatching api_module.CONFIG_PATH (same convention as tests/unit/test_timefmt.py patching timefmt.CONFIG_PATH) are honoured by both the settings write and the panel-open read. Time pre-fill reuses the clock already threaded into svc.today.summary() (TodaySummary.as_of), so no new clock plumbing was needed and FixedClock is honoured for free. Picker: vendored npm 'wheel-picker' 1.1.0 (MIT, ~15.4KB total across .js+.css), SHA-256-pinned in scripts/vendor_assets.sh; entry.js binds it over the existing <input type=time name=ts> via hiddenInput:true so with the script unloaded the native control alone still posts the HH:MM _panel_ts already parses - verified the library's real formatHiddenValue/formatValue/parseValue option names directly against the shipped minified source, since its own README documents them backwards. Breast: single tile, panel offers two radio inputs styled as buttons (no JS - :checked drives the live look; server-rendered active/inactive classes exist only so route tests can assert the posted method matches). Modal is pure CSS (.overlay/.overlay.open toggled server-side by Jinja on open_panel), so it and the no-JS submit path both work with JS fully disabled. Weight budget: entry.js (a real committed file) added to QUICK_ENTRY_ASSETS; the two vendored wheel-picker files get the same allowance-when-absent treatment test_weight_budget.py already gives htmx, sized from their actual pinned bytes (13342 + 2429). Recomputed total ~84.6KB against the unchanged 150KiB budget - no amendment needed. Known gap, left alone deliberately: .gitignore's vendor ignore pattern is src/cradle/routers/static/vendor/*.js only, so wheelpicker.min.css (unlike its .js sibling) is not covered and would land as a real trackable file if anyone runs scripts/vendor_assets.sh and then `git add -A`; .gitignore is outside this task's touches so it wasn't extended here - flagging for a follow-up task or an architect-approved one-line touches addendum. ./scripts/test (338 passed), scripts/lint.sh, scripts/check_layers.sh and python3 scripts/backlog.py (68 tasks, graph acyclic, schema complete, exit 0) all green. Reviewed by house-reviewer (no blocking findings) and criteria-auditor (all eight exit criteria independently verified met). Held at review, not done, per CLAUDE.md - only CI and a human reviewer make that call. 2026-08-21: held at review, not because of anything on this task - its own work merged in PR #30 - but because it depends on U18, whose consistency exit criterion is still unmet (see U18's notes). This flips to done with U18."
