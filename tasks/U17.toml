description = "The Dirty panel in U18 offers a description of the mess beyond its colour. models/enums.py has StoolColour and nothing else: there is no vocabulary for consistency, NappyEvent has no field to hold one, and the nappy table has no column. Define the closed set as StoolConsistency, add the field to NappyEvent defaulting to an UNSET member, persist it in a new migration, and extend the repo round-trip. Choosing which descriptions are worth distinguishing is a clinical claim, which is why this is architect-routed rather than folded into U18."
exit_criteria = ["StoolConsistency enum with an UNSET default member, stored by .value like every other enum", "NappyEvent round-trips consistency through EventsRepo (test)", "migration applies cleanly on an existing database and is recorded in schema_version (test)", "nappy rows written before the migration read back as UNSET rather than raising (test)"]
notes = "Do not let an impl agent pick these names: which stool descriptions are worth distinguishing is the same class of claim as which colours are flags (U11, A8), and a badly chosen set quietly shapes what a parent reports to a midwife. No rule reads this field and none should be written here - if a consistency ever becomes an alert condition it needs messages.py copy and therefore A8. P3 already claims migration 0002: take the next free number and check the directory before writing the file. Implemented as StoolConsistency (8 members, UNSET first, sized to match StoolColour so the U18 panel stays one tappable list); the member comments describe appearance only and carry no flag annotations, unlike StoolColour. Field is NappyEvent.consistency, column added by migrations/0004_stool_consistency.sql as a single ALTER TABLE ... NOT NULL DEFAULT 'unset', which is what backfills pre-migration rows to UNSET rather than raising. Vocabulary and rejected alternatives recorded in docs/adr/0012-stool-consistency-vocabulary.md; that ADR plus its README index row are the only changes outside touches, and the enum is deliberately not re-exported from models/__init__.py because that file is not in touches - events_repo.py imports it from cradle.models.enums and U21 (appended) moves it. U21 also carries the log_nappy pass-through U18 needs and the EDITABLE/CSV-header pair."

