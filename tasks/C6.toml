description = "Raised by Mark Baber, 2026-08-22, companion to C5: /charts' 'Daily totals' section currently renders one crowded Plotly chart (series.js's daily()) with feeds/wet/dirty as grouped bars and sleep hours as an overlaid line on a second y-axis. Split it into four separate charts on /charts only - feeds, wet, dirty, sleep - each with C5's recommended target line(s)/band drawn alongside the actual series, so the clutter goes away and each metric reads on its own scale. Do not touch /patterns or its #dailychart/#sleepchart containers or series.js's existing daily()/sleep() functions - those keep serving /patterns exactly as today; add new element ids (e.g. #feedschart, #wetchart, #dirtychart, #sleeptargetchart - pick names that don't collide with patterns.html's existing #sleepchart) and new rendering functions, either appended to series.js behind those new ids or in a new static file, whichever keeps the /patterns code path untouched. Extend GET /api/series/daily's JSON (pages.py) with C5's new age_days and targets fields alongside the existing feeds/bottle_ml/wet/dirty/sleep_hours/etc., so one fetch still serves both pages. Each of the four new charts should show, where the target data exists (None entries mean 'no target for this range' - render nothing there, not a zero): feeds chart plots bottle_ml as bars against the feed_volume_ml target as a dashed line; wet chart plots wet as bars against wet_min (and wet_max if C5's architect review kept it) as a shaded band or two dashed lines; dirty chart the same shape against dirty_min/dirty_max; sleep chart plots sleep_hours as a line against sleep_min_hours/sleep_max_hours as a band. Give each chart a second x-axis if practically achievable: Plotly's date and category axes don't line up cleanly when overlaid directly, so instead of plotting real dates on x, plot bucket index (0..days-1) on x with xaxis.tickvals/ticktext set to the formatted dates and a second, fully overlaying xaxis2 (side: 'top') using the same tickvals with ticktext set to age_days (e.g. 'day 14') - both axes then reference identical positions so they can never drift apart, without needing a second data trace. If this turns out not to be practical within Plotly's model, fall back to the date axis alone and put the age in each point's hover text instead - document whichever was chosen and why in this task's notes rather than leaving both half-attempted."
exit_criteria = ["/charts renders four separate chart containers (feeds, wet, dirty, sleep), each fetching /api/series/daily and each showing its own actual series plus C5's target line(s) where not None (route test asserts the four container ids are present and the JSON payload includes age_days and targets)", "/patterns' existing #dailychart/#sleepchart rendering is unchanged (existing patterns route test still passes with no edits, or only incidental edits explained in notes)", "None target entries render no line/band for that stretch rather than a misleading zero (unit-level assertion on the JS payload contract or a route test on the JSON, since Plotly rendering itself isn't unit-testable here)", "each chart's x-axis and, if implemented, the top age axis reference the same bucket positions, so they cannot show mismatched days (test, or explicit notes reasoning if visual-only)", "page still degrades to the existing no-JS table state (noscript note) - nothing here requires JS to avoid an error"]
notes = "Implemented per-metric daily charts on /charts (#feedschart, #wetchart, #dirtychart, #sleeptargetchart) with dual x-axis using Plotly tickvals/ticktext over bucket indices (0..days-1) on xaxis and overlaying xaxis2 (side: top), ensuring zero drift between date and age labels. /patterns code path and rendering left untouched. /api/series/daily extended with age_days and targets fields."

