[[task]]
id = "Q5"
phase = 6
title = "Make main green: 14 route tests have been failing on main across several merges"
status = "done"
routing = "impl"
depends = ["O3"]
touches = [
    "src/cradle/routers/api.py",
    "src/cradle/services/today_service.py",
    "tests/routes/test_quick_entry.py",
    "tests/routes/test_settings.py",
]
description = "Found 2026-08-27 while opening PR #97 (task O5): scripts/test.sh reports 14 failures on a clean checkout of main at 1e4e4a7, reproduced identically there with no task branch in the picture. They are two unrelated root causes, both already diagnosed in U46's notes and neither ever filed as work. Cluster A, 7 tests in tests/routes/test_quick_entry.py (test_history_edit_corrects_both_date_and_time, test_growth_temperature_milestone_save_with_picked_time_persists_that_exact_time, test_growth_temperature_milestone_time_field_round_trips_through_adjust_time, test_growth_temperature_milestone_fields_submit_correctly_with_picker_script_disabled, test_history_multiple_same_time_rows_keep_independent_row_ids, test_history_edit_saving_updates_the_same_event_and_moving_ts_relocates_the_row, test_history_day_add_button_seeds_that_days_own_date_and_nine_am): _panel_ts in routers/api.py defaults its reference date with `day = ref_date or to_local(datetime.now(UTC)).date()` - the real wall clock, not the injected Clock every service reads time through. A panel POST with no explicit date therefore lands on the real today rather than the test's NOW, and since U46 made /history paginate one week at a time those events fall outside the default-displayed week whenever a FixedClock test's NOW differs from the real run date. The tests were passing before U46 only because the unpaginated view (limit=200) showed every date, which hid the inconsistency rather than avoiding it - so this is a real defect in api.py, not test drift, and it will silently misfile a genuine entry near local midnight exactly as the docstring for _panel_ts already warns about for timezones. Constraint the implementer must respect: routers may import only models and services (SPEC 3, enforced by tests/unit/test_layers.py's ALLOWED map), so api.py cannot import cradle.ports.clock and Services (routers/deps.py) cannot grow a `clock: Clock` field - that annotation alone would fail the layering gate. The layering-safe shape is an additive public accessor on a service the router already holds - e.g. a method on TodayService returning the current local date from its own injected _clock - which routers may call because routers -> services is legal, and which is additive in exactly the way U44's notes record for the Services dataclass, so it needs no architect sign-off. _panel_ts itself is private (leading underscore), so changing its signature is not a public-contract change either. Cluster B, 7 tests (6 in tests/routes/test_settings.py: test_get_entry_defaults_reflects_config_out_of_the_box, test_post_entry_defaults_rejects_non_positive_values, test_settings_page_shows_the_current_entry_defaults, test_new_entry_default_appears_on_the_next_panel_open, test_get_wheel_steps_reflects_config_out_of_the_box, test_post_wheel_steps_rejects_non_positive_values; plus test_bottle_panel_prefills_the_configured_volume_default in test_quick_entry.py): commit 135b072 'Update config' changed values in rules_config.toml - bottle_volume_ml 60 to 70, wheel_steps.weight 25 to 10, among others - without updating the tests that hardcode the old numbers, so they assert 25 where config now says 10. rules_config.toml carries architect-only values per CLAUDE.md and must not be edited back to make tests pass; the tests are what is wrong here. Prefer reading the expected value from the same config the app reads over hardcoding the new number, so the next architect-authored config change does not re-break these same seven tests - the test names themselves say 'reflects config out of the box', which is a property, not a constant. Both clusters are filed as one task rather than two because they overlap on tests/routes/test_quick_entry.py and would serialize against each other anyway; keep them as two commits on the branch so the api.py fix stays reviewable apart from the test-expectation updates."
exit_criteria = [
    "scripts/test.sh is fully green on the branch, with all 14 named failures passing and no test newly skipped or deleted to achieve it",
    "_panel_ts derives its default reference date from the injected Clock rather than datetime.now(UTC), so a FixedClock route test files a panel entry under the test's NOW (test, with NOW deliberately set to a date other than the real run date so the test fails against today's code)",
    "the clock reaches routers without routers importing cradle.ports: tests/unit/test_layers.py and scripts/check_layers.sh stay green",
    "the settings and quick-entry expectations derive from the same config the app reads, so changing a value in rules_config.toml moves the test with it rather than breaking it (test)",
    "rules_config.toml is unmodified by this diff (architect-only per CLAUDE.md)",
    "scripts/lint.sh and scripts/check_layers.sh green, and python3 scripts/backlog.py exits 0",
]
notes = "Depends on O3 rather than merely coinciding with it: O3 is why these sat unnoticed. All 14 were confirmed pre-existing by running tests/routes/test_quick_entry.py and tests/routes/test_settings.py against clean main at 1e4e4a7, with the identical 14 names failing and 115 passing, so none of them are artefacts of the O5 branch they were found from. U46's notes reached the same two root causes independently and recommended a follow-up task; that recommendation was never filed, which is how the count grew from 7 to 14 as 135b072 landed on top. Implemented 2026-08-28; 625 passed, 0 failed, 0 skipped - the same 625 collected before, so nothing was deleted or skipped to get there. Dependency exception, recorded rather than glossed: this task was started while O3 sat at review, not done, which CLAUDE.md forbids. O3 cannot reach done without CI, CI on main is red, and it is red because of this task - a deadlock O3 created and only this task can clear. Started on the operators explicit instruction; O3s deliverable was already merged, so the premise this task depends on (a gate that watches these tests) does hold. Cluster A came out differently than filed, and the difference matters. Fixing _panel_ts made a previously PASSING test fail: test_panel_time_field_combines_with_todays_display_zone_date asserted `local.date() == to_local(datetime.now(UTC)).date()`, i.e. it asserted the wall clock, so it passed only because the defect existed - the test encoded the bug rather than catching it. Same idiom at one more site (the growth/temperature/milestone save test). Both now assert `to_local(NOW)`, which makes them the regression test this tasks second exit criterion asks for: NOW is 2026-07-15 and the real run date was 2026-08-28, and both were confirmed to fail against pre-Q5 code by temporarily restoring the wall-clock default, running them, and reverting - `assert datetime.date(2026, 8, 28) == datetime.date(2026, 7, 15)`. api.py was then diffed against a pre-proof backup to confirm the revert was exact. The remaining four cluster-A failures were the U46 half of the diagnosis: they move an event to 2026-07-10 and read the default /history, which since U46 renders only NOW's week (13-19 Jul), so 10 Jul is one week back. They now pass ?week=2026-07-10, which is what U46s own notes asked for. One of them needed more than a URL change: test_history_edit_saving_updates_the_same_event_and_moving_ts_relocates_the_row asserted `15 Jul 2026 not in page` to prove no stale duplicate under the rows old day, and under a week-scoped view that assertion is vacuous - a different week never renders 15 Jul either way. It now fetches the old week separately and asserts the row id is absent from it, which is the property the original assertion meant. Implementation shape for the clock: TodayService gained a public local_today(), and _panel_ts takes `today` as a required parameter with no default, so the wall clock is gone from that function entirely and mypy names any call site that forgets rather than one silently reintroducing it. Nine call sites updated, all identical. Routers still import only models and services - a `clock: Clock` field on Services (routers/deps.py) would have failed the layering gate, which is why the accessor lives on a service. _panel_ts is private, so its changed signature is not a public-contract change and needs no architect sign-off. Cluster B: a shared config_value() helper in test_settings.py reads the repo's own rules_config.toml, used by all six settings assertions and by the two quick-entry panel-prefill tests. Deliberately parses the file rather than calling api.wheel_steps()/api.entry_defaults(), because comparing an endpoints output to the helper that endpoint calls would assert nothing about the values. Proven to satisfy the fourth exit criterion by temporarily setting bottle_volume_ml to 123 and wheel_steps.weight to 37 in rules_config.toml, running both files green (129 passed), and reverting - git confirms rules_config.toml is unmodified by this diff. One test outside the failing 14 was also converted: test_breast_panel_prefills_the_configured_duration_default still passed at 20 min only because 135b072 happened not to touch that key; leaving it pinned would have left the identical trap armed for the next architect config change. Promoted review -> done 2026-08-28: the test job is green on main, which is the state this task existed to restore. 633 tests pass there (625 plus O5's 8)."

