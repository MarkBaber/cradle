exit_criteria = [
    "storing a bottle via MilkStockService.store_now or store_expression sends one WhatsApp message, formatted and date-headered exactly like N5's other nine domains (test)",
    "a WhatsApp failure during store_now/store_expression does not raise and does not prevent the batch from being recorded (test)",
    "scripts/test.sh, scripts/lint.sh, scripts/check_layers.sh green, and tasks.toml updated in the same diff",
