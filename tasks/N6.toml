notes = "Filed by the N5 implementation run, 2026-08-29, as the direct consequence of N5's touches list excluding milk_service.py. Read logging_service.py's echo_event() and chat_log_repo.py before starting - the mechanism already exists and is tested; only MilkStockService's constructor and its two insert call sites need to change, plus rewiring build_services() to pass whatever MilkStockService now needs. Whether to inject a full LoggingService or just the narrower trio is an implementer judgement call, not decided here. IMPLEMENTATION 2026-09-06, status review: MilkStockService gained a third, optional trailing constructor param `logging: LoggingService | None = None` (default None, so both existing 2-arg call sites - test_logging_service.py's and test_milk_service.py's own _build() - keep working unchanged), rather than the narrower history/whatsapp/chat_log trio: injecting the whole LoggingService lets MilkStockService call the single already-tested echo_event() method directly instead of duplicating its history-lookup/date-header/try-except logic a second time, which is the more DRY, minimal-diff option per CLAUDE.md. store_expression (the sole insert_milk_batch call site; store_now delegates to it, so both public entry points named in the exit criteria are covered by one call) now calls self._logging.echo_event(\"milk_batch\", batch_id, at) after the repo write succeeds, `at` being the same stored_at timestamp written to the batch - matching N5's 'after the write, never blocking it' contract exactly, since echo_event's own try/except already swallows any whatsapp/history/chat_log failure. Layering: milk_service.py importing logging_service.py is a services-to-services import, the same precedent already set by logging_service.py importing history_service.py and alerts_service.py importing growth_service.py - not a layering violation (services may import services) and no import cycle exists. build_services() in app.py now constructs one LoggingService instance and passes it to both `logging=` and into MilkStockService's third argument, rather than building two redundant instances. Tests added to tests/unit/test_milk_service.py: fire-path tests for store_now and store_expression (asserting the exact date-headered message via HistoryService.get_row(), matching N5's convention), a no-op test for the default-None case, and two no-fire/failure-path tests (send() returning False, and send() raising an exception) both asserting the batch is still recorded despite the WhatsApp failure. scripts/test.sh (664 passed), scripts/lint.sh, and scripts/check_layers.sh all green; diff scoped to exactly this task's touches list (src/cradle/services/milk_service.py, src/cradle/app.py, tests/unit/test_milk_service.py) plus this tasks.toml update."

