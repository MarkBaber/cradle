# ---------------- History: correcting a nappy after the fact (U26) ----------------

[[task]]
id = "U26"
phase = 1
title = "History table: inline edit for stool colour and consistency"
status = "done"
routing = "impl"
depends = ["U18", "U21"]
touches = ["src/cradle/routers/templates/_history_table.html", "tests/routes/test_quick_entry.py"]
description = "A nappy's colour and consistency can be written and exported but never corrected. _history_table.html offers an inline edit form for exactly two tables - `r.table == \"feed\"` (duration_min) and `r.table == \"sleep\"` (ts_end) - and has no nappy branch at all, so a row logged with the wrong colour, or logged before the colour was noticed, can only be deleted and re-entered. Everything underneath is already in place and needs no change: EventsRepo.EDITABLE[\"nappy\"] allows ts, kind, stool_colour and consistency (events_repo.py, the P2 allow-list), /api/edit-field has existed since U10, and _coerce_field_value passes a value straight through when the field is not a datetime/int/float - which is exactly what these two enum-valued columns want. Add the `{% elif r.table == \"nappy\" %}` branch with a select for each field, following the shape of the feed and sleep forms beside it (method=post + hx-post to /api/edit-field, hx-target=#toast, class=inline) so the no-JS path posts the same form the htmx path does."
exit_criteria = ["a logged nappy's stool_colour can be changed from the history table and the new value is read back (route test)", "a logged nappy's consistency can be changed the same way (route test)", "the no-JS path works: a plain form POST to /api/edit-field with no HX-Request header updates the row and redirects (route test)", "the allow-list still refuses a nappy column outside EDITABLE, unchanged by the new form (route test)"]
notes = "Salvaged from task/U11-stool-colour-capture (commit 1d8fb24, 2026-08-18), the one branch that was pushed and never opened as a PR. U11 itself is correctly parked - U18 absorbed its entry-side criteria and delivers colour inside the Dirty panel - but the branch also carried a history-table inline edit that no later task picked up, and that half is still missing from main. Do not revive the branch: it was written against the pre-U18 quick-tap flow and its api.py hunk builds a post-tap colour prompt into the _toast/_respond helpers, a flow U18 replaced with entry panels, so it conflicts and its main idea is obsolete. Only the _history_table.html half is wanted here, which is why api.py is not in this task's touches. Depends on U18 for vocabulary rather than for files: U18 owns the consistency control on the entry side and its exit criterion 4 is still unmet, and the edit form's labels should match whatever it settles on rather than inventing a second set. Depends on U21 for EDITABLE[\"nappy\"][\"consistency\"], which it added. Presentation only - no new column, no migration, no rule change, and nothing here touches alerts/messages.py: which colours are a flag stays a clinical claim owned by A8, and this task must not label, warn about or order the options by concern."

