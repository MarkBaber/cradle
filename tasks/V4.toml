notes = "Depends on M2 for ActivityEvent/ActivityCategory/EventsRepo.activity and the [activity_targets] table; if M2 is still status=\"review\" rather than \"done\" when this is picked up, treat its current tree state as the contract but flag rework risk in this task's own notes if any of those signatures move before M2 lands - V2's notes flagged the identical situation against M1. Do not invent a pass/fail verdict, a colour, or a percentage-of-target framing here even though it would be easy to compute from the two numbers this service already has - that presentation judgement belongs to U27, and per U23's own house rule, copy stays descriptive, never advisory, even there. IMPLEMENTATION 2026-08-22, status review: all five exit criteria pass (448 tests, check_layers.sh green, backlog.py OK). REWORK RISK: M2 is still status=review at time of writing - ActivityEvent/ActivityCategory/EventsRepo.insert_activity/list_activities signatures treated as the contract; any change to those before M2 lands will require a corresponding update here. ActivityCategory and ActivityEvent are imported from cradle.models.enums and cradle.models.events directly (not the package root), matching events_repo.py's pattern - M3 will fold both back in when it lands. No verdict, colour, or percentage framing added: ActivitySummary carries duration_min + session_count + target_text, nothing more."

