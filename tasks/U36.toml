[[task]]
id = "U36"
phase = 1
title = "Log page: scroll-wheel entry for the remaining activity Duration fields (Reading & Talking, Sensory Play, Foreign Language)"
status = "done"
routing = "impl"
depends = ["U31"]
touches = ["src/cradle/routers/templates/quick_entry.html", "src/cradle/routers/static/entry.js", "tests/routes/test_quick_entry.py", "tests/unit/test_weight_budget.py"]
description = "Raised by Mark Baber, 2026-08-23. U31 gave the activity panel's Duration field an AnyPicker scroll-wheel only for the Tummy Time category (quick_entry.html sets id=\"tummy-duration\" only when open_category == 'tummy_time'; entry.js binds that id to TUMMY_DURATION_WHEEL) - U31's own notes explicitly scoped the other three activity categories that share this same panel markup (Reading & Talking / reading_talking, Sensory Play / sensory_play, Foreign Language / foreign_language) out of that task ('the others are unspecified by this request and can stay whatever U27 lands with unless directed otherwise... leave those as U27 lands them unless a follow-up task directs otherwise') - this is that follow-up, called out by name by Mark Baber because those three tiles on the Log page still fall through to a plain <input type=number name=\"duration_min\"> requiring a hand-typed number, inconsistent with every other numeric quick-entry field on the page (U31, U34). Give each of the three remaining categories the same AnyPicker select-mode scroll-wheel treatment as Tummy Time, reusing entry.js's existing bindNumericWheel/rangeValues machinery (U31/U34) rather than inventing a new binding convention - generalize the current one-id-at-a-time wiring (bindTummyDurationWheel keyed off #tummy-duration) into something keyed off open_category for all four activity categories, rather than copy-pasting three more near-identical binding blocks. Step size for these three wheels is left to the implementer's judgement (the same latitude U31 gave Tummy Time's 1-minute step and U34 gave the growth/temperature ranges) since Mark Baber's request only requires that a wheel exists, not a specific step - a sensible default is fine, since U37 (settings-configurable increments, filed alongside this task) will make the step user-adjustable regardless of what's chosen here."
exit_criteria = ["Reading & Talking, Sensory Play, and Foreign Language activity panels each render duration_min as an AnyPicker select-mode scroll-wheel, not a plain number input, matching the existing Tummy Time treatment (route test per category)", "picking a value on each of the three wheels and saving posts through the existing duration_min parsing unchanged, persisting the picked value (route test per category)", "each converted field still submits a correct value with the picker script disabled or unloaded, via the underlying native number input, carrying U19/U22/U29/U31's no-JS contract forward (route test)", "quick-entry static payload is re-measured against the Q1 weight-budget test with any changed entry.js/quick_entry.html bytes, and either stays inside budget or the test is amended in the same diff with the new total recorded (test)"]
notes = "Implemented 2026-08-23. Replaced tummy-duration conditional with generic activity-duration input carrying data-category in quick_entry.html. Added wheel configs for reading_talking, sensory_play, and foreign_language (1-60 min step 1, default 15 min) to entry.js with ACTIVITY_DURATION_WHEELS map. Generalized bindTummyDurationWheel into bindActivityDurationWheel selecting wheel based on data-category. Route tests added in test_quick_entry.py covering scroll-wheel rendering, persistence, and no-JS fallback for all remaining activity categories. Quick entry payload remains within weight budget."

