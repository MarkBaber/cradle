description = "A session-facing toolkit for working this repo through Claude Code: a terminal cockpit/dashboard over tasks.toml and live agent panes (cockpit.py), a tasks.toml-driven backlog/task-graph CLI (backlog.py, list_tasks.py), ADR scaffolding and consistency checks (scripts/adr, check_adr.py), and the enforcement layer: a PreToolUse hook that refuses Edit/Write/file-modifying Bash in the primary checkout (worktree_guard.py, wired via .claude/settings.json), pre-commit/pre-push gates that run ruff/mypy/scripts/validate before letting a commit or push through, and a friction-signal capture + Stop-hook (friction.py) feeding scripts/retro.py's retrospective ladder. None of this touches src/cradle or the app's runtime; it only shapes how task work gets done."
