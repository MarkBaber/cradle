notes = "Provenance, not authorship: found already-built and untracked at the primary checkout (git status showed every file here as ??), evidently assembled over several prior sessions and never committed. It turns out to be a port of a sibling project's own dev-tooling -- the source is full of comments and identifiers naming a project called NightShift (src/nightshift/, nightshift.toml, a BacklogManager, an api.app module) that is not this repo. Most of it (backlog.py, cockpit.py's core dashboard, retro.py, friction.py, check_adr.py, worktree_guard.py) is generic over tasks.toml/ADRs/git refs and runs clean against cradle's real tasks.toml (scripts/validate, ruff check ., scripts/test.sh, scripts/lint.sh, scripts/check_layers.sh all verified green in this worktree). Four files were dropped entirely rather than adapted, because they are not a lint fix away from correct, they are wrong for this repo: scripts/install (a NightShift systemd deploy script -- creates a `nightshift` system user, installs nightshift.service units; cradle already has its own deploy path per O1, scripts/deploy/cradle.service), scripts/export_api_docs.py (documents NightShift's own nightshift.api.app surface, which does not exist here), scripts/check_backend_parity.py (diffs against src/nightshift/executor/agy_runner.py, which does not exist here), and scripts/git-guardrails/ (a NightShift-branded git wrapper duplicating what worktree_guard.py + .claude/settings.json already enforce for Claude Code sessions; env vars are literally named NIGHTSHIFT_GIT_GUARD_ROOT). Two files kept but hand-fixed: scripts/lint had `mypy --strict src/nightshift` (now src/cradle), scripts/test's --touched auto-target heuristic matched on `parts[1] == 'nightshift'` (now 'cradle') -- both one-line, both would have silently no-op'd or failed on this repo otherwise. cockpit.py itself still has scattered NightShift-specific help text and one nightshift.toml-reading helper (AG-06 model-family override) that will just find no such file here and no-op; left as-is since removing it is more surgery than this task's exit criteria require, flagged here so it isn't mistaken for cradle-native. Explicitly NOT attempted: the source comments cross-reference a task series DX-01 through at least DX-22 (cockpit.py, friction.py, retro.py, worktree_guard.py) that has no corresponding entries anywhere in this file -- most likely NightShift's own DX backlog, not cradle's, but either way not reconstructable from code comments alone without fabricating history. Filed here as one task (O4) instead, by explicit instruction. Also worth knowing: a since-deleted branch task/CP-01-cockpit-the-poll-tick-must-not-block-the (and a one-line stash on it) shared this file's subject -- test_cockpit.py's own docstring header reads 'CP-01: poll tick must not block the input loop' -- but a prior audit confirmed that branch carried no code beyond what's already in the cockpit.py committed here, only a superseded tasks.toml note; nothing was lost by deleting it. status=review rather than done because CI has never run against this content and 'CI is the sole arbiter' per this file's own header, even though every local gate is green."

