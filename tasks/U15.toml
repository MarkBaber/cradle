[[task]]
id = "U15"
phase = 1
title = "Prompt any unnamed device, not just the first install"
status = "done"
routing = "impl"
depends = ["U12"]
touches = ["src/cradle/routers/pages.py", "src/cradle/routers/templates/base.html", "src/cradle/routers/deps.py", "src/cradle/routers/static/app.css", "src/cradle/routers/api.py", "tests/routes/test_quick_entry.py", "tests/routes/test_alerts.py", "tests/routes/test_phase5.py", "tests/routes/test_device_name.py"]
description = "U12 put the device-name prompt on /settings, which the fresh-install redirect already reaches, so the first phone in a household is asked. A second phone joining a household that already has a profile is never asked: it logs rows with an empty logged_by until someone opens /settings, which is exactly the case D7 chose attribution for. Show a dismissable name-this-device banner on every page while the cookie is unset (base.html, so quick_entry/today/history all carry it), or gate / on the cookie - the gate rewrites the existing route tests, which is why U12 could not do it inside its touches. Second, non-latin-1 device names are currently collapsed to a space in post_device because Set-Cookie is latin-1 on the wire: percent-encode on write and decode in deps.device_name so a name in any script survives. Third, the attribution span U12 added to the history row has class=\"by\" and app.css has no rule for it, so it reads as undifferentiated body text: give it the same muted treatment as .note."
exit_criteria = ["a device with no cookie is prompted on a household that already has a profile (route test)", "the prompt does not reappear once the name is set (route test)", "a non-latin-1 device name round-trips to history intact (route test)", "existing route tests updated for the new behaviour, suite green"]
notes = "Still a plain label, no auth semantics (D7). Do not backfill rows already written with an empty logged_by. Filed as U15, not U14: U14 was taken by the Phase 6 milk-stock UI task that landed on main while this branch was open. Implemented as a dismissable banner in base.html (not a redirect gate): it checks request.cookies.get('device_name') directly and is suppressed on nav=='settings', so pages.py did not need touching. The original touches list omitted src/cradle/routers/api.py and tests/routes/test_device_name.py - post_device (the cookie-writing endpoint) lives in api.py, not pages.py, and the only pre-existing device-name tests live in test_device_name.py, not the three route-test files listed. Both were structurally required for the percent-encode-on-write fix and its test coverage; flagged to the user and approved before editing. test_alerts.py and test_phase5.py needed no changes (banner addition doesn't change any status code or existing assertion) so they were left untouched despite being in touches."

