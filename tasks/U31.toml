[[task]]
id = "U31"
phase = 1
title = "Scroll-wheel entry for volume_ml / duration_min fields, in fixed increments"
status = "done"
routing = "impl"
depends = ["U22", "U27"]
touches = ["src/cradle/routers/static/app.css", "src/cradle/routers/static/entry.js", "src/cradle/routers/templates/quick_entry.html", "scripts/vendor_assets.sh", "tests/routes/test_quick_entry.py", "tests/unit/test_weight_budget.py"]
description = "Raised by Mark Baber, 2026-08-22: the bottle panel's volume_ml and breast panel's duration_min (U22) are plain <input type=number> fields today, needing a number typed by hand even though only certain step values are ever meaningful. Replace both with a touch-friendly scroll-wheel control matching the iOS feel U22/U29 already established for time: volume_ml steps in 5ml increments, breast duration_min steps in 5-minute increments. U27 (Tummy Time, Reading & Talking, Sensory Play, Foreign Language tiles) adds further duration_min fields on the same page; of those, Tummy Time's duration_min steps in 1-minute increments instead of 5 - the others are unspecified by this request and can stay whatever U27 lands with unless directed otherwise. Prefer reusing the already-vendored, already-authorised AnyPicker/jQuery (U29) for these wheels if its shipped build actually supports a bare numeric/list wheel (check the real mode/option names against the vendored anypicker.min.js source, not assumed from docs - same caveat U29 and U30 both flag) rather than pulling in a second picker library; if AnyPicker's shipped build cannot do a plain numeric wheel, stop and flag that gap in this task's notes rather than silently vendoring something new, since SPEC 6 closes the dependency set and adding to it is an architect decision, not an implementer's call."
exit_criteria = ["the bottle panel's volume_ml is a scroll-wheel control offering only multiples of 5, and Save posts the picked value through the existing volume_ml parsing unchanged (route test)", "the breast panel's duration_min is a scroll-wheel control in 5-minute steps, same contract (route test)", "if U27 has landed by the time this is implemented, its Tummy Time duration_min is a scroll-wheel control in 1-minute steps, same contract (route test); if U27 has not landed, this criterion is deferred and flagged as a follow-on in this task's notes rather than silently dropped", "every converted field still submits a correct value with the picker script disabled or unloaded, via the underlying native number input, matching U19/U22's no-JS contract (route test)", "quick-entry static payload is re-measured against the Q1 weight-budget test, and either stays inside budget or the test is amended in the same diff with the new total recorded (test)"]
notes = "Depends on U22 for the panel/field markup this restyles and on U27 for the Tummy Time field this also covers - U27 is status=\"todo\" as of 2026-08-22 (not yet started), so if this is picked up first, implement the bottle/breast wheels now, explicitly defer the Tummy Time criterion, and leave a note here rather than blocking the whole task on U27. This bundles bottle+breast+tummy-time into one task, not three, on the same grounds U22's own notes gave for bundling its four changes: all of them touch quick_entry.html/entry.js/app.css and their tests, and a second pass over the same files per field is exactly what CLAUDE.md's touches rule exists to avoid. Do not widen scope to volume/duration fields U27 might add beyond Tummy Time (Reading & Talking, Sensory Play, Foreign Language are duration-only with no increment specified here) - leave those as U27 lands them unless a follow-up task directs otherwise. 2026-08-22: implemented. Confirmed AnyPicker's shipped source supports mode: \"select\" with custom dataSource and components (reusing bindNumericWheel). (1) Bottle panel's volume_ml is bound via bindBottleVolumeWheel to BOTTLE_VOLUME_WHEEL (rangeValues(5, 500, 5), 5ml increments), saving through existing volume_ml parsing unchanged. (2) Breast panel's duration_min is bound via bindBreastDurationWheel to BREAST_DURATION_WHEEL (rangeValues(5, 120, 5), 5-minute steps), saving through existing duration_min parsing unchanged. (3) U27's activity panel and Tummy Time category landed in tree; Tummy Time duration_min is bound via bindTummyDurationWheel to TUMMY_DURATION_WHEEL (rangeValues(1, 60, 1), 1-minute steps), saving through existing duration_min parsing unchanged. (4) No-JS contract verified: all converted fields submit correctly without JS via underlying native number inputs. (5) Weight budget: quick-entry payload stays comfortably within budget; test_weight_budget passes unmodified. 4 new route tests added to tests/routes/test_quick_entry.py. All 456 tests green under ./scripts/test, python3 scripts/backlog.py OK."

