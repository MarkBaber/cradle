description = "Raised by Mark Baber, 2026-08-23. This is a known, previously-documented gap, not new scope: U18 (done) shipped the Dirty panel's Colour select but its own notes record exit criterion 4 ('dirty nappy logged with colour and consistency end to end') as never actually closed - 'consistency capture is not in the Dirty panel'; U21 later closed the service-side half U18 was blocked on (log_nappy(consistency: StoolConsistency = StoolConsistency.UNSET) already exists in logging_service.py, and EventsRepo.EDITABLE['nappy'] already allows the 'consistency' column, per U21) but nobody ever finished the router+template half, so today quick_entry.html's Dirty panel (open_panel=='nappy' and open_kind=='dirty') still renders only a Colour <select> and a Time field - there is no way to enter consistency when a dirty nappy is first logged; it can only be set afterwards via the history table's inline edit (U26). Add a Consistency <select> to the Dirty panel, positioned with Colour (matching the existing Colour select's markup/label shape), using the exact same option list/vocabulary already in production for this exact field at _history_table.html's 'Set consistency' select (unset/sticky/seedy/soft/formed/runny/hard/mucousy - StoolConsistency's vocabulary, models/enums.py) so the two places a parent can set this value never drift into two different label sets. Wire it through: api.py's post_nappy needs a new `consistency: Annotated[str, Form()] = StoolConsistency.UNSET.value` parameter parsed the same way stool_colour already is on the line above it, passed into the existing `svc.logging.log_nappy(k, StoolColour(stool_colour), StoolConsistency(consistency), ...)` call - log_nappy's consistency kwarg already exists (U21) and is not touched here, so this is an additive Form parameter on post_nappy exactly like U34's ts additions, not a change to any existing contract requiring architect sign-off."
exit_criteria = ["the Dirty nappy panel on the Log page renders a Consistency select alongside Colour, with the same option vocabulary as the history table's existing 'Set consistency' control (route test)", "logging a dirty nappy through the panel with a chosen consistency persists that value end to end, read back from the row it created (route test)", "logging a dirty nappy through the panel with consistency left at its default still saves successfully as unset, regression-covering U18's original 'no field is required' contract (route test)", "the Wet panel is unchanged - no colour or consistency control appears there (regression test)", "the panel's Consistency select still submits correctly with the picker script disabled or unloaded, via the plain native <select>, carrying U18's no-JS contract forward (route test)"]
notes = "Closes the exact gap U18's own notes (2026-08-21 status-review entry) and U26's notes both already named and left open - see U18 notes ('consistency capture is not in the Dirty panel and cannot be added without either widening touches into services/repos or U21 landing first... Recommend sequencing U21 before this moves to done') and U26 notes ('U18 owns the consistency control on the entry side'). U21 (closing the service/repo half) has since landed, done, so the only remaining work is exactly the router+template half U18 could not reach within its own touches - this task exists so that work has a task id rather than continuing to sit undone inside an already-closed U18. Do not touch logging_service.py or events_repo.py: both already support consistency end to end (U21) and are deliberately outside this task's touches. Filed by Mark Baber, 2026-08-23, alongside U38 (History page grouping/gating/wheels) - related but independent; see U38's notes for the split rationale."

