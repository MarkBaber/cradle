description = "Raised by Mark Baber, 2026-08-21: the Log page should offer four more things worth tracking in early weeks, none of them feeds/nappies/sleep/growth/temperature/milestones/notes - developmental activities measured in minutes rather than volume or count. Add an `activity` domain: ActivityEvent (ts, category, duration_min, note, plus the shared logged_by/created_at/edited_at/deleted_at columns) and a closed ActivityCategory StrEnum with four members - tummy_time, reading_talking, sensory_play, foreign_language - stored by .value like every other enum. Register the table in EDITABLE with a column allow-list, same shape as M1's expression/milk_batch. Alongside the schema, add a new `[activity_targets]` table to rules_config.toml carrying the best-practice guidance text the Log page (U27) will display next to each category - this is informational copy for a parent, not an alert condition (no severity, no Finding, no messages.py entry), but it is exactly the kind of best-practice claim CLAUDE.md reserves for architect sign-off, the same reasoning U17 gave for stool-consistency vocabulary. Proposed starting values, for the architect to accept, edit or replace before this lands: tummy_time = \"Start at 1-2 min, build to 10-15 min, several short sessions across the day\"; reading_talking = \"15-20 min cumulative per day\"; sensory_play = \"1-2 brief sessions of 2-5 min\"; foreign_language = \"10-15 min cumulative per day of dedicated exposure (talking, singing, reading), folded into the same little-and-often pattern as reading_talking\" - this last figure is this task's own suggestion, not a cited NHS/NICE value like the rest of SPEC 2's domain table: NICE has no published newborn foreign-language-exposure guideline, so the reasoning offered is general early-language-acquisition practice (consistent short daily exposure matters more than session length at this age), and it needs explicit verification rather than silent acceptance. Document the new domain in SPEC 2's domain table and add a short schema paragraph to SPEC 5.3, matching how M1 documented milk_batch."
exit_criteria = ["ActivityCategory: closed StrEnum, four members (tummy_time, reading_talking, sensory_play, foreign_language), stored by .value (test)", "ActivityEvent round-trips through EventsRepo for every category (test)", "migration applies cleanly on an existing database and is recorded in schema_version (test)", "activity registered in EDITABLE with a column allow-list; a column outside it is rejected (test)", "[activity_targets] added to rules_config.toml with one entry per ActivityCategory member; a config-load test asserts all four keys present", "mypy strict green on touched files"]
notes = "Architect-routed for the same two reasons as M1: it adds a public dataclass and a closed enum (contracts under CLAUDE.md), and it amends SPEC 5.3/5.2-adjacent content - here rules_config.toml, not the schema. Keep the [activity_targets] table separate in spirit from the file's clinical-threshold tables even though it lives in the same file: these numbers gate nothing and fire no alert, they are display copy, so a future settings-page writer for them (mirroring U22's [entry_defaults] pattern) would still need the same architect-only carve-out entry_defaults deliberately does NOT need, because unlike bottle_volume_ml these are the health-guidance values themselves, not a UX convenience default. If a later task wants to alert on a missed activity (e.g. no tummy time logged today), that is a new alerts/ rule with its own severity and messages.py copy - out of scope here and not implied by adding the targets. Migration numbering: P3 owns 0002 (not yet landed) and 0003/0004 are already taken by M1/U17 - check the migrations/ directory before writing the file and take the next free number (0005 at time of writing); do not renumber existing files, the runner tracks by filename, not ordinal. IMPLEMENTATION 2026-08-22, status review: gates green (407 tests, ruff, mypy strict, check_layers). ONE QUESTION FOR THE ARCHITECT, the only thing blocking merge - the three cited targets landed verbatim from this description, but activity_targets.foreign_language carries an explicit UNVERIFIED marker in rules_config.toml and needs an accept/edit/replace, since as this description itself warned there is no NICE newborn foreign-language-exposure guideline behind it and it rests on general early-language-acquisition reasoning. Two deviations recorded rather than silently taken: models/__init__.py is outside touches so it was left alone, which means events_repo.py imports ActivityCategory/ActivityEvent from the submodules instead of the package root and new follow-up task M3 folds them in - the same shape U17 left for StoolConsistency and U21 cleared; and ADR 0014 was written outside touches, matching U17/ADR 0012. Also found, unrelated and untouched: scripts/validate_tasks.py already fails on main with 'G1 is done but depends on unfinished R4' (committed at 6423bba), which also trips the pre-bash hook - an architect call, not fixed here."

