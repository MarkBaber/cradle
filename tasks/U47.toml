[[task]]
id = "U47"
phase = 1
title = "Radial quick-entry: drag-to-select dial as an alternate to the button grid, sized for one-thumb use on a phone"
status = "done"
routing = "impl"
depends = ["U1", "U29"]
touches = [
    "src/cradle/routers/pages.py",
    "src/cradle/routers/templates/quick_entry_radial.html",
    "src/cradle/routers/templates/quick_entry.html",
    "src/cradle/routers/templates/base.html",
    "src/cradle/routers/static/app.css",
    "src/cradle/routers/static/radial.js",
    "tests/routes/test_radial_entry.py",
    "tests/unit/test_weight_budget.py",
]
description = "Filed by Mark Baber, 2026-09-02: add another version of the logging page that uses a radial menu instead of buttons, large enough that on a smartphone it is easy to drag to select a logging type (feed, mess, etc). quick_entry.html (U1, extended since by U18/U22/U27/U29/U42 and others) is a button-grid page at \"/\", organised into Feed/Mess/Sleep/Milk/Activity/More sections covering 14 distinct one-tap actions, each opening the shared `#panel` overlay via a `?panel=<domain>&...` query param (hx-get, hx-select=\"#panel\", hx-target=\"#panel\") built by pages.py's `_open_panel()`. That mechanism, and every panel form and POST target it opens (/api/feed, /api/nappy, /api/sleep/toggle, /api/express, /api/activity, /api/growth, /api/temperature, /api/milestone, /api/note, /api/edit-*, /api/delete), is unchanged by this task and must be reused, not duplicated. What's new is the top of the page: a radial dial control - a circle divided into wedges, one per logging type - big enough that a thumb can press down anywhere on the dial and drag to the wedge it wants before releasing, which is the \"drag to select\" gesture the request names specifically (the existing button grid already covers tap-to-select, so this is not that). If the `#panel` overlay markup needs to move out of quick_entry.html into a shared partial so the new template does not duplicate it, that refactor is in scope and is why quick_entry.html is listed in touches alongside the new template. No new dependency: D1 pins FastAPI+HTMX+Alpine with no build step and the dependency set is closed (SPEC 6), so a JS radial/pie-menu library is out of scope - the dial (wedge geometry, hit-testing, the press-drag-release gesture) must be hand-rolled in the app's own JS/CSS/SVG, the same house pattern already used for other hand-rolled visuals (V4's growth chart, U42's trophy grid) rather than a new vendored bundle. Three design points deliberately left open, to be recorded in notes once decided: (1) route shape - a new path (e.g. GET /log/radial) alongside \"/\", or a toggled alternate rendering of \"/\" itself; either way both versions must link to each other visibly, since this is 'another version of the logging page', not a replacement; (2) with 14 existing actions, whether every one sits on a single ring or the dial groups into an outer ring of domains (Feed/Mess/Sleep/Milk/Activity/More) that expands to a second ring on selection - implementer's call, but every action reachable from \"/\" today must stay reachable from the radial version too, none silently dropped; (3) whether the button-grid-vs-radial choice persists across visits (e.g. a cookie alongside the existing device_name one) or is chosen fresh each visit via the switch link - implementer's call."
exit_criteria = [
    "every logging action currently reachable from the button grid on \"/\" (breast, bottle, wet, dirty, sleep toggle, express, the four activity categories, growth, temperature, milestone, note) is reachable from the new radial page, opening the identical #panel form/POST flow quick_entry.html already uses rather than a parallel form implementation (route test enumerating each wedge's target panel/action)",
    "the radial page and the button-grid page link to each other, so a visitor can switch between the two logging-page styles (route test: both pages expose a link/control to the other)",
    "the dial's press-drag-release gesture is implemented with pointer/touch events (pointerdown/pointermove/pointerup or equivalent touch handlers), not click-only, so a press-and-drag genuinely selects a wedge before release confirms it (source-inspection test, matching the existing style tests/unit/test_weight_budget.py already uses for entry.js behaviour)",
    "the dial sizes itself to the viewport (e.g. a vmin-based diameter) rather than a fixed small pixel size, and each wedge's touch target is at least the WCAG 2.5.5 minimum of 44x44 CSS px at a 375px-wide reference viewport, computed from the CSS-declared geometry (test)",
    "no new third-party dependency and no new vendored asset is added - the dial is hand-rolled JS/CSS/SVG; pyproject.toml is unchanged and no new file appears under static/vendor/ (test)",
    "the radial page's own static payload (any new/changed bytes in radial.js and app.css) is measured against a weight-budget test mirroring Q1's tests/unit/test_weight_budget.py pattern, so this alternate page cannot silently balloon page weight either (test)",
    "every new control still degrades to something navigable with the radial/picker script disabled or unloaded (at minimum a plain link list to each panel), in the spirit of the app's established no-JS contract (U19/U22/U29/U31), even though the drag gesture itself is inherently JS-only (route test)",
    "scripts/test.sh, scripts/lint.sh, scripts/check_layers.sh green, and tasks.toml updated in the same diff",
]
notes = "Filed by Mark Baber, 2026-09-02: 'add another version of the logging page that uses a radial menu instead of buttons...'. Design decisions recorded: (1) Route shape: GET /radial alongside GET / with bidirectional links on both pages. (2) Ring grouping: Single 14-wedge dial ring grouped visually by section colors (feed, mess, sleep, milk, activity, more) allowing 1-gesture drag selection of any action. (3) Persistence: View switch link allows seamless navigation between grid and radial views with route state preserved across panel interactions."
