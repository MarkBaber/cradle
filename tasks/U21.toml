[[task]]
id = "U21"
phase = 1
title = "Wire StoolConsistency into the service, edit and export surfaces"
status = "done"
routing = "impl"
depends = ["U17"]
touches = ["src/cradle/models/__init__.py", "src/cradle/services/logging_service.py", "src/cradle/repos/events_repo.py", "src/cradle/services/export_service.py", "tests/unit/test_logging_service.py", "tests/unit/test_repos_edit.py", "tests/unit/test_export.py"]
description = "U17 defines StoolConsistency and round-trips it through EventsRepo, but its touches list stopped at the repo, so three seams downstream of the column are still unaware of it. First, the enum is not re-exported from cradle.models: models/__init__.py lists every other enum in both its import block and __all__, and events_repo.py has to reach into cradle.models.enums directly, which no other caller does. Second, LoggingService.log_nappy takes kind and stool_colour only, so POST /api/nappy has nothing to pass a consistency to - U18's 'dirty nappy logged with colour and consistency end to end' criterion cannot be met until it does. Third, EDITABLE['nappy'] in events_repo.py is frozenset({'ts','kind','stool_colour'}), so edit_event rejects consistency and the U10 post-hoc edit path cannot correct it."
exit_criteria = ["StoolConsistency importable from cradle.models and present in __all__, with events_repo.py importing it from there like every other enum", "LoggingService.log_nappy accepts a consistency argument defaulting to StoolConsistency.UNSET and persists it (test)", "consistency is in EDITABLE['nappy'] and edit_event can change it (test)", "nappy CSV header is identical whether or not the table has rows (test)"]
notes = "The CSV criterion is the one with a trap in it. export_service._csv_header builds the empty-table header as id, baby_id, ts, logged_by, *sorted(EDITABLE[domain] - {'ts'}), created_at, edited_at, deleted_at, while the populated-table path uses list(rows[0]), which is physical column order. Those agree for nappy today only by luck: sorted({'kind','stool_colour'}) happens to match. Adding 'consistency' breaks the agreement, because ALTER TABLE appends the column after deleted_at while sorted() puts it first - so the header change has to land in the same diff as the EDITABLE change, not after it. Nothing here is a clinical decision: U17 settled the vocabulary and the ADR records it (docs/adr/0012). Do not add an alert rule against consistency - that is A8 and needs messages.py copy."

