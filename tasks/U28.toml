[[task]]
id = "U28"
phase = 1
title = "Modal panels for the last four entries: weight, temperature, milestone, note"
status = "done"
routing = "impl"
depends = ["U22"]
touches = ["src/cradle/routers/pages.py", "src/cradle/routers/templates/quick_entry.html", "src/cradle/routers/static/app.css", "tests/routes/test_quick_entry.py"]
description = "Raised by Mark Baber, 2026-08-21: entry should never require scrolling to reach a form on a phone. U22 already gives Feed and Mess (Breast/Bottle/Wet/Dirty) a centred modal overlay with a dimmed backdrop, and Breast's L/R side picker is already the toggle-button pattern this same request asks for - both land with U22, not new work here. The gap is the four fields still living under the <details class=\"more\"> disclosure at the bottom of quick_entry.html: weight/length/head_circ (growth), temperature, milestone and note. Today opening that disclosure pushes four bare inline forms into the page flow below the fold - exactly the scrolling U22 already removed for the other four entry types. Give each of the four its own small tile (matching the existing .big tile grid's visual language, sized for a thumb) under a 'More' heading, and move its form verbatim into the same #panel modal overlay U22 built - reusing .overlay/.overlay-backdrop/.modal/.modal-close and the existing hx-get panel=/method=/kind= query-param convention, extended with a panel value per field (e.g. panel=growth, panel=temperature, panel=milestone, panel=note). Remove the <details> element once all four are converted; POST targets and field sets are unchanged, only presentation moves from inline-in-flow to modal."
exit_criteria = ["each of growth, temperature, milestone and note opens as a centred modal overlay from its own tile tap, not inside the <details> block, which no longer exists in the template (route test)", "each panel's Save still persists via its existing /api/growth, /api/temperature, /api/milestone or /api/note endpoint with the same fields as today (route test)", "closing any of the four panels without Save writes no row, matching U16's abandoned-panel contract (route test)", "every panel stays reachable and submittable with JS disabled, per U18's no-JS fallback contract (route test)", "quick-entry static payload is re-measured against the Q1 weight budget with the new tile/panel markup, and either stays inside it or the budget test is amended in the same diff with the new total recorded (test)"]
notes = "Depends on U22 for the modal/overlay CSS and the panel-routing convention in pages.py's _open_panel this task extends - do not duplicate that machinery. Do not touch models/services/repos or add new endpoint fields: this is presentation-only, moving four existing forms from inline to modal, not a new capability. If U22 is still status=\"review\" when this is picked up, treat its current tree state (overlay/modal CSS, _open_panel shape) as the contract, same caveat V2/V4 already gave against M1/M2. Out of scope, flag as a follow-on if wanted: adding a time-of-entry field to growth/temperature/milestone/note - none of them take one today (unlike breast/bottle/nappy) and adding one is a new field, not a presentation change. 2026-08-21: implemented. _open_panel in pages.py gained one new branch (`if panel in _MORE_PANELS: return panel, \"\", \"\"` for growth/temperature/milestone/note - no method/kind needed, unlike feed/nappy), not a parallel mechanism. quick_entry.html: four new .big tiles under a new 'More' <h2> (plain .big, no colour modifier, matching the existing .express tile's precedent of an uncoloured tile), and four new {% elif %} branches inside the existing #panel modal reusing .stack.panel/hx-post/hx-target=#toast exactly like the feed/nappy panels; the <details class=\"more\"> block is deleted entirely. Field names/required-ness are verbatim from the old inline forms (measure/value/source for growth, temp_c for temperature, category/title for milestone, text for note) - api.py is untouched. app.css only lost the two now-dead details.more rules (net -188 bytes); .row/.row>* kept since milestones.html still uses .row. Q1 budget: tests/unit/test_weight_budget.py passes unmodified (app.css shrank, no new static assets - template markup isn't counted in the budget), so no amendment was needed. tests/routes/test_quick_entry.py: 4 new tests (test_more_details_element_is_gone_and_each_more_panel_opens_as_a_modal_overlay, test_each_more_panel_save_persists_via_its_existing_endpoint_end_to_end, test_closing_a_more_panel_without_saving_writes_no_row, test_every_more_panel_stays_reachable_and_submittable_with_js_disabled), one per exit criterion; verified failing against the pre-diff tree, passing after. ./scripts/test.sh (385 passed), scripts/lint.sh and scripts/check_layers.sh green, python3 scripts/backlog.py OK (78 tasks, acyclic). Reviewed by house-reviewer (no blocking findings) and criteria-auditor (all five exit criteria independently verified met, touches scope clean - exactly the four allowed files changed). Held at review, not done, per CLAUDE.md - only CI and a human reviewer make that call."
