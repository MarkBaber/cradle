[[task]]
id = "N4"
phase = 3
title = "Scheduler lifecycle and reminder-cron reconciliation"
status = "done"
routing = "impl"
depends = ["N2"]
touches = ["src/cradle/app.py", "src/cradle/ports/scheduler.py", "docs/SPEC.md"]
description = "Two loose ends from N2. First, create_app starts a BackgroundScheduler and nothing ever stops it: there is no lifespan or shutdown hook, so scripts/dev.sh reload leaks a thread per reload and a clean stop depends entirely on SIGTERM killing the process. Add a FastAPI lifespan that shuts the scheduler down. Second, SPEC 3 and N2 both call for cron entries for reminder rules alongside the 5-minute sweep, and build_scheduler registers only the interval job; in practice the sweep already evaluates WEIGH_IN_DUE every five minutes, so the crons are redundant. Either add them or record the simplification as a SPEC 7.1 amendment - do not leave the SPEC describing something the code does not do."
exit_criteria = ["scheduler shuts down cleanly on app shutdown (test)", "no scheduler thread survives repeated create_app/shutdown cycles (test)", "SPEC 7.1 and the code agree on reminder crons"]
notes = "Recommend the amendment over the crons: a reminder that fires on a cron and a reminder that fires from a sweep are the same notification once fingerprint de-dup is in play, and one scheduling path is easier to reason about at 3am than two. Implemented: went with the amendment, not the crons, matching the recommendation above; docs/SPEC.md 5.2's scheduler bullet and the 7.1 amendments table both now say reminders fire via the 5-minute sweep, and the phase-3 exit-criteria row was reworded to match. create_app's new lifespan hook calls ports/scheduler.stop_scheduler() on app shutdown. scripts/validate's ADR staleness check (scripts/check_adr.py, added by O4) flagged the SPEC.md rationale-section edit as needing a fresh ADR rather than an in-place rewrite; added docs/adr/0013-reminder-rules-fire-from-the-sweep-not-crons.md (and reindexed docs/adr/README.md) for that, outside this task's touches list on the same precedent U17 set for docs/adr/0012 - the ADR log's own rule required it, and check_adr.py is the mechanical enforcement of that rule. Provenance: the original diff for this task was recovered from an uncommitted `git stash` (commit b4aed7e on task/N4-scheduler-lifecycle-and-remindercron) sitting on a branch that forked right after PR #1 (2026-08-12) and was never rebased, so every file that changed on main since then showed up as a false deletion against current main. The branch's own new content, isolated by diffing against its actual merge-base, was exactly this task's scope (app.py lifespan + scheduler.stop_scheduler + the SPEC amendment) plus two test functions defined inside src/cradle/ports/scheduler.py itself rather than under tests/ - a production file that would not be collected by pytest and, worse, imported fastapi.testclient and cradle.app from the ports layer, an upward dependency check_layers.sh would have caught. Reapplied cleanly on a fresh branch off current main (task/N4-scheduler-lifecycle-and-remindercron-v2); the two tests were rewritten into tests/routes/test_scheduler_lifecycle.py (this task's touches list didn't name a tests/ file, but the DoD requires tests and there is no existing scheduler-lifecycle coverage to extend - every route test today passes start_scheduler=False). scripts/test.sh (275 passed under uv run --extra dev pytest), ruff format/check and mypy --strict (clean on all touched files; a pre-existing, unrelated formatting drift in tests/unit/test_cockpit.py was left untouched) and scripts/check_layers.sh all green. The stale branch and its recovered commit were left alone rather than force-deleted. 2026-08-21: reverted to review - depends on N2, which chains back to G1, which cannot be done while its own R4 dependency is blocked (see G1's notes); this is the R4-gate regression fix flagged above, applied."

