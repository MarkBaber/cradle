[[task]]
id = "U40"
phase = 1
title = "Concise day-grouped activity summary (augment /history or a new page)"
status = "done"
routing = "impl"
depends = ["U4"]
touches = [
    "src/cradle/services/history_service.py",
    "src/cradle/routers/pages.py",
    "src/cradle/routers/templates/history.html",
    "src/cradle/routers/templates/_history_table.html",
    "src/cradle/routers/templates/day_summary.html",
    "src/cradle/routers/templates/base.html",
    "src/cradle/routers/static/app.css",
    "tests/routes/test_history_summary.py",
]
description = "Raised by Mark Baber, 2026-08-23: /history (U4) lists every logged event as a single flat table - one row per event, each row repeating its own full date+time and mixing the activity type into a free-text detail column via 'Set time'/'Set ml'/'Delete' edit forms. There is no concise, read-at-a-glance summary of a given day's activity. Add one: either augment /history, or add a new page, so that events are grouped under a heading per calendar day (newest day first; ordering within a day is chronological), and each event within a day renders as a compact row of just time, activity, and a short detail string - e.g. under a '23 Aug' heading: '6:20   Feed   Bottle Expressed   60 ml'. history_service.py already builds a per-event detail string per domain (HistoryRow.detail, e.g. 'bottle_expressed, 60 ml') for every domain in DOMAINS (feed, nappy, sleep, growth, temperature, milestone, note) - reuse that construction rather than duplicating it; this task only needs a day-grouping wrapper around HistoryService.rows() (or a new method alongside it) and a template that renders per-day sections instead of one continuous table, plus - if 'activity' and 'detail' should render as separate columns per the example (Feed | Bottle Expressed | 60 ml, not one merged string) - splitting HistoryRow.detail into a distinct activity/kind label and a remaining detail string, implementer's judgement on the cleanest way to do that without disturbing HistoryRow's existing consumers (_history_table.html's tag span already renders r.table as a separate element and could be a starting point). Whether to replace /history's existing table outright, add this as a second view/toggle on the same page, or ship it as its own page reachable from the tabbar is left to the implementer, per Mark Baber's own 'either... or' framing - but /history's existing inline-edit affordances (Set time, Set ml/min, Set colour/consistency, Delete, the combined date+time picker) must keep working somewhere in the app after this lands, since U4/U26/U28/U29 built real correction workflows on top of them; nothing in this task should regress those, only add a concise, read-oriented summary alongside them. Note U38 (status=\"todo\" as of 2026-08-23, filed the same day, PR #69) also touches _history_table.html/history_service.py to group same-timestamp rows and gate/seed its inline-edit forms - that is a narrower, edit-focused change; this task is the broader read-oriented daily-summary view. If U38 lands first, build this on top of its grouping/gating rather than duplicating it; if this lands first, U38 should adapt to whatever HistoryRow shape this task leaves behind."
exit_criteria = ["a page (either /history augmented, or a new route) renders every logged event grouped under a heading per calendar day, most recent day first (route test)", "within a day, each event renders as a compact time / activity / detail row - e.g. '6:20  Feed  Bottle Expressed  60 ml' - covering every domain history_service.DOMAINS already surfaces (route test)", "rows within a day are ordered by time (route test)", "if implemented as a new page: it is added to base.html's tabbar and follows the existing first-run-with-no-profile redirect pattern every other page uses (route test)", "if implemented by augmenting /history: the page's pre-existing inline-edit forms (adjust-time, edit-field, delete) and every existing route test asserting on /history's rendered text keep passing unchanged (regression)", "scripts/test.sh, scripts/lint.sh, and scripts/check_layers.sh green"]
notes = "Filed by Mark Baber, 2026-08-23. Deliberately leaves 'augment vs new page' and 'split activity/detail into separate columns vs keep HistoryRow.detail as one string' to the implementer, mirroring the latitude already given in U31/U34/U36 for bounds/step choices - these are presentation choices, not clinical values, so no architect sign-off is needed either way. See notes on the U38/U39 relationship above; coordinate with whichever of U38/U40 lands second."

