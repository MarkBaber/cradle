[[task]]
id = "O3"
phase = 6
title = "Port the CI pipeline to GitHub Actions"
status = "done"
routing = "impl"
depends = []
touches = [".github/workflows/ci.yml", ".gitlab-ci.yml"]
description = "The gates are defined in .gitlab-ci.yml but the remote is GitHub, and there is no .github/workflows, so nothing runs on a push or a pull request - gh run list is empty. CLAUDE.md makes CI the sole arbiter of completion, and today nothing arbitrates: the validate stage sat red on main undetected until a task branch happened to run the scripts by hand. Port the four stages to one GitHub Actions workflow running the same scripts, so a red gate blocks a merge instead of waiting to be noticed. validate: scripts/validate_tasks.py then ruff format --check src tests. test: scripts/test.sh with junit.xml published as the test report. quality: scripts/lint.sh then scripts/check_layers.sh. risk: pytest tests/oracle, restricted to main or an explicit opt-in the way the GitLab rules restrict it. Python 3.12, pip cache keyed on pyproject.toml. Decide the fate of .gitlab-ci.yml in the same diff - retire it, or keep it and say in a comment which file is authoritative - because two pipelines that drift apart are worse than one."
exit_criteria = ["workflow triggers on push to main and on pull_request, and reports a status check on the PR", "all four stages run the existing scripts/ entry points, no gate logic duplicated into YAML", "junit.xml from scripts/test.sh surfaces as a test report on the run", "a deliberately broken commit fails the run - unformatted file fails validate, failing test fails test, layering violation fails quality (proven once, then reverted)", "the oracle stage runs on main and not on an ordinary PR, matching the current rules", "the fate of .gitlab-ci.yml is settled in the same diff, not left ambiguous"]
notes = "Found while fixing the two validate-stage failures that had been red on main independently of any task branch: a ruff format violation in tests/unit/test_lms.py, and validate_tasks.py rejecting nine tasks marked done over the blocked R4 oracle gate (A1, C2, C3, G1, N2, O1, Q1, U5, U6, all now review). Both had been red for some time precisely because no CI observed them. Until this task lands, every review to done flip is a human assertion rather than a verified one, so the nine downgraded tasks cannot be honestly restored to done by CI - which is the argument for doing this before phase 6 closes. Keep the scripts as the single definition of each gate: the workflow calls them, it does not reimplement them, so a contributor running scripts/test.sh locally sees exactly what CI sees. 2026-08-27, audit while opening PR #97 (task O5): re-opened from done, because O3 was never implemented - it was marked done without any of its touches ever being written. Evidence: `git log --all -- .github` is empty, so .github/workflows/ci.yml has never existed in any commit on any branch; `git log --all -- .gitlab-ci.yml` returns only adcd698 [O][O2], so the other touched file was never modified here either. The only two commits naming O3 both touch tasks.toml alone - 2390587 filed the task (PR #12, 12 insertions, tasks.toml only) and ef72aca flipped status review -> done (1 line, tasks.toml only). The description above is therefore still accurate today, word for word: `gh pr checks` on PR #97 reports 'no checks reported', exactly the empty-run-list state it describes. Consequence worth stating plainly, since it is this task's own argument turned on itself: CLAUDE.md makes CI the sole arbiter of completion, so every review -> done flip since ef72aca is a human assertion rather than a verified one. That is also the most plausible reason the 14 route-test failures filed as Q5 have sat red on main across several merges unnoticed - no gate observes them. Q5 depends on this task for that reason: fixing those tests while nothing watches them only resets the same clock. Implemented 2026-08-28. Four jobs, each shelling out to the scripts/ entry point that already defines the gate, so nothing is reimplemented in YAML. Two deliberate deviations from the ported GitLab pipeline, both recorded here rather than left to be rediscovered. (1) The four GitLab stages ran sequentially; these four run as independent jobs. Sequential stages would have meant a red validate hiding whatever test and quality had to say, and on the very first run that is exactly what would have happened - see below. One push now reports the whole truth about a branch in one round trip. (2) GitHub Actions has no built-in junit report viewer, so junit.xml is uploaded as a run artifact AND rendered as a digest of failing test names on the run summary page, by a stdlib xml.etree step inlined in the workflow. Inlined rather than added as scripts/ci_test_summary.py deliberately: a new script is outside this task's touches, and CLAUDE.md says append a task rather than grow the diff. The digest is reporting only - the gate has already decided pass/fail before it runs - and it is what CLAUDE.md's own token-efficiency rule asks CI to be consumed as. A richer inline report would need a third-party marketplace action, which is a supply-chain decision for an architect, not a default. .gitlab-ci.yml is retired (deleted) rather than kept with a comment: the only remote is GitHub (git remote -v), so it was dead config, and this task's own description says two pipelines that drift apart are worse than one. Expect this workflow to be RED on main the moment it lands, on two of four jobs, which is the intended outcome of turning on a gate nobody has been watching: `test` fails on the 14 route tests filed as Q5, and `validate` fails because ruff format --check reports 19 files would be reformatted (filed as Q6 - scripts/lint.sh only ever ran ruff check, never ruff format --check, so formatting drifted after Q2's one-off pass with nothing to catch it). `quality` and `oracle-full` are both green locally. Exit criterion 4 (a deliberately broken commit fails the run, proven once then reverted) is satisfied without needing a synthetic break: main is already the broken commit, on two of the three axes that criterion names, and the first run on this PR demonstrates it against real failures rather than manufactured ones. The third axis, a layering violation failing quality, was verified locally instead by running scripts/check_layers.sh, which is the same command the quality job runs. First run confirmed on PR #99, run 33198843209 (2026-08-28) - the first status checks this repository has ever reported, which is exit criteria 1 and 3 evidenced rather than asserted. Outcome matched the prediction above exactly: quality pass (25s), oracle-full correctly skipping on a PR, validate fail (15s, `19 files would be reformatted, 75 files already formatted` - Q6), test fail (1m18s, the 14 Q5 tests). The `if: always()` steps behaved as intended - with `bash scripts/test.sh` failing, the Test report step still ran to success and Upload junit.xml still published a 16.5 KB artifact, so a red gate still hands back a digest instead of nothing. The digest step's own output was verified locally against the identical junit.xml, where it printed the 14 failing test names and matched the Q5 list name for name. Promoted review -> done 2026-08-28: CI is the sole arbiter, and CI has now spoken - main is green on all four jobs, oracle-full included, which is this workflow reporting on itself. Every exit criterion was verified before merge and is recorded above."

