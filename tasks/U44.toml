[[task]]
id = "U44"
phase = 1
title = "Baby journal: stories & temperament entries, with photos and a curated HTML 'book' export"
status = "done"
routing = "impl"
depends = ["P1", "P2", "V1", "X1"]
touches = [
    "src/cradle/models/events.py",
    "src/cradle/models/__init__.py",
    "src/cradle/repos/migrations/",
    "src/cradle/repos/events_repo.py",
    "src/cradle/services/journal_service.py",
    "src/cradle/services/export_service.py",
    "src/cradle/services/__init__.py",
    "src/cradle/routers/deps.py",
    "src/cradle/app.py",
    "src/cradle/routers/pages.py",
    "src/cradle/routers/api.py",
    "src/cradle/routers/templates/journal.html",
    "src/cradle/routers/templates/journal_book.html",
    "src/cradle/routers/templates/base.html",
    "tests/unit/test_journal_service.py",
    "tests/unit/test_repos.py",
    "tests/unit/test_export.py",
    "tests/routes/test_journal.py",
    "tests/unit/test_weight_budget.py",
]
description = "Raised by Mark Baber, 2026-08-24: add a way to record freeform stories and observations about the baby's temperament/personality - the kind of thing a parent wants to look back on later, not a clinical log - with photos attached, and a way to export a hand-picked selection of these as a single shareable HTML 'book'. No existing domain fits: Milestone (models.Milestone, category='first', free-text title, SPEC 5.1/5.4) is for one-off firsts, not ongoing reflective writing, and Note (models.Note: text + tags, P1) has neither a title nor any attachment concept, and its history-page edit panel (U28, U43) is keyed to a fixed set of six quick-entry categories that a new writing surface should not be shoehorned into. Add a new domain instead: `JournalEntry` (ts, title, story - the freeform text - and temperament, a tuple[str, ...] of free-text descriptor tags mirroring Note.tags's shape, e.g. 'giggly', 'clingy', 'curious' - not a clinical vocabulary, so unlike alerts/messages.py and rules_config.toml's clinical copy this is ordinary UX text an implementer can author directly per CLAUDE.md's carve-out only covering medical claims) plus a child `JournalPhoto` (journal_entry_id, ts, content_type, caption, and the image bytes) - both new tables via a new migration under repos/migrations/ (next in the existing 0001/0003/0004/0005 sequence), applied automatically by Db.migrate() same as every prior migration. Store photo bytes as a BLOB column in journal_photo rather than on the filesystem: this app has no existing static-upload storage anywhere, scripts/backup.py's VACUUM INTO backs up the sqlite file only (B1), and X1/X2's whole export story is DB-table-based - keeping photos inside the same database means backup and disaster-recovery semantics stay uniform with every other domain, with zero new infrastructure. No new dependency is needed for the upload itself: python-multipart is already in the closed dependency set (pyproject.toml, backing FastAPI's UploadFile) and is presumably already load-bearing for some existing form, so a multipart POST endpoint for photo upload needs no architect sign-off. Register 'journal' (not 'journal_photo') in EventsRepo.EDITABLE with columns {ts, title, story, temperament} - X2's notes establish that ExportService derives its DOMAINS list from EDITABLE, so this alone gives journal entries the same JSON/CSV export coverage as every other domain for free; deliberately do NOT register journal_photo there - embedding binary image data in the CSV/JSON export would break X1's pinned CSV-header-stability and round-trip contracts for every other domain sharing that code path, and photos are already covered for backup purposes by the whole-DB VACUUM INTO regardless. Add JournalService (services/journal_service.py, wired into the Services dataclass the same additive way GrowthService/AchievementsService/etc. were added - a new field, not a change to any existing signature, so no architect sign-off per U42's precedent) with: create_entry, add_photo (validates content_type is an image/* MIME type and a reasonable size cap - implementer's judgement on the exact limit, document it in this task's notes once chosen), list_entries, get_photo_bytes, and render_book(entry_ids: list[int]) -> str producing one self-contained HTML document - a new journal_book.html template, rendered via the jinja2 Environment already in use elsewhere in routers/ - with every selected entry's title/story/temperament tags and its photos inline as base64 data: URIs (no external references, no separate assets folder) so the exported file opens standalone in any browser later, matches Mark Baber's 'export... to share/view later' ask, and needs no server to view. Add a new /journal page (routers/pages.py, reachable from base.html's tabbar following the same first-run-with-no-profile redirect every other page already uses) listing entries newest-first with thumbnails and a per-entry checkbox, a form to write a new entry and attach photos, and a 'Generate book' action that POSTs the checked entry ids to a new endpoint (routers/api.py) and returns the assembled HTML as a download - this is the 'select what content goes into the book' requirement; per-photo-level selection within an entry is left to implementer's judgement as a nice-to-have, not required. Deliberately out of scope: wiring journal entries into U43's merged /history page's Edit/Clone/Delete row actions - that page's modal reuse is keyed to the six existing quick-entry panel types (quick_entry.html), and journal's own /journal page is a better-fitting place for editing a story than shoehorning a seventh panel type into that flow; if that integration is wanted later it should be its own task, not grown into this diff per CLAUDE.md's 'append a new task, don't grow the diff' rule. Also deliberately not a quick-entry tile: U1/U16's quick-entry philosophy is sub-two-second two-tap logging, which writing a story is not, so entry creation belongs on /journal itself, not the six-button Log page."
exit_criteria = ["a new migration creates journal_entry (ts, title, story, temperament) and journal_photo (journal_entry_id FK, content_type, caption, image bytes) tables, applied automatically by Db.migrate() (test)", "JournalService.create_entry persists and round-trips title/story/temperament through EventsRepo, including the empty-temperament and multi-tag cases (test)", "uploading a photo via multipart POST stores its bytes in journal_photo and a GET photo-serving endpoint returns them back byte-for-byte with the original content_type; a non-image content_type is rejected (test)", "/journal lists entries newest-first with a thumbnail per photo and a selection checkbox per entry (route test)", "POST'ing a book request with a subset of entry ids returns one self-contained HTML document containing only those entries, in chronological order, with every photo embedded as a base64 data: URI and no reference to any external file or endpoint; an entry left unchecked does not appear in the output (route test)", "journal_entry is registered in EventsRepo.EDITABLE and therefore appears in ExportService's JSON export and gets its own CSV with stable headers, extending X1's existing round-trip test; journal_photo is deliberately absent from both (test)", "/journal is reachable from base.html's tabbar and follows the existing first-run-with-no-profile redirect pattern (route test)", "the new page's static payload is measured against the Q1 weight-budget test; if it grows the budget, the test is amended in the same diff with the new total recorded (test)", "scripts/test.sh, scripts/lint.sh, and scripts/check_layers.sh green"]
notes = "Filed by Mark Baber, 2026-08-24: 'record stories and temperament of the baby to reflect upon later... ability to add pictures... export this as a book (HTML) to share/view later, where we can select what content goes into the book'. No prior task in this queue covered this - checked tasks.toml for anything matching 'story'/'stories'/'temperament'/'journal' before filing, found nothing, so this is new rather than a duplicate. Scoped as one task spanning models/repos/services/routers/templates the same way U42 (badges) and M1-M4-equivalent domain tasks elsewhere in this queue were, rather than split across separate model/service/UI tasks, since the pieces are small and tightly coupled (a domain with exactly one export shape). Photo size cap and any thumbnail-downscaling are left to the implementer to choose and record here once decided; this task deliberately does not mandate an image-processing library (e.g. Pillow) since that would be a new dependency requiring architect sign-off (SPEC §6) - if raw browser-uploaded photos prove too large for the weight/performance budget in practice, that tradeoff should come back here as a note or as a follow-up task, not be resolved by silently adding a dependency. Implementation note (2026-08-24): photo size cap chosen as MAX_PHOTO_BYTES = 8 MiB (services/journal_service.py) - generous enough for an unedited phone-camera JPEG/HEIC without any downscaling, small enough to keep a multi-photo book export and the sqlite file itself reasonable; no thumbnail downscaling was added (would need Pillow, out of scope per this note's own reasoning above), so /journal's list-page 'thumbnails' are just the full-resolution image, CSS-scaled down, served from a dedicated GET /api/journal/photo/{id} endpoint rather than inlined - only the book export inlines full photos as base64. The event table is named `journal` (not `journal_entry`, despite this task's exit_criteria wording above) to match the EventsRepo.EDITABLE key registered per this description's own instruction; the model dataclass is JournalEntry. The child table is `journal_photo`, matching the description throughout."

