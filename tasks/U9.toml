description = "timefmt currently uses the server's local zone for both parsing datetime-local input and rendering. Make the zone explicit and configurable so a phone in another timezone cannot silently shift timestamps."
exit_criteria = ["configured zone used for parse+render (test)", "DST boundary case tested"]
notes = "touches corrected 2026-08-04: amendment U2 moved timefmt from routers to models, so the path recorded here no longer existed. Note the zone is also read by series_service (local-day bucketing) and by the ribbon view, so a config-driven zone must reach the service layer, not only the templates. Implemented 2026-08-07: timefmt.to_utc/to_local keep their original single-arg signatures (public contract preserved); zone is resolved internally from a new [display].timezone key in rules_config.toml (module-level CONFIG_PATH read via tomllib+zoneinfo, default UTC), so series_service and the ribbon view pick it up transitively with no changes of their own, satisfying the 'reach the service layer' note without touching series_service.py. settings.html documents the setting as a file-edit note (ntfy convention) rather than a form field, since no route/service change was in scope. Tests added in tests/unit/test_timefmt.py cover configured-zone parse+render and both DST transitions (2026-03-29 spring-forward, 2026-10-25 fall-back) for Europe/London. scripts/backlog.py does not exist in this checkout; ran scripts/validate_tasks.py instead (exits 0) as the closest equivalent tasks.toml validator. Review pass 2026-08-15: house-reviewer flagged two in-scope issues, both fixed in timefmt.py: (1) _display_zone() re-opened and re-parsed rules_config.toml on every to_utc/to_local call -- a hot path, since series_service buckets every event -- now cached keyed on (path, mtime) so an edited file is still picked up without a restart; (2) an unrecognised IANA zone name raised uncaught, with no test covering it -- now covered by test_invalid_zone_name_raises, and left uncaught deliberately (fail loudly per SPEC R1, not a silent UTC fallback that would hide a config typo). The reviewer also flagged, as a real but out-of-scope architectural tension: _display_zone()'s own tomllib read lives in models, which SPEC A3 established as a pattern to avoid (alerts.load_rules was moved out of the alerts layer into its service for exactly this reason) -- every other rules_config.toml reader (AlertsService, TodayService) takes an injected config_path instead. Fixing that properly means threading a configured zone down from app wiring through series_service, which this task's touches list (timefmt.py, rules_config.toml, settings.html only) does not cover; flagging for a follow-up task rather than expanding this diff. ./scripts/test and python3 scripts/backlog.py both verified green 2026-08-15; ruff/mypy/check_layers.sh also green via `uv run --extra dev`."

