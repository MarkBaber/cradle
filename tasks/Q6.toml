[[task]]
id = "Q6"
phase = 6
title = "Formatting has drifted: ruff format --check reports 19 files, and no gate ever ran it"
status = "done"
routing = "impl"
depends = ["O3"]
touches = [
    "src/",
    "tests/",
    "scripts/lint.sh",
]
description = "Found 2026-08-28 while implementing O3: `ruff format --check src tests` fails on clean main at 1e4e4a7 with '19 files would be reformatted, 75 files already formatted'. This is not new drift from any one branch - it accumulated because nothing has ever run the check. scripts/lint.sh runs `ruff check` (the linter) and `mypy`, never `ruff format --check` (the formatter), and .gitlab-ci.yml's validate stage was the only place that ran it - a pipeline that has never executed, since the remote is GitHub and O3's workflow did not exist until now. Q2 ran `ruff format` once as a deliberate one-off commit in 2026-08-04 and the tree has drifted ever since with nothing to catch it. O3's validate job now runs `ruff format --check src tests`, so this is red on main from the moment O3 lands; that is the intended consequence of turning the gate on, not a reason to weaken the gate. Two parts to this task. First, run `ruff format src tests` and commit the result as its own commit, separate from anything else, exactly as Q2's notes prescribe for the same reason: it necessarily reformats files outside any one task's touches, and that is the intended one-off exception rather than something to smuggle into a feature diff. The 19 files span src/cradle/repos, src/cradle/routers, src/cradle/services and tests/ - all of it whitespace, string-quote and line-wrapping changes, no behaviour. Verify that by running scripts/test.sh before and after and confirming the same pass/fail set, which after Q5 lands should be fully green both times. Second, and this is the part that stops it recurring, add `ruff format --check src tests` to scripts/lint.sh so the local gate and the CI gate check the same things - today a contributor can run scripts/lint.sh green and still be red in CI, which is precisely the drift CLAUDE.md's 'use scripts/' rule exists to prevent, and the same one-place-not-two argument O3 makes for shelling out to scripts/ from the workflow. Put the check before the mypy call so the cheap gate fails first. Note the ordering constraint against Q5: both touch tests/routes/test_quick_entry.py and tests/routes/test_settings.py, so whichever lands second will need a rebase. Prefer landing Q5 first, since its changes are semantic and a mechanical reformat rebases onto them far more easily than the reverse."
exit_criteria = [
    "ruff format --check src tests exits 0 on the branch",
    "the reformat is its own commit, containing no non-formatting change, so the diff is reviewable as mechanical",
    "scripts/lint.sh runs ruff format --check src tests, and fails when a file is unformatted (verified by unformatting one file, running it, then reverting)",
    "scripts/test.sh reports the same set of passing and failing tests before and after the reformat, proving no behaviour changed",
    "scripts/check_layers.sh green and python3 scripts/backlog.py exits 0",
]
notes = "Depends on O3 because O3's validate job is what makes this visible and what makes it stay fixed; before O3 there was no gate to be red. Deliberately not folded into O3 itself: O3's touches are .github/workflows/ci.yml and .gitlab-ci.yml, and reformatting 19 source files inside a CI task would be exactly the diff-growth CLAUDE.md forbids. Also deliberately not folded into Q5, whose touches are four specific files chosen around two semantic root causes - a 19-file mechanical reformat sharing that branch would bury them. Implemented 2026-08-28 as two commits, per this task's own instruction and Q2's precedent: the reformat alone, then the scripts/lint.sh change. 19 files reformatted, 75 already formatted; afterwards ruff format --check reports 94 files already formatted and exits 0. Proven semantics-preserving two independent ways rather than one. First, every one of the 19 files parses to an identical AST before and after (ast.dump of the HEAD blob vs the working file), which makes the change provably formatting - whitespace, line wrapping and quote style - and unable to alter behaviour; a plain whitespace-ignoring diff would not have shown this, because ruff format also normalises single quotes to double. Second, scripts/test.sh reports the identical 625 test names with identical outcomes before and after, compared name by name out of the two junit reports rather than by count alone: 625 pass, 0 fail, 0 skip, no test added, removed, renamed or skipped. scripts/lint.sh now runs ruff format --check src tests ahead of ruff check and mypy - the cheapest gate first, so a failing gate fails fast, and the same src tests scope CI uses. Verified it actually bites by putting a double space into an import in tests/unit/test_history.py, running scripts/lint.sh, and watching it exit 1 on the format check before the linter or mypy ran at all; the file was then restored and confirmed byte-identical to its committed state. Stacked on Q5's branch rather than branched from main, deliberately: the reformat rewrites tests/routes/test_quick_entry.py and tests/routes/test_settings.py, the same two files Q5 edits, so branching from main would have produced a real content conflict on merge instead of the mechanical rebase this ordering needs. That is the ordering this task's description already called for - land Q5 first. Consequence to expect: after Q5 squash-merges, this branch needs `git rebase --onto origin/main <Q5 tip>` to drop its copy of Q5's commit, the same procedure PR #99 needed after #98 landed. Scope note: the format scope stays `src tests`, matching CI and the retired GitLab stage. It deliberately does not extend to scripts/, whose Python (cockpit.py, backlog.py and friends) is not in this task's touches and would be a far larger unrelated reformat; if that is wanted it should be its own task. Promoted review -> done 2026-08-28: the validate job is green on main, and the gate this task added to scripts/lint.sh has already earned its keep - it caught tests/unit/test_dispatch_models.py as unformatted when O5 rebased onto a main containing Q6. Exactly the drift it exists to catch, found at a branch instead of accumulating unseen."

