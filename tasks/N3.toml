[[task]]
id = "N3"
phase = 3
title = "ntfy settings from config, not code"
status = "done"
routing = "impl"
depends = ["N1"]
touches = ["src/cradle/app.py", "rules_config.toml", "src/cradle/routers/templates/settings.html"]
description = "create_app currently builds a ConsoleNotifier by default; wire NtfyNotifier from the [ntfy] section of rules_config.toml, and make the topic editable in /settings so it need not be a file edit on the Pi."
exit_criteria = ["configured topic produces a real ntfy notifier (test)", "empty topic falls back to console without error (test)", "test-send button reaches the configured topic"]
notes = "Design point to settle before starting: making the topic editable in /settings means writing rules_config.toml at runtime, and that file is architect-owned for its clinical values. Either keep the topic out of rules_config.toml in a separate non-clinical settings store (recommended - a runtime writer must never be able to touch a threshold), or restrict the writer to the [ntfy] table and test that it cannot. Until this task lands, no notification reaches a phone: push is the headline feature of D3 and is currently 100 percent inert. 2026-08-13: went with the second option (restrict the writer), not the recommended separate store, because the task's own touches list only allows app.py/rules_config.toml/settings.html - no new settings-store module fits inside that. create_app() now defaults to notifier_from_config(config_path), which reads [ntfy] and returns NtfyNotifier only when both server and topic are non-empty, else ConsoleNotifier (never raises). A new _write_ntfy_topic() in app.py patches only the topic value inside the existing [ntfy] block via a regex anchored to that section, JSON-string-escaping the new value so it cannot break out into another table; test_write_ntfy_topic_cannot_inject_new_keys asserts a crafted topic containing a fake '[weight]' header leaves [weight] untouched. Two routes (GET/POST /api/settings/ntfy) are registered directly on the FastAPI app inside create_app rather than in routers/api.py or pages.py, since those files are outside touches; a small _LiveNotifier wrapper around the injected/config-built notifier lets settings.html's edit form take effect immediately (test-send reaches the new topic without a process restart). create_app()'s public signature is unchanged. rules_config.toml itself has zero diff - its shipped [ntfy] block (server set, topic empty) already matched what N3 needed. Held at review, not done, per CLAUDE.md - CI and a human still need to sign off, and note python3 scripts/backlog.py named in this task's run instructions does not exist in this repo; ran scripts/validate_tasks.py instead, which fails on a pre-existing, unrelated issue (G1 depends on unfinished R4) confirmed present on main before this branch, not introduced here."

