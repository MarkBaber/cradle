[[task]]
id = "U14"
phase = 6
title = "Express button and the milk-stock page"
status = "done"
routing = "impl"
depends = ["V2"]
touches = ["src/cradle/routers/api.py", "src/cradle/routers/pages.py", "src/cradle/routers/templates/quick_entry.html", "src/cradle/routers/templates/milk.html", "src/cradle/routers/templates/base.html", "tests/routes/test_milk.py", "src/cradle/routers/deps.py", "src/cradle/app.py", "src/cradle/services/logging_service.py", "src/cradle/services/milk_service.py"]
description = "Quick-entry gains an Express button that logs an expression in one tap, keeping the T1 two-tap contract: volume and duration are post-hoc edits exactly as bottle volume is (U10), never an entry gate at 4am. A new /milk page lists live batches grouped by store - each row a colour chip with its colour named in text beside it, the volume, when it went in to cool and how old it is - plus forms to put an expression into the fridge or freezer under a chosen colour, move a batch from freezer to fridge, and mark it opened, used or discarded. The colour picker offers only colours with no live batch, so the M1 uniqueness constraint can never be hit from the UI."
exit_criteria = ["expressing is logged in two taps and volume is never required at entry (route test)", "store -> thaw -> open -> use, and store -> discard, both end to end (route test)", "colour picker excludes colours already live (route test)", "/milk shows store, colour name, volume and age for every live batch (route test)", "quick-entry static payload stays inside the Q1 weight budget"]
notes = "Colour must never be the only carrier of meaning: name the colour in text next to every chip. A parent with colour-vision deficiency has to find the right bottle in a dark kitchen, and the A11 alert will quote the colour by name anyway. /milk is not exempt from the Q1 weight budget the way /charts is, so htmx only - no new JS and no new dependency (SPEC 6). Implemented: all exit criteria pass (11 new route tests), lint/mypy strict/check_layers.sh/scripts/test.sh green (336 passed), Q1 budget green. Touch list expanded beyond the original 4 with sign-off, additions-only, no existing public signature changed: V2's MilkStockService was built but never wired into the app (no `milk` field on routers/deps.py's Services, never instantiated in app.py's build_services) and there was no one-tap bare-expression logger - both are gaps in V2/M1, not something U14 could route around within its original touches. Fixed by adding Services.milk (deps.py/app.py), LoggingService.log_expression (mirrors log_feed/log_nappy), and MilkStockService.store_now (wraps the existing store_expression using the service's own injected clock, since routers may not import ports directly per layering - a Services.clock field was tried first and reverted when check_layers.sh caught it). Flag for reviewer: history_service.DOMAINS does not yet include \"expression\"/\"milk_batch\", so the post-hoc volume/duration edit this task's description promises is only reachable by hand-crafting a POST to /api/edit-field, not from the /history UI yet - EDITABLE already allows it (M1), this is a UI gap for a follow-up task, same shape as the one X2/V2 already flagged for milk_batch."

