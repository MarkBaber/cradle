notes = "Pure housekeeping - no contract change, so not architect-routed: M2 already took the sign-off for the dataclass and the enum themselves. Keep it a two-file diff. IMPLEMENTATION 2026-08-25, status review: both names added to models/__init__.py imports and __all__ in alphabetical order; events_repo.py's two submodule imports collapsed into the single cradle.models import block and the exception-explaining docstring paragraph dropped. scripts/test.sh (554 tests), scripts/lint.sh, scripts/check_layers.sh, and backlog.py all green. Diff scoped to exactly the two touches files."

