<table id="history">
  <tbody>
  {% for r in rows %}
    <tr id="{{ r.table }}-{{ r.event_id }}" class="{{ 'focus' if focus == r.table ~ ':' ~ r.event_id|string }}">
      <td class="t">{{ (r.ts | local).strftime('%d %b %H:%M') }}</td>
      <td class="d"><span class="tag {{ r.table }}">{{ r.table }}</span> {{ r.detail }}
        {%- if r.logged_by %} <span class="by">by {{ r.logged_by }}</span>{% endif %}</td>
      <td class="a">
        <form method="post" action="/api/adjust-time" hx-post="/api/adjust-time"
              hx-target="#toast" hx-swap="innerHTML" class="inline">
          <input type="hidden" name="table" value="{{ r.table }}">
          <input type="hidden" name="event_id" value="{{ r.event_id }}">
          <input type="datetime-local" name="ts" value="{{ (r.ts | local).strftime('%Y-%m-%dT%H:%M') }}">
          <button type="submit">Set</button>
        </form>
        {% if r.table == "feed" %}
        <form method="post" action="/api/edit-field" hx-post="/api/edit-field"
              hx-target="#toast" hx-swap="innerHTML" class="inline">
          <input type="hidden" name="table" value="feed">
          <input type="hidden" name="event_id" value="{{ r.event_id }}">
          <input type="hidden" name="field" value="volume_ml">
          <input type="number" name="value" min="0" placeholder="ml">
          <button type="submit">Set ml</button>
        </form>
        <form method="post" action="/api/edit-field" hx-post="/api/edit-field"
              hx-target="#toast" hx-swap="innerHTML" class="inline">
          <input type="hidden" name="table" value="feed">
          <input type="hidden" name="event_id" value="{{ r.event_id }}">
          <input type="hidden" name="field" value="duration_min">
          <input type="number" name="value" min="0" placeholder="min">
          <button type="submit">Set min</button>
        </form>
        {% elif r.table == "sleep" %}
        <form method="post" action="/api/edit-field" hx-post="/api/edit-field"
              hx-target="#toast" hx-swap="innerHTML" class="inline">
          <input type="hidden" name="table" value="sleep">
          <input type="hidden" name="event_id" value="{{ r.event_id }}">
          <input type="hidden" name="field" value="ts_end">
          <input type="datetime-local" name="value">
          <button type="submit">Set wake</button>
        </form>
        {% endif %}
        <form method="post" action="/api/delete" hx-post="/api/delete"
              hx-target="#{{ r.table }}-{{ r.event_id }}" hx-swap="outerHTML" class="inline">
          <input type="hidden" name="table" value="{{ r.table }}">
          <input type="hidden" name="event_id" value="{{ r.event_id }}">
          <button type="submit" class="del">Delete</button>
        </form>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="3" class="empty">Nothing logged yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
